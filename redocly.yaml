# The API description is linted like everything else here. `redocly lint` is
# invoked bare rather than pointed at a file, so the hook and CI cannot end up
# checking different things — what gets linted is whatever is listed below.
apis:
  forge-dashboard:
    root: api/openapi.yaml

# Strict because the spec is new. `recommended` on its own promotes nothing to
# an error, and `lint` exits 0 when every finding is a warning — so a job left
# on it passes with a screen full of them, and the ruleset is the gate rather
# than any flag. `minimal` is for adopting this into an API that's already
# shipped.
extends:
  - recommended-strict

rules:
  # /healthz ignores the request and answers 200 to anything. There's no 4xx
  # to document, and inventing one to satisfy the rule would be the first lie
  # in the file.
  operation-4xx-response: off

# It's a linter. It has no business reporting what we lint.
telemetry: off

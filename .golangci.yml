version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - dupl
    - err113
    - errorlint
    - funlen
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - makezero
    - misspell
    - modernize
    - nlreturn
    - nolintlint
    - perfsprint
    - revive
    - sqlclosecheck
    - testifylint
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
    - wrapcheck
  exclusions:
    rules:
      # Tests repeat, run long and build throwaway errors on purpose; these
      # linters are for production code.
      - path: _test\.go
        linters:
          - dupl
          - err113
          - funlen
  settings:
    gocritic:
      enabled-checks:
        - emptyStringTest
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
    nolintlint:
      require-explanation: true
      require-specific: true
    testifylint:
      enable-all: true
formatters:
  enable:
    - gci
    - gofumpt
    - goimports

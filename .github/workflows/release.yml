# Nobody picks a version. release-please reads the Conventional Commits that
# land on main and keeps a release pull request open carrying the next
# version and the changelog entry; merging that pull request tags the
# release and writes the notes. goreleaser then hangs the binaries and the
# ghcr.io image on the release already sitting there.
#
# One workflow rather than two, because a tag pushed with GITHUB_TOKEN starts
# no further workflow run — GitHub refuses, to stop recursive runs. A
# separate on-tag workflow would silently never fire, and the first symptom
# is a release with no binaries on it.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never two releases at once, and never cancel one halfway: a killed run can
# leave a tag pushed and nothing published against it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Works out what, if anything, is being released. Most runs only refresh
  # the release pull request; the run that matters is the one where that
  # pull request was what just landed.
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # tags the release and writes it
      pull-requests: write # keeps the release pull request up to date
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artefacts:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # attaches the binaries to the release
      packages: write # pushes the image to ghcr.io
      id-token: write # mints the Sigstore OIDC token the attestation is signed with
      attestations: write # publishes the attestation to the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag, not the branch: goreleaser takes the version from the
          # ref it's standing on, and needs the history to build from.
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # goreleaser's own before.hooks run `bun install`/`bun run build:web`
      # (see .goreleaser.yml) to produce the SvelteKit-migrated pages
      # //go:embed reads at compile time — this just puts bun on PATH for
      # that shell to find; the actual build step lives in .goreleaser.yml
      # so `goreleaser build --snapshot` reproduces it locally too.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # arm64 has no native runner here, so its image builds under QEMU
      # emulation — cheap now that Dockerfile.release only COPYs a binary
      # goreleaser already cross-compiled natively, rather than running
      # `go build` itself under emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser-action fetches a prebuilt, checksum-verified binary
      # instead of `go install`-ing the whole tool from source on every run.
      - name: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA Build L2: a signed, Sigstore-backed attestation tying these
      # exact files to this workflow run. Provenance, not signing — the
      # archives themselves aren't cosign-signed, a separate decision left
      # for whenever a real consumer verifies one.
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz,dist/checksums.txt"

  # Not release-critical — a stale or missing README screenshot is a
  # documentation nit, never a reason to hold up the binaries and image
  # `artefacts` just shipped. continue-on-error so a failure here shows
  # as a yellow warning on the run rather than a red one.
  #
  # Opens a pull request rather than pushing straight to main: main
  # requires the same status checks every other pull request does
  # (branch protection), so there's no bypassing that gate even for a
  # docs-only change. RELEASE_TOKEN, not the default GITHUB_TOKEN, for
  # the same reason release-auto-merge.yml uses it — GitHub suppresses
  # the events a GITHUB_TOKEN-driven push produces, which would leave
  # this pull request's own required checks never triggered.
  screenshots:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    # This job commits and pushes itself (the "open a pull request" step
    # below) — tooling.md's rule for exactly that: without it, `git push`
    # fires the repo's own lefthook pre-push hooks against a commit
    # nothing interactively made, in a job that never installed half of
    # what they expect (vale, most concretely — confirmed live, this is
    # why that step failed outright: "vale: command not found").
    env:
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: go build -o forge-dashboard ./cmd/forge-dashboard

      - name: capture dashboard screenshots against a real binary, fixture data only
        env:
          ADDR: ":8080"
          GITHUB_TOKEN: ""
          FORGEJO_URL: ""
          FORGEJO_TOKEN: ""
          DB_PATH: "./tmp-screenshots-data/forge-dashboard.db"
          RP_ID: "localhost"
          RP_ORIGIN: "http://localhost:8080"
        run: |
          export ENCRYPTION_KEY="$(openssl rand -base64 32)"
          ./forge-dashboard &
          echo $! > server.pid
          npx wait-on http://localhost:8080/healthz
          # Real node, not bun's own runtime — this shells out to a
          # browser process, the exact case javascript.md's "install a
          # real node" rule is about; ubuntu-24.04 ships one already.
          bun run capture-screenshots
          kill "$(cat server.pid)"

      - name: open a pull request if the screenshots changed
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if git diff --quiet -- docs/screenshots; then
            echo "Screenshots unchanged, nothing to do."
            exit 0
          fi
          git config user.name "release-please[bot]"
          git config user.email "release-please[bot]@users.noreply.github.com"
          branch="chore/readme-screenshots-${{ needs.release-please.outputs.tag_name }}"
          git checkout -b "$branch"
          git add docs/screenshots
          git commit -m "docs: refresh README screenshots for ${{ needs.release-please.outputs.tag_name }}"
          git push origin "$branch"
          gh pr create --title "docs: refresh README screenshots for ${{ needs.release-please.outputs.tag_name }}" \
            --body "Automated: regenerated by the release workflow's screenshots job against fixture data, not a real account's forges." \
            --base main --head "$branch"
          gh pr merge --auto --squash "$branch"

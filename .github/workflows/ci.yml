# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job that needs more says so itself.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # No hooks in a pipeline (tooling.md): a `bun install` here would otherwise
  # install lefthook's own git hooks into a checkout nothing commits from.
  LEFTHOOK: 0
  # The same version the pre-commit hook runs. When these two disagree the
  # hook passes and the pipeline fails, and the reason isn't obvious from the
  # failure.
  GOLANGCI_LINT_VERSION: v2.13.1

jobs:
  # Works out which kinds of file the change touches, so each job below runs
  # only when a file it reads changed (rules/ci.md). A job skipped by `if:`
  # reports as skipped, which satisfies a required check, so branch
  # protection needs no change. Every push to main runs everything: the
  # default branch's own pipeline is never filtered. scripts/changed-areas.sh
  # holds the mapping and scripts/test-changed-areas.sh its tests.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.areas.outputs.go }}
      web: ${{ steps.areas.outputs.web }}
      image: ${{ steps.areas.outputs.image }}
      e2e: ${{ steps.areas.outputs.e2e }}
      hadolint: ${{ steps.areas.outputs.hadolint }}
      prose: ${{ steps.areas.outputs.prose }}
      api: ${{ steps.areas.outputs.api }}
      release: ${{ steps.areas.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: test the mapping
        run: scripts/test-changed-areas.sh
      - name: test the release type check
        run: scripts/test-check-release-type.sh
      - name: check the Vale pins agree
        run: scripts/test-vale-pin.sh
      - name: check the hadolint pins agree
        run: scripts/test-hadolint-pin.sh
      - name: changed areas
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "$BASE...$HEAD" | scripts/changed-areas.sh | tee -a "$GITHUB_OUTPUT"
          else
            printf 'go=true\nweb=true\nimage=true\ne2e=true\nhadolint=true\nprose=true\napi=true\nrelease=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: gofmt
        # golangci-lint's formatter reports rather than rewrites here; this
        # is the check that a file was committed unformatted.
        run: gofmt -l . | (! grep .)
      - name: go.mod is canonical
        run: go mod edit -fmt go.mod && git diff --exit-code go.mod
      - name: go.mod is tidy
        # go-mod.md: broader than the fmt check above — a stale require, a
        # non-canonical version string, or a go.sum entry nothing imports
        # anymore, none of which `go build`/`go test` catch on their own.
        run: go mod tidy -diff

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Read once here so the upload steps below can gate on it in an `if`
      # without referencing `secrets.*` directly at step level.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test
        # -coverpkg=./..., not the default: without it, coverage only counts
        # each package's own tests, and a thin handler package under-reports
        # since the logic it calls lives elsewhere.
        run: |
          go run gotest.tools/gotestsum@v1.13.0 --junitfile junit.xml -- \
            -race -covermode=atomic -coverprofile=coverage.out -coverpkg=./... ./...
      - name: Report coverage
        if: ${{ !cancelled() }}
        run: |
          go tool cover -func=coverage.out | tail -1 |
            awk '{ print "**Coverage: " $3 "**" }' >> "$GITHUB_STEP_SUMMARY"
      # What fails the job and what only warns (#948). Our own reports must
      # exist and parse, checked here where the failure is ours. The uploads
      # then set fail_ci_if_error: false, so an outage on Codecov's side (TLS
      # handshake, ingest retries) warns instead of failing a green change.
      - name: Check the coverage and test reports
        if: ${{ !cancelled() }}
        run: |
          test -s coverage.out
          go tool cover -func=coverage.out > /dev/null
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('junit.xml')"
      # Skipped until CODECOV_TOKEN is set on the repo (repo-creation.md:
      # signing in to codecov.io is a browser step only the account owner
      # can do) — a missing secret isn't a coverage problem.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: false

  build:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...

  # go-test.md's container/integration layer: a real Forgejo instance in a
  # container, not a mock — see integration/forgejo_test.go's header
  # comment for why this is a separate build tag and job rather than part
  # of the ordinary `go test ./...` above.
  container-integration:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -tags=integration ./integration/... -v

  # dependencies.md: pinning stops a version drifting, not a CVE existing in
  # it — this is the check that actually notices one.
  govulncheck:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # No check-only flag on `go mod edit -fmt`, so this is the pre-commit
  # fixer's twin from lefthook.yml: run it again and diff.
  gomod:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go mod edit -fmt
        run: go mod edit -fmt go.mod && git diff --exit-code go.mod

  # rules/go-releases.md: a broken .goreleaser.yml should fail here, not on
  # release day. The same goreleaser version the release job runs (v2.17.1),
  # from its official image pinned by digest, as the hadolint job does.
  goreleaser:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: goreleaser/goreleaser:v2.17.1@sha256:1098a0be4da1780f9616a85f4c5050447b53e3e74804d8017ec1e2bbb1fb697a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # goreleaser reads git state, and the checkout isn't owned by the
      # container's user.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: goreleaser check

  dockerfile:
    needs: changes
    if: needs.changes.outputs.hadolint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552
    steps:
      # hadolint never shells out to git, so unlike every other job here it
      # doesn't need the safe.directory fix (or git installed at all).
      - run: apk add --no-cache nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: hadolint Dockerfile Dockerfile.release

  # Proves the source-build image still builds before anyone merges.
  # Dockerfile.release only ever runs inside goreleaser (it COPYs a binary
  # goreleaser already cross-compiled), so there's nothing to `docker build`
  # here for it standalone.
  docker:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build .

  # Drives the real served page — including at phone width — and fails the
  # run on any axe-core violation. rules/a11y.md: a scan that only reports
  # is a scan nobody acts on.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    # The suite takes 10 to 11.5 minutes depending on the runner, so 12 left
    # no headroom and a slow runner timed out a green run. 20 still stops a
    # hung job well before the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build:web
      - run: go build -o forge-dashboard ./cmd/forge-dashboard
      - name: run journey tests against a real binary
        env:
          ADDR: ":8080"
          GITHUB_TOKEN: ""
          FORGEJO_URL: ""
          FORGEJO_TOKEN: ""
          # A plain runner, not the distroless image's /data volume — kept
          # inside the workspace so it's cleaned up with everything else.
          DB_PATH: "./tmp-e2e-data/forge-dashboard.db"
          RP_ID: "localhost"
          RP_ORIGIN: "http://localhost:8080"
        run: |
          # Generated fresh each run rather than a fixed value committed to
          # the workflow — this job's database never outlives the run, and
          # a hardcoded key here reads as a leaked secret to gitleaks even
          # though it's a throwaway.
          export ENCRYPTION_KEY="$(openssl rand -base64 32)"
          ./forge-dashboard &
          echo $! > server.pid
          npx wait-on http://localhost:8080/healthz
          bunx playwright test
          # Lighthouse, not Playwright/axe-core again — performance, best-
          # practices and SEO budgets, none of which axe-core or any other
          # check here covers. Accessibility is deliberately off in
          # lighthouserc.json: a11y.md's axe-core scan above is the
          # account's one chosen accessibility tool, not something to
          # duplicate with a second, less precise one. Scoped to
          # /login.html only — the one page this app serves with no
          # session — since auditing anything behind auth would need its
          # own Puppeteer login script the way Playwright's own tests use
          # a CDP virtual authenticator; left for a follow-up rather than
          # bundled in here. Reuses this same already-running binary,
          # rather than a second server boot.
          bunx lhci autorun
          kill "$(cat server.pid)"
      - name: upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore

  # Layout and structure. Style and mechanics are prose.yml — see its header
  # comment for why they're split out.
  prose:
    needs: changes
    if: needs.changes.outputs.prose == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        # Frozen, so a drifted lockfile fails the job rather than silently
        # resolving to something nobody committed.
        run: bun install --frozen-lockfile
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  # The API description is a contract. This proves the document is valid
  # OpenAPI. That the handlers still match it is the Go contract tests in
  # internal/api (openapi_contract_test.go, run by the test job), which
  # validate recorded responses against this document with kin-openapi.
  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: redocly lint
        run: bun run lint:api -- --format=github-actions

  # rules/javascript.md: a static security pass over the web code. Not
  # `semgrep ci`, which needs a Semgrep account login this repo has no token
  # for; `semgrep scan` with named rule packs needs none. Semgrep can't parse
  # .svelte, so .semgrep/svelte.yml reads templates as text and flags every
  # {@html}. The image is pinned by tag and digest.
  semgrep:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: semgrep scan
        run: >-
          semgrep scan --config p/javascript --config p/typescript
          --config .semgrep --metrics=off --error web/src tests scripts

  # OWASP's API security rules over the same spec (rules/api.md). Errors fail
  # it; warnings print. Its own job, so a security finding names itself
  # instead of hiding behind "the spec is invalid".
  api-security:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: spectral lint
        run: bun run lint:api:security

  # Publishes docs/api/index.html (Scalar) to GitHub Pages,
  # pointed at the same spec `api` above just linted -- gated on that job
  # rather than its own check, since a docs page built from an unlinted
  # spec isn't worth publishing. `needs:` only resolves within one workflow
  # file, which is why this is a job here rather than a separate workflow:
  # `api` already runs on push to main, so the dependency is real.
  pages:
    needs: api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://alrayyes.github.io/forge-dashboard/docs/api/
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: assemble the Pages artifact
        # Mirrors just the paths the page's own relative apiDescriptionUrl
        # expects -- docs/api/index.html two directories above
        # api/openapi.yaml -- plus llms.txt (llmstxt.org), scoped to
        # docs/api/ since that's the only page actually deployed here --
        # rather than uploading the whole checkout.
        run: |
          mkdir -p site/docs/api site/api
          cp docs/api/index.html site/docs/api/index.html
          cp docs/api/llms.txt site/docs/api/llms.txt
          cp api/openapi.yaml site/api/openapi.yaml
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Biome leads for every file type it supports -- linting.md. Same command
  # the pre-push hook runs, so the two can't drift.
  js:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: biome check
        run: bun run lint:js
      - name: package.json order
        run: bun run lint:pkg

  # rules/dependencies.md: bun audit on every push, the way govulncheck covers
  # Go. scripts/audit.sh holds the dated ignores and the one registry retry.
  audit:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: bun audit
        run: scripts/audit.sh

  # Biome has no Svelte parser (biome.json excludes .svelte entirely) — this
  # is that file type's own check: svelte-check runs the TypeScript compiler
  # and the Svelte compiler's own a11y/unused-CSS diagnostics together.
  svelte-check:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: svelte-check
        run: bun run check:web

  # Playwright transpiles the tests but never type-checks them, so this
  # runs tsc over tests/, scripts/ and playwright.config.ts on its own.
  tests-types:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: tsc
        run: bun run check:tests

  # A hook is something you can skip, and the version number depends on
  # these messages being right, so the whole branch is checked here too.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
      - name: release type
        # A feat, fix or perf change has to touch something that ships. The
        # commits are checked one by one, and the pull request title against
        # the whole diff, since a squash merge turns the title into the
        # commit release-please reads.
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          scripts/check-release-type.sh range "$BASE" "$HEAD"
          scripts/check-release-type.sh title "$TITLE" "$BASE" "$HEAD"

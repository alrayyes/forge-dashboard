# Dependabot bumps @playwright/test in package.json and bun.lock but can't edit
# the ci-playwright image pin in the workflows, so scripts/test-playwright-image.sh
# failed every Playwright bump until someone repinned by hand (#4671). This does
# that edit on Dependabot's branch: one commit, tag and digest in every image
# line of ci.yml and release.yml. Ported from movie-planner-web's workflow of
# the same name (its PR #989, hardened in #993).
#
# pull_request, not pull_request_target: Dependabot's pull requests come from a
# branch on this repo, never a fork. Dependabot-triggered runs read Dependabot
# secrets, not Actions secrets, so RELEASE_TOKEN has to exist in both stores.
#
# RELEASE_TOKEN, not GITHUB_TOKEN: GitHub starts no workflow run for a push made
# with GITHUB_TOKEN, so the repinned head would sit with no CI at all. The push
# comes from RELEASE_TOKEN, handed to the push step alone: the checkout keeps no
# credentials, so the script run from Dependabot's branch never sees the token.
#
# The checkout is the head SHA, not the branch name, so a push between the
# trigger and the checkout can't swap in a commit this run wasn't started for.
# The push then fails as non-fast-forward if the branch has moved on.
#
# No loop: the run the push triggers has the token's owner as actor, so this
# job skips it. A run that finds the pin already right commits nothing. A
# Dependabot rebase drops the repin commit and starts this job again.
name: pin-playwright-image

on:
  pull_request:
    paths: [package.json]

permissions:
  contents: read

concurrency:
  group: pin-playwright-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  LEFTHOOK: "0"

jobs:
  pin:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Dependabot's pull_request runs get a read-only default token unless the
    # workflow asks, as dependabot-auto-merge.yml does. Only the comment uses it.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check RELEASE_TOKEN reaches Dependabot runs
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is empty. Add it as a Dependabot secret: gh secret set RELEASE_TOKEN --app dependabot"
            exit 1
          fi
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # A bump that leaves @playwright/test alone has nothing to repin, and
      # resolving a digest would let a ghcr blip fail an unrelated pull request.
      - name: Check whether @playwright/test changed
        id: version
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          before=$(git show "$BASE_SHA:package.json" | grep -oE '"@playwright/test": "[^"]+"' || true)
          after=$(grep -oE '"@playwright/test": "[^"]+"' package.json || true)
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - if: steps.version.outputs.changed == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Fails, and so fails the pull request, when ci-playwright hasn't built
      # this Playwright version yet. Re-run the job once it has.
      - name: Repin the image
        if: steps.version.outputs.changed == 'true'
        run: bun scripts/pin-playwright-image.ts
      - name: Commit the new pin
        id: commit
        if: steps.version.outputs.changed == 'true'
        run: |
          if git diff --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          version=$(grep -oE '"@playwright/test": "[0-9.]+"' package.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "build(deps): pin the ci-playwright image for ${version}"
          auth=$(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/$HEAD_REF"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
      - name: Comment on the pull request
        if: steps.commit.outputs.version != ''
        run: |
          gh pr comment "$PR_URL" --body "Repinned the ci-playwright image to ${VERSION} in \`ci.yml\` and \`release.yml\` (tag and digest). Pushed by the pin-playwright-image workflow, so this head is the one CI runs on. If the image's Bun differs from \`packageManager\`, the Bun check still needs a person."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          VERSION: ${{ steps.commit.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Sends the openapi-spec-updated repository_dispatch each SDK repo's own
# regenerate.yml listens for (rules/sdk-generation.md, issue #366).
name: openapi-dispatch

on:
  push:
    branches: [main]
    paths:
      - api/openapi.yaml

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        repo:
          - forge-dashboard-sdk-go
          - forge-dashboard-sdk-node
          - forge-dashboard-sdk-python
          - forge-dashboard-sdk-php
    steps:
      # Needs repo scope on all four SDK repos -- the default GITHUB_TOKEN
      # is scoped to forge-dashboard alone and can't call another repo's
      # dispatches endpoint. RELEASE_TOKEN already exists on this repo and
      # is the account's established PAT for exactly this kind of
      # cross-repo repository_dispatch call (alrayyes/Hush-Hush's
      # release.yml notify-sdks job) -- SDK_DISPATCH_TOKEN was never
      # actually created, so this job's dispatch has been failing silently
      # on empty auth since it was added.
      - name: fire repository_dispatch at ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh api "repos/alrayyes/${{ matrix.repo }}/dispatches" \
            -f event_type=openapi-spec-updated

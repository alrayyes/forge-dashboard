# Dependabot raises the pull request; CI decides whether it lands. Everything
# here is pinned to an exact version, which is the whole reason this works:
# a floating range drifts silently and there's nothing to raise a pull
# request about.
#
# What it watches: Go modules, GitHub Actions, the JavaScript packages in
# package.json and web/package.json, and the base-image digests in
# Dockerfile and Dockerfile.release (the docker entry below).
#
# What it can't see, and is bumped by hand, because the pin sits inside a
# script or a command line rather than a file an ecosystem reads: the golang
# image in scripts/go-docker.sh, the golangci-lint image in
# scripts/golangci-lint-docker.sh, the goreleaser image in
# scripts/goreleaser-docker.sh, lefthook.yml and ci.yml (the release job's
# goreleaser version is its own pin in release.yml), the hadolint image in
# lefthook.yml and ci.yml, and the `go run ...@vX` pins (gotestsum,
# govulncheck). Moving them into Dockerfiles or go.mod just so a bot sees
# them is a bigger change than the bumps cost.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    commit-message:
      # Conventional Commits, because commitlint checks these messages and
      # the version number is computed from them. gomod ships in the built
      # binary, so a bump here is a change to what ships whether or not it's
      # security-relevant, and fix: cuts the patch release the same way any
      # other fix does. github-actions below stays ci: — it changes the
      # pipeline, not the artifact.
      prefix: fix
      include: scope
    groups:
      go-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      # Grouping (even a group of one) keeps a major bump on Dependabot's
      # lowercase group-title template instead of falling back to its
      # sentence-case single-update one, which fails commitlint's
      # subject-case rule on the raw commit - see rules/releases.md.
      go-dependencies-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        patterns: ["*"]
        update-types: [major]

  # The base images in Dockerfile and Dockerfile.release (bun, golang,
  # busybox, distroless). They go into the shipped image, so a bump is a
  # change to what ships and gets fix:, like gomod.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: fix
      include: scope
    groups:
      docker-images:
        patterns: ["*"]
        update-types: [minor, patch]
      docker-images-major:
        patterns: ["*"]
        update-types: [major]

  # The web UI. Two entries, because Dependabot sets one commit prefix per
  # entry, not per package, and bun has no `prefix-development`. The split is
  # by directory plus `allow: dependency-type`: web/package.json keeps what
  # the build compiles into the shipped UI (svelte, @sveltejs/kit, the
  # fontsource packages) in `dependencies`, and a bump there is a change to
  # what ships, so fix:. Everything else is tooling and gets chore:. Keep that
  # split true when adding a package (see #1006).
  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    allow:
      - dependency-type: production
    commit-message:
      prefix: fix
      include: scope
    groups:
      web-shipped:
        patterns: ["*"]
        update-types: [minor, patch]
      web-shipped-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    allow:
      - dependency-type: development
    commit-message:
      prefix: chore
      include: scope
    groups:
      tooling:
        patterns: ["*"]
        update-types: [minor, patch]
      tooling-major:
        patterns: ["*"]
        update-types: [major]
    ignore:
      # TypeScript 7 (PR #508) needs svelte-check's dual TS6+TS7 --tsgo
      # setup, which this repo doesn't have; check:web fails outright
      # without it. Drop this once svelte-check supports it plainly, or
      # the dual-install is set up on purpose.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

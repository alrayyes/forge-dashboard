# This file instructs Redocly's linter to ignore the rules contained for specific parts of your API.
# See https://redocly.com/docs/cli/ for more information.
api/openapi.yaml:
  # The OAuth callback only ever redirects (303) or fails; a 2XX would be a lie.
  operation-2xx-response:
    - "#/paths/~1api~1v1~1connections~1forgejo~1callback/get/responses"
    - "#/paths/~1api~1v1~1connections~1github~1callback/get/responses"
    - "#/paths/~1api~1v1~1connections~1github~1installed/get/responses"
  # The code rides in the query of a redirect to the /setup page, which OpenAPI
  # cannot reference from a response; the schema documents it for page authors.
  no-unused-components:
    - "#/components/schemas/SetupErrorCode"

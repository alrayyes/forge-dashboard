  /api/queued-actions:
    get:
      operationId: listQueuedActions
      summary: List the signed-in user's queued actions, waiting and recently finished
      description: |
        Every action the user queued to run when a rate-limited forge
        resets, oldest first: the ones still `queued`, and the
        final ones (`done`, `skipped`, `failed`) kept for 24 hours so a
        client can show the outcome in its Activity list. The same list
        rides along on GET /api/dashboard as `queuedActions`.
      tags: [queued-actions]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The user's queue. Always an array, empty when there is nothing queued.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueuedAction"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: queueAction
      summary: Queue a safe action to run when a rate-limited forge resets
      description: |
        Stores the intent server-side. When the forge's budget comes back
        the server reads the pull request again and runs the action only
        if it still applies; otherwise it records why it did nothing. It
        survives a page reload and a server restart.

        Only safe, idempotent actions can be queued: `update_branch`,
        `dependabot_rebase` and `renovate_rebase`. Merge and Close are not
        queueable and answer 400: they would act unattended on a pull
        request whose checks or commits may have changed. To merge once
        the limit lifts, use the forge's own auto-merge.

        The forge must be rate limited right now (a spent budget in
        `forges[].rateLimitRest` or `rateLimitGraphql` whose `resetsAt` is
        ahead), otherwise there is nothing to wait for and the action
        should be taken directly: 409 `not_rate_limited`. The pull request
        must be on the signed-in user's board and offer the action
        (`allowedActions`) and be behind its base branch, with the same
        409 codes the direct action answers. The queued item runs with
        the user's own saved credentials for that forge, never anyone
        else's. Queueing the same action on the same pull request twice
        returns the first item with 200.
      tags: [queued-actions]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueuedActionRequest"
      responses:
        "201":
          description: Queued. `runAt` is the forge's reset time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedAction"
        "200":
          description: This action was already queued on this pull request. The existing item, unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedAction"
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", or `action` is not queueable (Merge, Close and
            every other action are refused here).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The pull request isn't on the signed-in user's board, or the user has no credentials saved for that forge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Nothing to queue. `not_rate_limited`: the forge isn't rate
            limited, act directly. Otherwise the pull request's
            `allowedActions` has no usable entry for the action, with that
            entry's `code` and `message`, or `already_up_to_date` for a
            pull request that isn't behind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"

  /api/queued-actions/{id}:
    delete:
      operationId: cancelQueuedAction
      summary: Cancel a queued action, or clear a finished one from the list
      description: |
        A queued action that has not run is removed and nothing runs. A
        finished one is cleared from the list. An id that isn't the
        signed-in user's answers 404, the same as one that doesn't exist.
      tags: [queued-actions]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: A `QueuedAction.id`.
      responses:
        "204":
          description: Removed.
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such queued action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /readyz:
    get:
      operationId: ready
      x-mcp-excluded: "A readiness probe for the orchestrator."
      summary: Readiness
      description: |
        Answers 200 once the server can actually serve: the database answers
        a ping with its schema in place, and the first dashboard refresh has
        completed, or 30 seconds have passed since it started. The wait is
        bounded because how fast a forge answers is how fresh the data is,
        not whether the server can serve: a slow or unreachable forge must not
        keep the container unready. A refresh that finished with a forge
        unreachable counts, and a forge going unreachable afterwards never
        turns this into a 503. See forges[].reachable on the dashboard
        response for that. Before any account has signed in there is no
        refresh to wait for, so only the database is checked.

        The database ping gets 2 seconds, less than the HEALTHCHECK's own 5,
        so a database that doesn't answer turns into a 503 instead of a hung
        probe. The ping's result, pass or fail, is reused for about 3
        seconds, so probes arriving every second don't each reach the
        database. On SIGTERM this answers 503 ("shutting down") at once, and
        the server waits a drain period (`SHUTDOWN_DRAIN`, default 5 seconds)
        before it stops accepting connections, so a router that polls this
        path stops sending traffic first.

        The container's HEALTHCHECK probes this path (`/healthz` stays the
        cheap liveness answer), so Docker's single health state and Compose's
        `depends_on: condition: service_healthy` mean "ready", not just
        "started".
      tags: [health]
      responses:
        "200":
          description: |
            The server can serve. The body also says how many goroutines and
            OS threads the process holds. The container's pids limit counts
            threads, so a climb here shows before the healthcheck can no
            longer start.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
              example:
                status: ok
                goroutines: 42
                threads: 14
        "503":
          description: |
            Not ready yet, the database is failing or slow, or the server is
            shutting down. The body carries a short reason only: no paths, no
            driver errors, no secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: database unavailable

  /healthz:
    get:
      operationId: health
      x-mcp-excluded: "A liveness probe for the orchestrator."
      summary: Liveness
      description: |
        Answers 200 once the server has started. Doesn't reflect whether
        either forge is reachable — see forges[].reachable on the dashboard
        response for that.
      tags: [health]
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok

  /api/version:
    get:
      operationId: getVersion
      summary: The running server's own version
      description: |
        The tag goreleaser stamped the running binary with ("dev" for a
        build outside the release pipeline). Public and unauthenticated —
        every page, including the pre-login screen, links to the matching
        GitHub release from its footer so a person can tell what's
        actually deployed without shelling into the box.
      tags: [health]
      responses:
        "200":
          description: The running version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
              example:
                version: 0.12.1

  /api/dashboard:
    get:
      operationId: getDashboard
      summary: The aggregated view
      description: |
        Returns the most recently fetched snapshot. The backend refreshes
        this on its own schedule in the background; this endpoint never
        blocks on a live call to either forge, so it answers instantly even
        when a forge is slow or unreachable.

        Always the signed-in user's own dashboard.

        Draft pull requests are left out unless `includeDrafts=true`, and
        `hiddenDrafts` counts only the drafts in repos the user hasn't
        ignored, the same repos whose other pull requests show.
      tags: [dashboard]
      parameters:
        - $ref: "#/components/parameters/QueryIncludeDrafts"
        - $ref: "#/components/parameters/QueryIncludeHidden"
        - $ref: "#/components/parameters/HeaderBackgroundRead"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The current snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/dashboard/stream:
    get:
      operationId: streamDashboard
      x-mcp-excluded: "A server-sent event stream; a tool call answers once. get_dashboard covers the data."
      summary: Server-Sent Events stream of the signed-in user's own dashboard
      description: |
        Pushes a fresh snapshot every time this user's background
        refresh produces one — most notably right after a verified
        webhook delivery (see the webhooks tag) triggers an immediate
        one, which is what turns that into a live update instead of
        something only the next scheduled refresh picks up.

        The frontend's own 30-second poll against GET /api/dashboard
        keeps running unconditionally, connected or not — a browser or
        proxy that can't hold an SSE connection open just never
        benefits from this, rather than the dashboard going stale
        silently.

        `includeDrafts` is read once, when the connection opens, and
        applies to every event on it. A client that changes its mind
        reconnects with the new value.

        A client that passes `sid` can also follow the job lists of the
        pull requests and default branches it has open, through
        `POST /api/dashboard/stream/watch`. Each list arrives as named
        `run` events on this stream, one for each workflow run attempt, so a
        client that only listens for default messages never sees one. A
        reconnect reuses the same `sid` with nothing watched, so the client
        sends its watch again.
      tags: [dashboard]
      parameters:
        - $ref: "#/components/parameters/QueryIncludeDrafts"
        - $ref: "#/components/parameters/QueryIncludeHidden"
        - name: sid
          in: query
          required: false
          description: |
            A random id the client makes up for this connection, 8 to 64
            letters, digits and dashes. It names the stream for the watch
            call. Anything else is ignored and the stream watches nothing.
          schema:
            type: string
            pattern: "^[A-Za-z0-9-]{8,64}$"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: |
            An SSE stream. Each event's `data` field is a JSON-encoded
            snapshot, identical in shape to GET /api/dashboard's
            response body. A named `run` event carries a `RunEvent`
            instead.
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Dashboard"
                  - $ref: "#/components/schemas/RunEvent"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No background refresh is running yet — Settings has never been saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/dashboard/stream/watch:
    post:
      operationId: watchDashboardStreamChecks
      x-mcp-excluded: "Steers an open event stream, which a tool call cannot hold. get_pull_request_checks and get_main_branch_checks list the jobs once."
      summary: Choose which job lists a dashboard stream sends
      description: |
        Replaces the set of pull requests and default branches whose job
        lists the stream named by `streamId` sends as `run` events.
        The server lists a subject when it is newly watched, when its row
        in a new snapshot changed (CI state, check counts, or a branch's
        run), and when `refresh` is true. Nothing else costs a forge
        request. A failed listing is sent as an event with `error` set,
        and every snapshot after it tries again, changed or not, until a
        listing works.

        A listing is one event for each workflow run attempt the subject
        holds, then one with `gone` set for each run attempt the last
        listing sent and this one lacks. The last event of a listing has
        `final` set. A rerun keeps its run id and takes a new attempt, so
        its event carries a new `key` and the first attempt's key comes
        back as gone. The event is the JSON of the `RunEvent` schema.
      tags: [dashboard]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StreamWatchRequest"
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: The watch is set. The lists follow on the stream.
        "400":
          description: |
            The body is not valid, a subject is malformed, or there are more
            than 8 subjects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No open stream has that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/presence:
    post:
      operationId: reportDashboardPresence
      x-mcp-excluded: "Cookie-session only: the spec refuses a personal API token with 403, so an MCP client cannot call it."
      summary: Say whether a browser tab of the dashboard is being looked at
      description: |
        The page calls this when its tab becomes visible or hidden
        (`document.visibilityState`), when the person stops or resumes
        using it, and on a slow heartbeat while it is visible. While at
        least one tab is visible, has had input recently and keeps sending
        heartbeats, the dashboard counts as in use and the scheduled
        background refresh keeps running. When every tab has said it is
        hidden, or has stopped sending heartbeats for three heartbeat
        periods (a closed laptop, a crashed browser), the dashboard counts
        as unused and, after the idle period, the scheduled refresh rests
        (see `IDLE_AFTER`). A tab that becomes visible after the refresh
        rested makes it run once.

        This call is the only way the server learns whether a tab is
        looked at. An open live stream says nothing about it, and neither
        does a read carrying `X-Background-Read`. The call itself is not a
        request that counts as use; only a visible report is.

        A browser session only: a personal API token is refused with 403,
        so a script cannot hold the refresh active.

        The answer carries the two timings the page follows, so neither
        is hard-coded in the browser.
      tags: [dashboard]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceReport"
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: The report was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceAnswer"
        "403":
          description: A personal API token was presented. This call is for a browser session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: The body is not JSON, or `viewerId` or `visible` is missing or malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/dashboard/refresh:
    post:
      operationId: refreshDashboard
      summary: Trigger an immediate refresh of the signed-in user's own dashboard
      description: |
        Blocks until an immediate, out-of-band refresh of the signed-in
        user's own dashboard completes, then returns the resulting
        snapshot — for retrying right away after a forge was only
        briefly unreachable, instead of waiting for the next scheduled
        background refresh.

        The server holds a five-second cooldown, so this can't
        be used to hammer a forge's API budget. A call inside that
        window does not fetch: it answers 200 with the current snapshot
        and a `Retry-After` header carrying the seconds left. Never a
        429, because the page calls this straight after a merge, close
        or branch update to show the result, and a refusal there would
        leave the row stale. Only a call that actually fetched answers
        without the header.

        The same goes for a call made while the first refresh since the
        server started is still running: it answers at once with the
        current snapshot and `Retry-After`, instead of waiting for that
        refresh to finish.
      tags: [dashboard]
      parameters:
        - $ref: "#/components/parameters/QueryIncludeDrafts"
        - $ref: "#/components/parameters/QueryIncludeHidden"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: |
            The freshly refreshed snapshot, or, when `Retry-After` is
            present, the current one because the cooldown hadn't passed or the
            first refresh since start-up is still running.
          headers:
            Retry-After:
              description: |
                Seconds until a refresh fetches again. Present only when
                this call was inside the cooldown, or the first refresh since
                start-up was still running, and returned the current
                snapshot without fetching.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No background refresh is running yet — Settings has never been saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/main-branches:
    get:
      operationId: getMainBranches
      summary: The CI status of every tracked repository's default branch
      description: |
        One row per tracked repository, showing the latest pipeline on its
        default branch: failed, passed, running or none. A repository
        ignored for pull requests is left out, as on the pull requests page.
        Every other row is returned, whatever its status, and no tally comes
        with them, so a client filters, sorts and counts locally and its pill
        counts always match what each pill lists. Rows come in no particular
        order: the client orders them.

        Served from the snapshot the background refresh already holds, so it
        never calls a forge. On GitHub the branch's check status rides the
        repository query the refresh already makes (no extra request); on
        Forgejo the refresh lists the Actions runs of the default branch, once
        per repository.

        A forge that can't be reached keeps its last known rows, each marked
        `staleSince`, the same carry-over `forges[].staleSince`
        on GET /api/dashboard reports. A forge whose rate-limit budget is
        spent is skipped until it resets and its rows are kept the same way.
        Only the signed-in user's own repositories.

        A repository with no default branch yet (empty) or no pipeline has
        status `none`. Unauthenticated GitHub access (a username with no
        token) has no rows: its budget is too small to spend on this.
      tags: [dashboard]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The default-branch status of every tracked repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MainBranches"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/checks/log:
    get:
      operationId: getCheckLog
      summary: Read the output of one CI job, on demand
      description: |
        The output behind a `Check` that carries a `jobId`, as plain text: colour
        codes and carriage returns removed, never markup, so a client must render
        it as text. Whatever the forge already masks stays masked. Only the last
        256 KiB are returned; `truncated` says the start was cut.

        Only for a repository the dashboard tracks for you; any other answers 404
        without asking the forge.

        Fetched live on every call and never as part of a snapshot, since a log
        can be large and most are never opened. GitHub reads the job's log
        through its REST API (one request, then a short-lived download). Forgejo
        reads it through the job logs endpoint of its Actions API.

        A forge can refuse: the token may not read logs, the log may have
        expired, or the check may not be an Actions job at all. Those answer 403
        or 404 with a sentence a person can read.

        With `excerpt=true` the answer is the failed job's excerpt instead: `text`
        holds the last lines of the log with per-line timestamps and colour codes
        removed, at most 2,000 characters, and `truncated` is always false (an
        excerpt is a fixed-size tail, not a cut of what was asked for). Only
        Forgejo serves it; GitHub fills a check's `excerpt` itself when the
        checks are listed. A job whose log is gone or empty answers 200 with
        empty `text`, so a client can show the check without it. A job's excerpt
        is read once and kept once it finished, so asking again costs no
        request to the forge. A client asks for the few failed jobs it is about
        to show (the panel asks for the newest five), not for every job of a
        list.
      tags: [dashboard]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: forge
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Forge"
        - name: fullName
          in: query
          required: true
          schema:
            type: string
          description: '"owner/repo" of the repository the check ran in.'
        - name: jobId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
          description: Matching a Check.jobId.
        - name: excerpt
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: |
            True to answer the job's excerpt (the last lines, at most 2,000
            characters) instead of its output. Forgejo only; any other forge
            answers 400.
      responses:
        "200":
          description: The job's output, or its excerpt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckLog"
        "400":
          description: '`fullName` wasn''t "owner/repo", `jobId` wasn''t a positive integer, no credentials are saved for that forge, or that forge''s client can''t read job logs.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie or token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The saved token's scope doesn't cover reading job logs, or it isn't allowed to see that repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The repository isn't one the dashboard tracks for you, or the forge has no such job or log (it expired, or the check isn't an Actions job).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The forge rate-limited the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The dashboard has not loaded your repositories yet (a cold start or an outage), so it cannot say whether the repository is tracked. Retry shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/main-branches/advisories:
    get:
      operationId: listAdvisories
      summary: List a repository's open dependency advisories in full, on demand
      description: |
        What the advisories dialog on the Main branches page shows for one
        repository: each open Dependabot alert with the fields GitHub's own
        alert page shows. The list and the detail view are the same answer, so
        opening one advisory costs no second call. Fetched live on every call,
        never as part of GET /api/main-branches' snapshot, so a repository
        nobody opens costs no budget.

        Sorted by severity, highest first, then newest first. GitHub reads them
        through the Dependabot alerts of the repository. A Forgejo repository
        reads its lock files again and matches them against OSV, so it costs the
        same as one refresh of that repository and works only while OSV
        advisories are switched on; each advisory is then one distinct
        advisory, with `number` its place in the list, `openedAt` the day OSV
        published it and `url` its page on OSV.

        A forge that can't say is a 200 with `state` "unknown", an empty list
        and the `reason`, the same words as the row's own `advisories`: alerts
        switched off, a credential without the Dependabot alerts permission, a
        rate limit, any other failure, or a repository with more open alerts
        than one read pages through. For Forgejo: advisories not switched on
        (`not_enabled`), OSV unreachable or a lock file that can't be read
        (`failed`), too much to read (`too_many`), or no lock file found (no
        `reason`). An empty `known` list means nothing is open.

        `description` is Markdown exactly as GitHub stores it, so a client must
        render it with raw HTML disabled. A field GitHub didn't send is left
        out. A Forgejo advisory leaves out what OSV does not state: `epss`,
        `relationship`, `scope` and `vulnerableVersions`.

        The same answer is the `get_repository_advisories` tool, over MCP and
        WebMCP.
      tags: [dashboard]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: forge
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Forge"
        - name: fullName
          in: query
          required: true
          schema:
            type: string
          description: '"owner/repo", matching a MainBranch.fullName from GET /api/main-branches.'
      responses:
        "200":
          description: The repository's open advisories, or the reason they couldn't be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvisoryList"
        "400":
          description: '`fullName` wasn''t "owner/repo", no credentials are saved for that forge, or that forge''s client can''t list advisories.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie or token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The forge reported the repo doesn't exist (or isn't visible to this token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The forge rate-limited the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/main-branches/rerun-checks:
    post:
      operationId: rerunMainBranchChecks
      summary: Rerun only the failed jobs of a repository's default-branch pipeline, on the signed-in user's behalf
      description: |
        The branch twin of POST /api/pull-requests/rerun-checks. Asks the forge
        to rerun the failed jobs of the Actions workflow runs on the commit
        the branch's job list shows, and nothing that passed. It
        answers once the forge has queued them, not when they finish, so a
        client shows a queued state and lets the next refresh carry the result.

        A Main branches row offers it when its `status` is `failed`. A failed
        check that isn't an Actions job (a third-party check, a legacy status,
        an external CI) can't be rerun here and is skipped. Refusals are an
        `ActionError`; a 409 means the branch has no failed job to rerun, or
        that the forge is a Forgejo older than version 17, which has no rerun
        route (`ForgeHealth.rerunChecksBlocked` says so beforehand). On
        Forgejo the version is checked before the runs are looked up, as for a
        pull request, and a refusal that comes after some jobs restarted ends
        with which jobs restarted and which did not.
      tags: [dashboard]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MainBranchRerunRequest"
      responses:
        "204":
          description: The failed jobs were queued to rerun.
        "400":
          description: The request body wasn't valid JSON, `fullName` wasn't "owner/repo", no credentials are saved for that forge, or that forge's client doesn't support rerunning default branch checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie or token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized. The saved token can't write to Actions on that repo. `code` is `permission`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "404":
          description: The repo isn't one whose default branch the dashboard tracks, or the forge reported it doesn't exist (or isn't visible to this token). For the forge's answer `code` is `unknown`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "409":
          description: There is no failed Actions job to rerun on the default branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "429":
          description: The forge rate-limited the request. `code` is `rate_limited`; `resetsAt` carries when the budget comes back, when the forge said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
  /api/stats/forge-api:
    get:
      operationId: getForgeApiStats
      summary: How many forge API calls the dashboard has spent, and on what
      description: |
        Counts the forge requests made since the server started, so a change
        to what the dashboard refreshes can be shown to have saved budget, and
        a rate-limit incident traced to the refresh that caused it. One bucket
        per forge, credential, refresh `kind` and repository, each with the
        REST calls made, the GraphQL calls made, the GraphQL `rateLimit.cost`
        they were charged, and the requests answered `304 Not Modified`. A 304
        is not charged against the REST budget, so it is counted on its own and
        not as a REST call.

        `kind` says why the request was made: `full` (a whole-account
        refresh), `scoped_webhook` (one repository, after a webhook),
        `ci_poll` (one repository, waiting on a running check),
        `auto_merge_poll` (one repository, waiting on an armed auto-merge),
        `details` (a dialog or check list opened), `hook_maintenance`
        (checking, adding or upgrading webhooks), `advisories` (reading a
        repository's open Dependabot alerts, or a Forgejo repository's lockfiles), `user_action` (a button
        pressed, a queued action, or something the dashboard does for you such
        as auto-merge) and `unknown` (a request nobody tagged, which is a bug
        to report). A request that names no repository, such as listing an
        account's repositories, has an empty `repo`.

        The counters live in memory and start from zero on every start;
        `since` says when counting began. `credential` names the connected
        account or App installation by a label that carries no secret and no
        user id (`app:<installation id>`, `token:<short hash>`,
        `public:<username>`). Only the buckets of the caller's own
        credentials are returned. They are matched to the credentials
        the caller has saved, and a GitHub App installation id is a number the
        caller types in, so until the dashboard has one user, someone who saves
        another account's installation id sees that installation's counts. `budgets` are the rate limits each forge last
        reported, the same figures as `forges` on GET /api/dashboard.
      tags: [dashboard]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The counters since the server started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgeApiStats"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/webhooks/github/{webhookToken}:
    post:
      operationId: receiveGitHubWebhook
      x-mcp-excluded: "A signed callback from GitHub, authenticated by its signature, not by a user."
      summary: Receive a GitHub repository webhook delivery
      description: |
        Triggers an immediate refresh for the user webhookToken identifies,
        once the request's `X-Hub-Signature-256` header is verified against
        that user's webhook secret. Every delivery GitHub can send for a
        repository webhook (a new pull request, a closed issue, a status or
        check-run update, even the `ping` event GitHub sends when the
        webhook is first created) means the same thing here — something
        changed, refresh — so nothing about the payload itself is parsed.
      tags: [webhooks]
      # Not session-or-bearer authenticated like everything else in this
      # spec — the path's token is the instance's webhook token, and the request's
      # own HMAC signature is what proves it actually came from their
      # forge. Explicit rather than left to the top-level default so
      # this reads as a deliberate exception, not an oversight.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathWebhookToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GitHub's own event payload — its shape isn't ours to describe, and nothing here reads it.
      responses:
        "204":
          description: Signature verified; a refresh was triggered.
        "401":
          description: The X-Hub-Signature-256 header was missing or didn't verify against this user's webhook secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user's webhook token matches webhookToken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/webhooks/forgejo/{webhookToken}:
    post:
      operationId: receiveForgejoWebhook
      x-mcp-excluded: "A signed callback from Forgejo, authenticated by its signature, not by a user."
      summary: Receive a Forgejo repository webhook delivery
      description: |
        Triggers an immediate refresh for the user webhookToken identifies,
        once the request's signature header is verified against that
        user's webhook secret — `X-Forgejo-Signature` on a webhook set up
        with the "Forgejo" type, `X-Gitea-Signature` on one set up with the
        legacy "Gitea" type; both carry the same raw hex HMAC-SHA256. Every
        delivery means the same thing here — something changed, refresh —
        so nothing about the payload itself is parsed.
      tags: [webhooks]
      # See receiveGitHubWebhook's own comment on this same field.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathWebhookToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Forgejo's own event payload — its shape isn't ours to describe, and nothing here reads it.
      responses:
        "204":
          description: Signature verified; a refresh was triggered.
        "401":
          description: Both signature headers were missing, or neither verified against this user's webhook secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user's webhook token matches webhookToken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    # Applied via a `security:` block on every operation that accepts it
    # server-side (internal/api/server.go's auth.RequireAuth wiring) — see
    # the auth tag's own description for why an endpoint's 401 description
    # says "no valid session cookie" without separately calling out this
    # header: both credentials produce the same 401. The two webhook
    # delivery endpoints are the deliberate exception; see their own
    # `security: []` comments.
    bearerAuth:
      type: http
      scheme: bearer
      description: A personal API token from POST /api/tokens, as an alternative to the session cookie.
    cookieAuth:
      type: apiKey
      in: cookie
      name: forge_dashboard_session
      description: The session cookie of a signed-in browser. Operations that list only this refuse a personal API token with 403.

  responses:
    AuthRateLimited:
      description: |
        This address made too many sign-in or registration requests. The
        four ceremony endpoints (`/api/auth/register/begin`,
        `/api/auth/register/finish`, `/api/auth/login/begin` and
        `/api/auth/login/finish`) share one allowance per client address: a
        burst of 10 requests, then one more every 6 seconds. A person signing
        in uses two requests, so they never reach it. Wait `Retry-After`
        seconds and try again. The client address is the connection's own, or
        the one a trusted reverse proxy forwarded in `X-Forwarded-For`; see
        the `TRUSTED_PROXIES` setting in the configuration docs.
      headers:
        Retry-After:
          description: Seconds until this address may make another of these requests.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  parameters:
    HeaderBackgroundRead:
      name: X-Background-Read
      in: header
      required: false
      description: |
        Any value says the read is the page's own timed refresh of its data,
        not something a person asked for. Such a read does not count as use
        of the dashboard, so a tab nobody is looking at cannot keep the
        scheduled refresh running by polling.
      schema:
        type: string
        examples: ["true"]
    PathWebhookToken:
      name: webhookToken
      in: path
      required: true
      schema:
        type: string

    PathTokenID:
      name: id
      in: path
      required: true
      schema:
        type: string

    QueryIncludeHidden:
      name: includeHidden
      in: query
      required: false
      description: |
        Whether pull requests the user hid (`POST /api/pull-requests/hide`)
        are in `pullRequests`, marked `hidden: true`. Defaults to `false`: a
        hidden pull request is left out and counted in the response's
        `hiddenPullRequests`. A client lists the hidden ones, to offer a
        Restore, by asking with `true`. The stream and the refresh endpoint
        take the same parameter.
      schema:
        type: boolean
        default: false

    QueryIncludeDrafts:
      name: includeDrafts
      in: query
      required: false
      description: |
        Whether draft pull requests are in `pullRequests`. Defaults to
        `false`: nothing can be merged, auto-merged or updated on a draft,
        so a draft is left out and counted in the response's `hiddenDrafts`
        instead. The stream and the refresh endpoint take the same
        parameter, so every snapshot a client receives follows one rule.
      schema:
        type: boolean
        default: false

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    Ready:
      type: object
      required: [status, goroutines]
      properties:
        status:
          type: string
          const: ok
        goroutines:
          type: integer
          minimum: 1
          description: Goroutines the process holds right now.
        threads:
          type: integer
          minimum: 1
          description: |
            OS threads the process holds right now, read from
            `/proc/self/status`. Left out where that can't be read.

    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: |
            The release tag this binary was built from, with no leading
            "v" — or "dev" for a build outside the release pipeline.
          examples: ["0.12.1", dev]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        field:
          type: string
          description: |
            Present when the rejection is about one field of the request
            body (a settings save, for instance), named as it appears there,
            so a client can mark that input without parsing `error`.

    ActionError:
      type: object
      required: [error, code, message]
      description: >-
        The structured result of a refused pull request action (Merge,
        Close, Update branch, Enable auto-merge, Dependabot and Renovate
        rebase). `code` and `message` are what a client should act on
        and show.
      properties:
        error:
          type: string
          description: |
            The same string every Error carries. With `code: unknown` it
            is the same plain words as `message`, since the raw text
            (internal prefixes, API paths, URLs) goes to the server log.
            With any other code it is the forge's own text, for logs.
        code:
          type: string
          enum:
            - already_merged
            - already_closed
            - not_mergeable
            - conflict
            - behind
            - checks_pending
            - checks_failing
            - blocked_by_protection
            - already_up_to_date
            - auto_merge_not_allowed
            - ready_to_merge
            - permission
            - rate_limited
            - forge_error
            - not_rate_limited
            - not_open
            - not_reopenable
            - unknown
          description: |
            Why the action was refused, from a re-read of the pull
            request's real state. `already_merged` and `already_closed`
            mean the dashboard's row was stale: the pull request has
            nothing left to merge.

            `not_reopenable` belongs to Reopen: the pull request is still
            closed and the forge won't reopen it, usually because its
            branch was deleted or rewritten after the close.

            `forge_error` means the forge failed on its own side (a 5xx):
            nothing is wrong with the request, so asking again may work.
            `upstreamStatus` and `requestId` then say what the forge
            answered with, for tracing a report. Update branch is tried a
            second time by the server before this is answered.

            `not_rate_limited` belongs to queueing an action: the forge
            isn't rate limited, so act directly. `not_open` is only an
            outcome of a queued action: the pull request was gone from the
            board when the reset came, merged or closed.

            Three codes belong to a few actions each: `already_up_to_date`
            (Update branch: nothing to bring in; Merge or Enable auto-merge
            on an empty pull request: nothing to merge),
            `auto_merge_not_allowed` (Enable auto-merge: the repo or pull
            request doesn't allow it) and `ready_to_merge` (Enable
            auto-merge: already clean, use Merge).
        message:
          type: string
          description: |
            A short reason in plain words, safe to show a person, always.
            With `code: unknown` it is the forge's own sentence when that
            reads as one, "The forge didn't answer. Try again in a moment."
            when the forge was unreachable (including a 502, 503 or 504),
            and "The forge refused this action and gave no reason."
            otherwise. It never holds an internal prefix, an API path, a
            URL or JSON.
        resetsAt:
          type: string
          format: date-time
          description: Only with `rate_limited`, when the forge said so. When the budget comes back. On Forgejo it comes from the `Retry-After` header, in seconds or as a date.
        upstreamStatus:
          type: integer
          minimum: 500
          maximum: 599
          description: Only with `forge_error`. The HTTP status the forge answered with.
        requestId:
          type: string
          description: Only with `forge_error`, and only when the forge sent one (GitHub's `X-GitHub-Request-Id`). What the forge's support asks for.

    PresenceReport:
      type: object
      required: [viewerId, visible]
      properties:
        viewerId:
          type: string
          minLength: 8
          maxLength: 64
          description: |
            Names one browser tab, chosen by the page when it loads. Not a
            user id and not stored beyond the tab's heartbeats.
          examples: [3f1c9a52-7d2e-4a6b-9f10-5b8e2c7d1a44]
        visible:
          type: boolean
          description: |
            True while the tab is visible and has had input recently. False
            once it is hidden or the person has stopped using it.
    PresenceAnswer:
      type: object
      required: [heartbeatSeconds, idleAfterSeconds]
      properties:
        heartbeatSeconds:
          type: integer
          minimum: 1
          description: How often a visible tab reports itself visible again.
        idleAfterSeconds:
          type: integer
          minimum: 0
          description: |
            How long a visible tab may go without input before it reports
            `visible: false`. 0 means the server's idle mode is off and the
            page never needs to.
    RegistrationStatus:
      type: object
      required: [open]
      properties:
        open:
          type: boolean
          description: True only when the instance has zero registered users.

    WebAuthnCeremonyOptions:
      type: object
      description: |
        The WebAuthn specification's own JSON shape for
        `PublicKeyCredentialCreationOptions`/`PublicKeyCredentialRequestOptions`
        (the begin responses) and `PublicKeyCredential`
        (the finish request bodies) — passed through to and from the
        browser's own `navigator.credentials` API untouched, so this
        contract intentionally doesn't re-model WebAuthn's own schema.
      additionalProperties: true

    FilterState:
      type: object
      description: |
        The dashboard/Insights filter bar's own saved shape (and the
        Branches page's status, forge, advisories and search, in a `branches` group) —
        whatever the frontend's `$lib/filters` `loadState`/`saveState` already produce
        client-side (shared forge/repo/label/author/title/created/
        updated/groupBy, plus the two board-owned extras with no
        equivalent on the other entity type). `shared.label`,
        `shared.repo` (forge-qualified, `forge:owner/name`) and
        `shared.author` are each one lowercase value, or several separated
        by a newline: the filter matches an item with any of them, and a
        single value saved before they took several still reads as a list
        of one. At most 20 values and 1000 characters in each, with no
        control character other than the separator; a save over either is
        refused. This server stores and
        returns it verbatim, byte for byte, and apart from those limits never parses or
        validates its shape — the same "opaque blob, not this layer's
        concern" treatment WebAuthnCeremonyOptions above gets, so a
        client-side shape change here never needs a matching spec change.
      additionalProperties: true

    SessionUser:
      type: object
      required: [username, displayName]
      properties:
        username:
          type: string
        displayName:
          type: string

    SettingsResponse:
      type: object
      description: |
        The signed-in user's own GitHub/Forgejo configuration. Never
        includes a forge token's value — only whether one is currently
        saved, so the UI can show a "Configured" badge without the secret
        ever reaching the browser. webhookToken/webhookSecret are the
        exception: they're ours to hand back in the clear, since the user
        has to paste them into the forge's own webhook setup.
      required:
        [
          githubUsername,
          githubTokenSet,
          githubAppInstallationId,
          githubAppConfigured,
          forgejoUrl,
          forgejoUsername,
          forgejoTokenSet,
          webhookToken,
          webhookSecret,
          renovateRebaseLabel,
          renovateAuthors,
          ignoredTitleCounts,
          theme,
        ]
      properties:
        githubUsername:
          type: string
          description: Used as a token-free public-repos fallback when no GitHub token is set.
        githubTokenSet:
          type: boolean
          description: Whether a GitHub token is currently saved.
        githubAppInstallationId:
          type: integer
          format: int64
          description: |
            The installation ID of the alrayyes-automation GitHub App
            this user has connected, or 0 if none. Not a
            secret — it's an opaque integer GitHub already shows the
            user on its own installation settings page — so, unlike
            githubTokenSet, this round-trips as a plain value. Takes
            precedence over a saved githubToken whenever both are set
            and the server has an App configured (see
            githubAppConfigured).
        githubAppConfigured:
          type: boolean
          description: |
            Whether this server has a GitHub App configured at all
            (server-wide GITHUB_APP_ID/GITHUB_APP_PRIVATE_KEY_BASE64 —
            not a saved setting). The Settings page uses this to
            explain why githubAppInstallationId can't be saved when
            it's false.
        forgejoUrl:
          type: string
          description: |
            Always without a username, password, query string or fragment,
            even if the stored value predates those being refused.
        forgejoUsername:
          type: string
          description: Used as a token-free public-repos fallback when no Forgejo token is set.
        forgejoTokenSet:
          type: boolean
          description: Whether a Forgejo token is currently saved.
        webhookToken:
          type: string
          description: |
            Identifies this user in a webhook URL
            (`/api/webhooks/{provider}/{webhookToken}`). Generated on
            first visit to Settings and stable after that.
        webhookSecret:
          type: string
          description: |
            Pasted into the forge's own webhook "Secret" field, used to
            verify the signature header on incoming webhook deliveries
            (`X-Hub-Signature-256` on GitHub, `X-Forgejo-Signature` on
            Forgejo). Never appears in the webhook URL itself.
        renovateRebaseLabel:
          type: string
          description: |
            The label Renovate's own rebase/retry trigger listens for on
            a repo (Renovate's own `rebaseLabel` config option — genuinely
            per-repo configurable, so this is a user-set override rather
            than a hardcoded constant). Empty means Renovate's own
            documented default, `rebase`.
        renovateAuthors:
          type: array
          items:
            type: string
          description: |
            The logins that are Renovate on the user's forges. On GitHub the
            App's own `renovate` and `renovate[bot]` are always recognised.
            A Forgejo or GitLab instance has no App: Renovate runs there as
            an ordinary account with whatever name the instance gave it, so
            the user lists it here. A pull request by one of these gets
            Renovate's own rebase, not Update branch, and is a `dependency`.
            Matched case-insensitively. Empty means only the GitHub slugs.
        theme:
          type: string
          enum: ["", light, dark]
          description: |
            The signed-in user's own theme preference. Empty
            means "system" — follow the browser's prefers-color-scheme
            rather than a saved choice. Set only from Settings; every
            other page reads it via the lightweight
            GET /api/settings/theme instead of this endpoint.
        timezone:
          type: string
          description: |
            The signed-in user's own time zone as an IANA name such as
            `Europe/Amsterdam`. Empty means the browser's own zone. Set only
            from Settings (PUT /api/settings/timezone); every other page reads
            it via GET /api/settings/timezone.
        hideDependencyDashboard:
          type: boolean
          description: |
            Whether the user hides the bot-kept "Dependency Dashboard" issue
            everywhere: the server leaves a `housekeeping` issue out of the
            `issues` of GET /api/dashboard and its stream, and out of every
            count and total built from them (`navCounts`, Insights). Always
            present once the server applies it.
        ignoredTitles:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 200
          description: |
            Patterns for issue titles to leave out, in the server's own
            regular expression syntax (Go RE2: no lookahead and no
            backreferences). A pattern matches anywhere in the title and
            ignores case; an issue matching any one is left out of `issues`
            and of every count and total built from them, the same as
            `hideDependencyDashboard`. Always present once the server
            applies it. Empty means none.
        ignoredTitleCounts:
          type: array
          items:
            type: [integer, "null"]
            minimum: 0
          description: |
            Per pattern in `ignoredTitles`, same order and same length: how
            many of the viewer's currently open issues that pattern matches
            on its own. An issue two patterns match counts for both, so the
            entries can sum to more than `settingsHiddenIssueCount`. Every
            entry is null while the count is unknown (the viewer's first
            refresh has not finished, see `firstRefreshDone` on the
            dashboard snapshot, or there is no snapshot), never a made-up 0.
            Only this viewer's issues are counted. On GET and on the PUT
            response alike: a PUT returns the counts for the list it just
            saved, worked out from the issues the viewer had before the save.

    SettingsSummary:
      type: object
      description: |
        The signed-in user's settings as `GET /api/settings/summary` and the
        `get_settings` MCP tool return them: every field of
        SettingsResponse except `webhookToken` and `webhookSecret`, which are
        never part of it, plus `webhookConfigured`. No forge token appears,
        only whether one is set. Field meanings are those of the same-named
        SettingsResponse properties.
      required:
        [
          githubUsername,
          githubTokenSet,
          githubAppInstallationId,
          githubAppConfigured,
          forgejoUrl,
          forgejoUsername,
          forgejoTokenSet,
          webhookConfigured,
          renovateRebaseLabel,
          renovateAuthors,
          hideDependencyDashboard,
          ignoredTitles,
          ignoredTitleCounts,
          theme,
          timezone,
        ]
      properties:
        githubUsername:
          type: string
        githubTokenSet:
          type: boolean
        githubAppInstallationId:
          type: integer
          format: int64
        githubAppConfigured:
          type: boolean
        forgejoUrl:
          type: string
        forgejoUsername:
          type: string
        forgejoTokenSet:
          type: boolean
        webhookConfigured:
          type: boolean
          description: |
            Whether this user's webhook token and secret exist. They are
            created the first time the Settings page reads
            `GET /api/settings`, never by this read, so this is false for a
            user who has not opened Settings yet.
        renovateRebaseLabel:
          type: string
        renovateAuthors:
          type: array
          items:
            type: string
        hideDependencyDashboard:
          type: boolean
        ignoredTitles:
          type: array
          items:
            type: string
        ignoredTitleCounts:
          type: array
          items:
            type: [integer, "null"]
            minimum: 0
        theme:
          type: string
          enum: ["", light, dark]
        timezone:
          type: string

    SettingsRequest:
      type: object
      description: |
        Replaces the signed-in user's saved GitHub/Forgejo configuration.
        A blank `githubToken` or `forgejoToken` keeps whatever token is
        already saved for that forge rather than clearing it — this is
        the only way to update the username fields without having to
        resubmit a token you don't want to re-paste. githubAppInstallationId
        is different: a plain replace like githubUsername, not coalesced —
        0 or omitted really does disconnect the App. Rejected (400) if
        the server has no GitHub App configured (see
        SettingsResponse.githubAppConfigured). Theme isn't settable
        here at all — see PUT /api/settings/theme.
      properties:
        githubToken:
          type: string
          maxLength: 512
        githubUsername:
          type: string
          maxLength: 64
        githubAppInstallationId:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: |
            0 means none. A negative or non-integer value is a 400 naming
            this field, as is any value on a server with no GitHub App
            configured.
        forgejoUrl:
          type: string
          maxLength: 2048
          description: |
            Required, once the save is merged with what is already stored,
            whenever a Forgejo token or username is set. That depends on
            stored state, so a schema alone can't express it: a save that
            breaks it is a 400 naming `forgejoUrl`.

            Must be a plain `http://` or `https://` base URL with a host,
            optionally with a path prefix. One that carries a username,
            password, query string or fragment, or has another scheme, is a
            400 naming `forgejoUrl`, and nothing is saved. The error never
            repeats the URL.
        forgejoToken:
          type: string
          maxLength: 512
        forgejoUsername:
          type: string
          maxLength: 64
        renovateRebaseLabel:
          type: string
          maxLength: 100
        renovateAuthors:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 64
            pattern: "^[^,]*$"
          description: |
            Replaces the saved list. Entries are trimmed; blanks and
            repeats (ignoring case) are dropped. Omitted or empty clears it.
        hideDependencyDashboard:
          type: boolean
          description: |
            Replaces the saved choice; omitted means false, like
            `renovateAuthors`, so a form sends it on every save. See
            SettingsResponse.hideDependencyDashboard.
        ignoredTitles:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 200
          description: |
            Replaces the saved list; omitted or empty clears it. Entries are
            trimmed; blanks and repeats (ignoring case) are dropped. Each
            must compile as a Go RE2 regular expression: one that does not
            is a 400 naming `ignoredTitles` and the entry, with the reason in
            plain words ("ignoredTitles entry 2, "(": missing closing )"),
            and nothing is saved. More than 20 entries, or an entry over 200
            characters, is a 400 too. See SettingsResponse.ignoredTitles.

    ThemeResponse:
      type: object
      description: See GET /api/settings/theme's own description.
      required: [theme]
      properties:
        theme:
          type: string
          enum: ["", light, dark]

    ThemeRequest:
      type: object
      description: See PUT /api/settings/theme's own description.
      required: [theme]
      properties:
        theme:
          type: string
          maxLength: 5
          enum: ["", light, dark]

    TimezoneResponse:
      type: object
      description: See GET /api/settings/timezone's own description.
      required: [timezone]
      properties:
        timezone:
          type: string
          description: An IANA zone name such as `Europe/Amsterdam`, or empty for the browser's own.
          examples: [Europe/Amsterdam]

    TimezoneRequest:
      type: object
      description: See PUT /api/settings/timezone's own description.
      required: [timezone]
      properties:
        timezone:
          type: string
          maxLength: 64
          description: An IANA zone name, or empty for the browser's own. `Local` is refused.

    Credential:
      type: object
      description: |
        A registered passkey's own metadata — never the
        credential itself, which never leaves the authenticator that
        created it; WebAuthn's whole design is that the server only ever
        sees a public key and signed assertions, not a secret to lose.
      required: [id, label, createdAt]
      properties:
        id:
          type: string
          description: This passkey's own credential ID (base64url), distinct from the account's user ID.
        label:
          type: string
          description: The passkey's name, given at registration and changeable with `PATCH /api/auth/credentials/{id}`. Empty when it was never named; clients then fall back to `createdAt`.
        createdAt:
          type: string
          format: date-time

    RenameCredentialRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
          description: The new name. Trimmed first; blank is refused.

    APIToken:
      type: object
      description: |
        A personal API token's own metadata — never the token value
        itself, which only ever appears once, in
        APITokenCreateResponse's own response body at creation time.
      required: [id, label, createdAt, expiresAt]
      properties:
        id:
          type: string
        label:
          type: string
          description: The name given at creation time, so a list of several is tellable apart.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: |
            When this token stops authenticating requests —
            always set, mandatory at creation, no "never expires"
            option. A token whose expiration has passed is rejected the
            same way an invalid one is.
        lastUsedAt:
          type: string
          format: date-time
          description: Omitted if this token has never authenticated a request yet.

    APITokenCreateRequest:
      type: object
      required: [label, expiresAt]
      properties:
        label:
          type: string
          maxLength: 100
        expiresAt:
          type: string
          format: date-time
          description: |
            Must be in the future and no more than 366 days out (matching
            GitHub's own fine-grained-token maximum) — the
            Settings UI offers 7/30/60/90-day presets (30 pre-selected)
            or a custom date within that same cap, never an option for
            no expiration at all.

    APITokenCreateResponse:
      type: object
      description: |
        The one and only response that ever carries the raw token value
        — shown to the user once, at creation time; only its hash is
        stored, so it can't be recovered from here again. Losing it
        means generating a new one.
      required: [id, label, createdAt, expiresAt, token]
      properties:
        id:
          type: string
        label:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        token:
          type: string
          description: "The raw Bearer credential: `Authorization: Bearer <token>`."

    WebhookEnsureRequest:
      type: object
      required: [forge, fullName]
      description: Which repo to create or fix up a webhook on.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          maxLength: 255
          description: '"owner/repo", matching a Repo.fullName from GET /api/dashboard.'

    RepoIgnoreRequest:
      type: object
      required: [forge, fullName, prs, issues]
      description: |
        Which repo to ignore, and in which scope(s). At least one
        of prs/issues must be true — a request with both false is
        rejected with 400 rather than silently doing nothing; use POST
        /api/repos/unignore to clear both at once instead.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          maxLength: 255
          description: '"owner/repo", matching a Repo.fullName from GET /api/dashboard.'
        prs:
          type: boolean
          description: Whether to ignore this repo's pull requests.
        issues:
          type: boolean
          description: Whether to ignore this repo's issues.

    AutoMergeStatus:
      type: object
      required: [state, message]
      description: |
        Where an armed pull request stands, so the row can say why
        auto-merge is waiting or stopped in words and not by colour. Present
        while auto-merge is armed on it: on Forgejo the signed-in user's
        intent held by this app, on GitHub the forge's own auto-merge.
        Also present for ten minutes after this app cancelled an armed
        auto-merge because the pull request went empty (its branch landed on
        the base some other way): `stopped`, code `already_up_to_date` and the
        message "Auto-merge was cancelled: there is nothing left to merge."
        Auto-merge is off by then, so this is the only place the reason lives.
      properties:
        state:
          type: string
          enum: [waiting, stopped]
          description: |
            `waiting` clears by itself: checks still running, a draft, a
            stack parent that hasn't merged, a rate limit. `stopped` needs the
            person: a failing check, a conflict, or a merge Forgejo refused
            (including a token without merge permission). A stopped pull
            request stays armed and merges once the cause is gone, or the
            person cancels.
        code:
          type: string
          description: |
            The same codes as `ActionError.code` (`checks_pending`,
            `checks_failing`, `conflict`, `stacked`, `permission`,
            `rate_limited`, `not_mergeable`). Omitted when the pull request
            is simply waiting for the next refresh to merge it.
        message:
          type: string
          description: Plain words, safe to show a person.

    AutoMergedPullRequest:
      type: object
      required: [forge, fullName, number, mergedAt, message]
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
        number:
          type: integer
        mergedAt:
          type: string
          format: date-time
        message:
          type: string
          description: 'Ready to show: "Auto-merged owner/repo#N after checks passed".'

    PullRequestActionRequest:
      type: object
      required: [forge, fullName, number]
      description: Which pull request to act on.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          maxLength: 255
          description: '"owner/repo", matching a Repo.fullName from GET /api/dashboard.'
        number:
          type: integer
          maximum: 2147483647
          description: Matching a PullRequest.number from GET /api/dashboard.

    PullRequestMergeRequest:
      description: Which pull request to merge, and whether to delete its source branch afterwards.
      allOf:
        - $ref: "#/components/schemas/PullRequestActionRequest"
        - type: object
          properties:
            deleteBranch:
              type: boolean
              default: false
              description: Delete the source branch once the merge has landed.

    PullRequestMergeResult:
      type: object
      required: [branchDeletion]
      description: What a merge that asked for `deleteBranch` did besides merging.
      properties:
        branchDeletion:
          $ref: "#/components/schemas/BranchDeletion"

    BranchDeletion:
      type: object
      required: [outcome]
      description: |
        What happened to the source branch. A fact for the client to word,
        never a reason to treat the merge as failed.
      properties:
        outcome:
          type: string
          enum: [deleted, skipped, failed]
          description: |
            `deleted`: the branch is gone, including when the forge had
            already removed it. `skipped`: it was left alone on purpose,
            see `reason`. `failed`: the forge refused or couldn't be
            reached, and the branch may still exist.
        reason:
          type: string
          enum: [fork, default_branch, protected, in_use, unsupported]
          description: |
            Why a `skipped` branch was left. `fork`: the branch lives in
            another repo. `default_branch`: it is the repo's default
            branch. `protected`: the forge protects it. `in_use`: another
            open pull request in the repo has it as its head or base, so
            deleting it would strand that pull request. `unsupported`: the
            forge's client can't delete branches. Absent unless `outcome`
            is `skipped`.

    IssueActionRequest:
      type: object
      required: [forge, fullName, number]
      description: Which issue to act on.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          maxLength: 255
          description: '"owner/repo", matching an Issue.repo from GET /api/dashboard.'
        number:
          type: integer
          maximum: 2147483647
          description: Matching an Issue.number from GET /api/dashboard.

    IssueCommentRequest:
      type: object
      required: [forge, fullName, number, body]
      description: Which issue to comment on, and what to say.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          maxLength: 255
          description: '"owner/repo", matching an Issue.repo from GET /api/dashboard.'
        number:
          type: integer
          maximum: 2147483647
          description: Matching an Issue.number from GET /api/dashboard.
        body:
          type: string
          minLength: 1
          maxLength: 65536
          description: The comment, as Markdown. Blank text is refused.

    MainBranchRerunRequest:
      type: object
      required: [forge, fullName]
      description: Which repository's default branch to rerun the failed checks of.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          maxLength: 255
          description: '"owner/repo", matching a MainBranch.fullName from GET /api/main-branches.'

    PullRequestHideRequest:
      type: object
      required: [forge, fullName, number]
      description: |
        Which pull request to hide, and for how long. Without `days` it stays
        hidden until it is restored.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          maxLength: 255
          description: '"owner/repo", matching a Repo.fullName from GET /api/dashboard.'
        number:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Matching a PullRequest.number from GET /api/dashboard.
        days:
          type: integer
          minimum: 1
          maximum: 365
          description: Hide for this many days, then show it again on its own.

    PullRequestDependabotActionRequest:
      type: object
      required: [forge, fullName, number, action]
      description: Which pull request to act on, and which of Dependabot's own comment commands to send.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          maxLength: 255
          description: '"owner/repo", matching a Repo.fullName from GET /api/dashboard.'
        number:
          type: integer
          maximum: 2147483647
          description: Matching a PullRequest.number from GET /api/dashboard.
        action:
          type: string
          maxLength: 8
          enum: [rebase, recreate]
          description: Which Dependabot comment command to post — "@dependabot rebase" or "@dependabot recreate".

    Forge:
      type: string
      maxLength: 7
      enum: [github, forgejo]

    CIStatus:
      type: string
      enum: [success, failure, pending, none]
      description: |
        The combined result across every check reported against the pull
        request's head commit. "none" means neither forge reported any
        check at all, not that one failed.

    CheckCounts:
      type: object
      required: [passed, running, waiting, failed, skipped]
      description: |
        How many checks are in each state, so a client can say how far a
        pipeline is without opening it. It is on every pull request and on
        every default branch, for a passed, a failed and a running pipeline
        alike. The server tallies them from what it already reads to work out
        the overall state, so they cost no request. Always present, all zero
        when there are no checks.

        `waiting` is a check that has not started: queued, or pending where the
        forge doesn't tell queued from running. A failed pipeline can still have
        checks running or waiting, and says so. A pull request's counts agree
        with its `ci`: one whose `ci` is `pending` has `failed` at 0, and one
        whose `ci` is `success` has nothing running, waiting or failed. Two
        kinds of run are therefore in none of the four, as long as something
        else explains the state. A run held for approval: on a pull request
        `awaitingWorkflowApproval` says that. A cancelled run: a push or a
        concurrency group superseded it, and the overall state does not read it
        as a failure while others still run. When cancelled runs (and, on a
        branch, held ones) are the only reason a pipeline reads as failed, they
        count as `failed` (a held run first, where both are there), so a failed
        pipeline always has a failed count on GitHub. A branch whose status is
        `cancelled` has `failed` at 0. A timed-out or stale check counts as `failed`, a skipped,
        neutral or bare completed one as `passed`, on Forgejo too.

        `skipped` is a newer field and says how many of the `passed` checks
        were skipped. It never exceeds `passed`: it is inside `passed`, not
        beside it, so `passed` still counts every check that needs nothing more
        and the four states still add up to the checks the pipeline lists. The
        server always sends it, which is why it is required; a client that may
        talk to an older server may read a missing one as zero. A neutral or bare
        completed check is passed without being skipped. A client that draws the
        two side by side must subtract `skipped` from `passed` for the passed figure, or a skipped check is
        counted twice, and a pipeline where every passed check was skipped can
        read as skipped.

        On GitHub the counts come from the same rollup as the overall state,
        for a pull request and a branch alike; on Forgejo a pull request counts
        the statuses of the combined commit status, which only say pending, and
        takes the running ones out of the pending count by reading the jobs of
        the commit's runs that are still going, and a default branch counts the
        jobs of the workflow runs of the newest commit that has one, where a
        running job is `running` and a queued or blocked one `waiting`. A run
        whose jobs can't be read counts as one check by its own status. Forgejo
        answers one page of those statuses, and when its total says there are
        more than the page holds a pull request's counts are all zero rather
        than an undercount. When GitHub's rollup of a pull request is of an
        earlier commit than the head (a push still being processed), the counts
        are zero too. GitHub's unauthenticated fallback has no such counts, so
        there they are all zero.
      properties:
        passed:
          type: integer
          minimum: 0
        running:
          type: integer
          minimum: 0
        waiting:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0

    CheckStatus:
      type: string
      enum: [queued, in_progress, completed, waiting]
      description: |
        How far one job has got, as a fact. The page works out what to show
        from it and `conclusion`.

        "waiting" is a GitHub workflow run held until a maintainer approves
        it. It has no jobs yet, so it is not queued and has not failed; its
        `url` is the run's page, where the approve button is. A check run
        that finishes as `action_required` is the other shape of the same
        wait: it is "completed" with that conclusion. The page treats the
        two alike.

    CheckConclusion:
      type: string
      examples: [success, failure, cancelled, skipped, timed_out, neutral]
      description: |
        How a finished job ended, in the forge's own word. Sent only when
        `status` is "completed". It is not folded onto a fixed set: GitHub
        sends its check run conclusion as it is (`success`, `failure`,
        `neutral`, `cancelled`, `skipped`, `timed_out`, `action_required`,
        `stale`, `startup_failure`) and Forgejo sends the terminal status of
        the job (`success`, `failure`, `cancelled`, `skipped`). A legacy
        commit status, which has no conclusion, is sent as `success` or
        `failure`. A client decides what each word means and what to do
        with one it doesn't know.

        `action_required` means the job needs someone's approval, and `url`
        is where to give it. The page shows it as waiting for approval,
        the same as a held run whose `status` is "waiting".

    Check:
      type: object
      required: [name, status, url]
      description: One job/check run against a pull request's head commit.
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/CheckStatus"
        conclusion:
          $ref: "#/components/schemas/CheckConclusion"
        url:
          type: string
          description: That job's own page on the forge that ran it — never the pull request's own page.
        jobId:
          type: integer
          minimum: 1
          description: |
            The Actions job (or check run) id to pass to GET /api/checks/log.
            Absent for a legacy commit status and for a workflow held for
            approval, which have no output to read.
        runId:
          type: integer
          minimum: 1
          description: |
            The Actions workflow run this job belongs to, to pass to
            `POST /api/checks/cancel-run`. Present on every Actions job,
            finished or not; only a job that is queued or running has
            anything left to cancel, which a client reads from `status`. A
            third-party check and a legacy commit status have none.

            A Forgejo run whose jobs couldn't be read is listed as one check
            named for the run, with a `runId` and no `jobId`. A client treats
            a check with a `runId` and no `jobId` as the run itself, not as a
            job of it, and doesn't list its name among the run's jobs.
        runName:
          type: string
          description: |
            The name of that workflow run, for a client to say which run a
            cancel stops. Present with `runId`; on GitHub it can be absent
            when the lookup of the commit's runs failed or didn't list the run.
        runNumber:
          type: integer
          minimum: 1
          description: |
            The forge's own number for that run, the one in the run's page
            address. It tells two runs of one workflow apart. Present with
            `runId` when the forge says it; on GitHub it can be absent when
            the lookup of the commit's runs failed or didn't list the run.
        required:
          type: boolean
          description: |
            Whether the base branch's protection makes this check block the
            merge (GitHub required status checks and rulesets, Forgejo
            `status_check_contexts`). Absent when the forge can't tell — a
            token that can't read protection, or a check that can't be
            mapped to a protection entry. Absent is not the same as false.
        startedAt:
          type: string
          format: date-time
          description: |
            When the forge says the job started. Absent until it has, and when
            the forge doesn't say. A client works out how long a job ran from
            this and `completedAt`.
        completedAt:
          type: string
          format: date-time
          description: |
            When the forge says the job finished. Absent while it runs, and
            when the forge doesn't say.
        runAttempt:
          type: integer
          minimum: 1
          description: |
            Which attempt of its workflow run the job belongs to. Both
            forges keep a run's id when it is retried, and Forgejo keeps the
            job's id and page too, so this is what tells a retry's output
            from the first attempt's. On GitHub it is absent for a check that
            isn't an Actions job, and when neither the job's page address nor
            the lookup of the commit's runs gives one.
        failedStep:
          type: string
          description: |
            The name of the step of a failed job that broke. Absent when
            the check isn't a job the token can read (a third-party check,
            a forge with no step data, a token without access).
        excerpt:
          type: string
          description: |
            The tail of the failed job's log as plain text: the last lines,
            with per-line timestamps and colour codes removed, at most 2,000
            characters. Never markup, and a client must render it as text.
            Whatever the forge already masks stays masked. Absent when the
            log can't be read or has expired. GitHub fills it for at most
            the first five failed jobs of a list, in the list's order.
            Forgejo never fills it in a list, since that would read a log
            while the list is built: ask for it through
            GET /api/checks/log with `excerpt=true`. The whole output is read
            through GET /api/checks/log.

    CheckLog:
      type: object
      required: [text, truncated]
      description: The output of one CI job.
      properties:
        text:
          type: string
          description: Plain text, never markup. A client must render it as text.
        truncated:
          type: boolean
          description: True when the start of the output was cut to fit the size cap.

    ClosingIssue:
      type: object
      required: [repo, number, url, pageUrl]
      description: One issue a pull request will close when it merges.
      properties:
        repo:
          type: string
          description: The issue's repository as `owner/name`, which is not always the pull request's own.
        number:
          type: integer
          minimum: 1
        url:
          type: string
          format: uri
          description: The issue's page on its forge.
        pageUrl:
          type: string
          description: |
            The address on this dashboard that opens the Issues page with this
            issue's pop-up open: `/issues.html?issue=` and
            `forge/owner/name/number`, on the pull request's own forge. A
            relative address. When the issue is closed, hidden by the user's
            settings or in a repo the dashboard does not track, the page opens
            no pop-up and shows a plain note over the list. The note has no
            forge link, since the dashboard knows nothing else about the issue.
          examples: ["/issues.html?issue=github/alrayyes/hush-hush/12"]

    MentionedIssue:
      type: object
      required: [repo, number, url, pageUrl, tracked]
      description: |
        One issue or pull request a pull request mentions without closing it.
        The number is an issue's or a pull request's, which the forge's address
        tells apart.
      properties:
        repo:
          type: string
          description: The repository as `owner/name`, which is not always the pull request's own.
        number:
          type: integer
          minimum: 1
        url:
          type: string
          format: uri
          description: Its page on the forge, which a client links to when `tracked` is false.
        pageUrl:
          type: string
          description: |
            The address on this dashboard that opens the Issues page with this
            issue's pop-up open, built the same way as the closing issue's. A
            relative address.
          examples: ["/issues.html?issue=github/alrayyes/hush-hush/12"]
        tracked:
          type: boolean
          description: |
            True when the dashboard holds it as an open issue it shows, so
            `pageUrl` opens its pop-up. False for a pull request, a closed
            issue, an issue the user's settings hide and anything in a repo
            the dashboard does not track; a client then links to `url`.

    LinkedPullRequest:
      type: object
      required:
        [
          forge,
          repo,
          number,
          draft,
          pageUrl,
          ci,
          checks,
          awaitingWorkflowApproval,
        ]
      description: One open pull request that will close an issue when it merges.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        repo:
          type: string
          description: The pull request's repository as `owner/name`, which is not always the issue's own.
        number:
          type: integer
          minimum: 1
        draft:
          type: boolean
          description: True while the pull request is a draft. Otherwise it is open.
        pageUrl:
          type: string
          description: |
            The address on this dashboard that opens the page listing the pull
            request, with its pop-up open: `/pull-requests.html`, `/releases.html`
            or `/bots.html`, whichever page lists that kind of pull request, then
            `?pr=` and `forge/owner/name/number`. A relative address.
          examples: ["/pull-requests.html?pr=github/alrayyes/hush-hush/12"]
        ci:
          $ref: "#/components/schemas/CIStatus"
        checks:
          $ref: "#/components/schemas/CheckCounts"
        awaitingWorkflowApproval:
          type: boolean
          description: |
            The same flag as on the pull request itself: true when GitHub is
            holding a workflow run on the head commit until someone approves
            it. A client says "waiting for approval" rather than "check
            failed" while it is true. Always present; false on Forgejo.

    Person:
      type: object
      required: [login, avatarUrl, url]
      description: Who wrote a description or a comment.
      properties:
        login:
          type: string
        avatarUrl:
          type: string
          description: The forge's own avatar URL, passed through unchanged and never proxied.
        url:
          type: string
          description: The person's profile page on the forge, built by the server from the web address of an item the board already holds for that forge. Empty when the board holds none yet, so a client shows the name alone.

    Reaction:
      type: object
      required: [count, logins]
      properties:
        count:
          type: integer
          minimum: 0
          description: How many people gave this reaction.
        logins:
          type: array
          maxItems: 10
          items:
            type: string
          description: The first few of them, at most 10. `count` is the full number.

    Reactions:
      type: object
      required: [thumbsUp, thumbsDown]
      description: The two reactions the dialog shows, `+1` and `-1` on both forges.
      properties:
        thumbsUp:
          $ref: "#/components/schemas/Reaction"
        thumbsDown:
          $ref: "#/components/schemas/Reaction"

    DetailsBody:
      type: object
      required: [text, format, truncated, edited, reactions]
      description: A pull request's description, or the release notes of a release pull request.
      properties:
        text:
          type: string
          description: |
            The text as the forge stores it, cut at 20,000 characters. Markdown,
            not converted or sanitised: render it with raw HTML disabled.
        format:
          type: string
          enum: [markdown]
          description: How `text` is written. Only markdown today; a later format is additive.
        truncated:
          type: boolean
          description: True when `text` was cut at 20,000 characters.
        edited:
          type: boolean
          description: True when the forge says the text was edited after it was posted.
        reactions:
          $ref: "#/components/schemas/Reactions"

    DetailsComment:
      type: object
      required:
        [
          id,
          author,
          createdAt,
          updatedAt,
          edited,
          text,
          format,
          truncated,
          reactions,
        ]
      description: One comment on the pull request's conversation.
      properties:
        id:
          type: string
          description: The forge's own identifier for the comment.
        author:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Person"
          description: Null for a deleted account; a client shows it as "ghost".
        createdAt:
          type: string
          format: date-time
        updatedAt:
          oneOf:
            - type: "null"
            - type: string
              format: date-time
          description: When the comment was last edited, or null if it never was.
        edited:
          type: boolean
        text:
          type: string
          description: Markdown, cut at 20,000 characters, not converted or sanitised.
        format:
          type: string
          enum: [markdown]
        truncated:
          type: boolean
        reactions:
          $ref: "#/components/schemas/Reactions"

    PullRequestDetails:
      type: object
      required:
        [description, comments, commentCount, commentsTruncated, releaseNotes]
      description: What the pull request dialog shows.
      properties:
        description:
          $ref: "#/components/schemas/DetailsBody"
        comments:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/DetailsComment"
          description: The conversation, oldest first, at most the first 50.
        commentCount:
          type: integer
          minimum: 0
          description: How many comments the forge has on the pull request.
        commentsTruncated:
          type: boolean
          description: True when `commentCount` is more than the comments returned.
        releaseNotes:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DetailsBody"
          description: |
            For a release pull request, the release notes it will publish (a
            release-please pull request's description is its changelog). Null
            for any other pull request, and for a release pull request this
            app can't identify. Never an empty string.

    ReleaseDetails:
      type: object
      required: [tag, name, url, publishedAt, notes]
      description: What the release dialog shows for a published release.
      properties:
        tag:
          type: string
        name:
          type: string
          description: The release's title. Empty when the forge has none, and then the tag is the title.
        url:
          type: string
          description: The release's page on the forge.
        publishedAt:
          type: string
          description: When it was published, RFC 3339. Always set, since a release with no publish date is a 404 instead.
        notes:
          $ref: "#/components/schemas/DetailsBody"

    IssueDetails:
      type: object
      required: [state, description, comments, commentCount, commentsTruncated]
      description: What the issue dialog shows.
      properties:
        state:
          type: string
          enum: [open, closed]
          description: |
            Whether the forge has the issue open or closed right now. The
            dialog draws its status from this, so an issue closed or reopened
            while the dialog is open shows the change.
        description:
          $ref: "#/components/schemas/DetailsBody"
        comments:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/DetailsComment"
          description: The conversation, oldest first, at most the first 50.
        commentCount:
          type: integer
          minimum: 0
          description: How many comments the forge has on the issue.
        commentsTruncated:
          type: boolean
          description: True when `commentCount` is more than the comments returned.

    CheckSubject:
      type: object
      required: [kind, forge, fullName]
      properties:
        kind:
          type: string
          maxLength: 16
          enum: [pull_request, main_branch]
        forge:
          type: string
          maxLength: 32
        fullName:
          type: string
          maxLength: 256
          description: The repository, as `owner/repo`.
        number:
          type: integer
          maximum: 2147483647
          description: The pull request number. Required for `pull_request`.

    StreamWatchRequest:
      type: object
      required: [streamId, subjects]
      properties:
        streamId:
          type: string
          maxLength: 128
          description: The `sid` the stream was opened with.
        subjects:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/CheckSubject"
        refresh:
          type: boolean
          description: |
            List every subject again, including the ones already watched.
            A client sends it after an action that changes the jobs.

    RunEvent:
      description: |
        The `data` of a `run` event on the dashboard stream: the jobs of
        one workflow run attempt of one subject, or one check that belongs
        to no run. A later event with the same `key` replaces the earlier
        one. An event with no `key` and no `checks` says the subject has
        none. An event with `error` set stands in for the whole listing.
      allOf:
        - $ref: "#/components/schemas/CheckSubject"
        - type: object
          properties:
            key:
              type: string
              description: |
                Names the unit this event replaces: `run/<runId>/<attempt>`
                for a run attempt, `job/<url>|<name>` for a check with no
                run. Absent when the subject has no checks or on an error.
            runId:
              type: integer
              format: int64
              description: Absent for a check with no run.
            runAttempt:
              type: integer
              format: int64
              description: |
                Absent when the check has no run or the forge doesn't
                number attempts.
            status:
              allOf:
                - $ref: "#/components/schemas/CheckStatus"
              description: |
                How far the run attempt itself has got, as the forge reports
                it. Forgejo's own status words fold onto the four values
                (running is `in_progress`; waiting, blocked and unknown are
                `queued`); a GitHub status other than these four (requested,
                pending) is `queued`. Absent for a check with no run (a
                legacy commit status, a third-party check run, a GitHub
                check run whose run the forge's lists don't hold) and for a
                run the forge gave no status.
            conclusion:
              allOf:
                - $ref: "#/components/schemas/CheckConclusion"
              description: |
                How the run attempt ended, in the forge's own word, once its
                `status` is "completed". It can differ from its jobs: a run
                can fail while one of its jobs passed. Absent whenever
                `status` is.
            startedAt:
              type: string
              format: date-time
              description: |
                When the forge says the run attempt started. Absent until it
                has, and when the forge doesn't say.
            completedAt:
              type: string
              format: date-time
              description: |
                When the forge says the run attempt finished. Absent until it
                has. GitHub gives no finish time for a run, so it is always
                absent there; the page can take the latest job's
                `completedAt`.
            checks:
              type: array
              items:
                $ref: "#/components/schemas/Check"
              description: Absent when `gone` or `error` is set.
            gone:
              type: boolean
              description: |
                The unit named by `key` is no longer listed; drop it.
            final:
              type: boolean
              description: |
                Set on the last event of a listing, so a client can draw
                once the whole listing has arrived.
            error:
              type: string

    MergeStatus:
      type: string
      enum: [mergeable, conflicting, blocked, unstable, unknown]
      description: |
        A pull request's mergeable/blocked state, as coarse as every forge
        this service talks to can agree on. "blocked" covers anything
        stopping a merge that isn't confirmed to be a real conflict —
        including Forgejo's own mergeable flag reporting false, since its
        server computes that asynchronously and can report it stale.
        "unstable" is GitHub's UNSTABLE: the pull request can be merged, but
        a check that branch protection doesn't require is failing or still
        running. Merge stays available.
        "unknown" covers both a forge that hasn't determined this yet and
        this service being unable to determine it.

    Label:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          examples: [kind/bug]
        color:
          type: string
          description: |
            The label's colour as a hex string with no leading "#",
            exactly as the forge reports it.
          pattern: "^[0-9a-fA-F]{6}$"
          examples: [d73a4a]

    ForgeErrorKind:
      type: string
      enum:
        [unreachable, unauthorized, not_found, rate_limited, conflict, unknown]
      description: |
        Why a forge is unreachable, or why a write to it was rejected, as
        coarse as every forge this service talks to can agree on.
        "unauthorized" covers both a bad token and a forbidden request;
        "not_found" usually means a wrong instance URL. "conflict" is only
        ever returned from a pull-request write — the forge reports the PR
        itself isn't currently mergeable. "unknown" covers a signal this
        service doesn't recognize, rather than a guessed-at specific cause.

    ForgeHealth:
      type: object
      required: [forge, reachable, repoCount]
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        reachable:
          type: boolean
          description: Whether the last refresh attempt against this forge succeeded.
        starting:
          type: boolean
          description: |
            True while the rows shown for this forge are the ones the last run
            saved and no refresh has asked the forge since the app started.
            The forge is then neither reachable nor in error (errorKind is
            absent); it has not been checked yet. The first refresh that
            reaches it replaces this entry. A client says "starting up,
            showing data from 3 minutes ago", and never "unreachable".
        staleSince:
          type: string
          format: date-time
          description: |
            Present when the last refresh against this forge failed, or the
            forge has not been asked yet since the app started (see
            starting), and the pull requests, issues and repos in the
            response are the last good ones, fetched at this time, instead of
            none. Absent when the data
            is current, and for a forge that has never fetched successfully,
            which has nothing to show. A client can say "unreachable, showing
            data from 3 minutes ago".
        error:
          type: string
          description: >-
            A human-readable explanation of the last failure, if reachable is
            false. Mapped from errorKind, not the raw underlying error text.
            Omitted when reachable.
        errorKind:
          $ref: "#/components/schemas/ForgeErrorKind"
        repoCount:
          type: integer
          minimum: 0
          description: Repositories with write access this forge reported.
        rateLimitGraphQL:
          allOf:
            - $ref: "#/components/schemas/RateLimit"
          description: >-
            GitHub's GraphQL budget — a completely separate
            5000/hour allowance from rateLimitREST, populated from the
            rateLimit block GitHub embeds in every GraphQL response.
            Never set for a forge with no GraphQL API (Forgejo).
        rateLimitREST:
          allOf:
            - $ref: "#/components/schemas/RateLimit"
          description: >-
            The forge's REST budget, from real X-RateLimit-* response
            headers. For GitHub, this is checkWebhooks and every write
            action (merge, update branch, comment, label) — a different
            5000/hour allowance from rateLimitGraphQL, not a duplicate of
            it. Omitted on a poll that made no REST call at all (no
            webhook path configured). For Forgejo, or any forge reached
            through GenericSource, this is the only budget there is to
            report — GenericSource makes exclusively REST-style calls.
        dependabotCommandsBlocked:
          type: string
          description: >-
            Why a "@dependabot" comment sent through this forge's credential
            would be refused. Dependabot only honours commands from a
            user with push access and ignores GitHub App accounts whatever
            permissions the App holds. Set only for GitHub when the
            connected credential is an App with no personal access token
            saved to send commands as. The Dependabot buttons lock with this
            text, auto-update-branch skips Dependabot pull requests, and the
            dependabot-action endpoint answers 409 with it. Omitted when
            commands work.
        rerunChecksBlocked:
          type: string
          description: >-
            Why this forge can't rerun checks. Set only for a Forgejo whose
            version is 7 to 16, which has no API route for it. A version
            below 7 is left to the forge, because a Gitea numbers itself that
            way. The version is read in the background, read again after an
            hour while it blocks, and retried after a failed read or one that
            gives no number. A block that has gone stale is dropped when the
            read fails. Rerun failed checks is not offered for the forge, and
            the page shows this text where the button would be. Omitted when
            rerunning works or the version could not be read.

    ForgeApiStats:
      type: object
      required: [since, buckets, budgets]
      properties:
        since:
          type: string
          format: date-time
          description: When counting began, which is when the server last started.
        buckets:
          type: array
          description: >-
            One row per forge, credential, kind and repository that made a
            request, ordered by forge, credential, kind and repo.
          items:
            $ref: "#/components/schemas/ForgeApiBucket"
        budgets:
          type: array
          description: The rate limits each forge last reported, one row per forge.
          items:
            $ref: "#/components/schemas/ForgeApiBudget"

    ForgeApiBucket:
      type: object
      required:
        [forge, credential, kind, repo, rest, graphql, graphqlCost, notModified]
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        credential:
          type: string
          maxLength: 80
          description: >-
            The credential the requests were made with, as a label with no
            secret and no user id.
        kind:
          type: string
          maxLength: 32
          description: >-
            Why the requests were made. Open-ended, so a new kind is not a
            breaking change; today `full`, `scoped_webhook`, `ci_poll`,
            `auto_merge_poll`, `details`, `hook_maintenance`, `advisories`,
            `user_action` and `unknown`.
        repo:
          type: string
          maxLength: 200
          description: >-
            The repository as `owner/name`, or empty when the request touched
            no single repository. `other` collects the repositories past the
            cap on how many are counted separately.
        rest:
          type: integer
          minimum: 0
          description: REST requests that were charged against the REST budget.
        graphql:
          type: integer
          minimum: 0
          description: GraphQL requests made.
        graphqlCost:
          type: integer
          minimum: 0
          description: The `rateLimit.cost` points the GraphQL requests were charged.
        notModified:
          type: integer
          minimum: 0
          description: Requests answered `304 Not Modified`, which cost nothing.

    ForgeApiBudget:
      type: object
      required: [forge]
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        rateLimitGraphQL:
          allOf:
            - $ref: "#/components/schemas/RateLimit"
          description: The forge's GraphQL budget as last reported; absent when it has none.
        rateLimitREST:
          allOf:
            - $ref: "#/components/schemas/RateLimit"
          description: The forge's REST budget as last reported; absent when not reported.

    RateLimit:
      type: object
      required: [limit, remaining, resetsAt]
      description: >-
        One of a forge API's own request budgets for the credential the
        last refresh used — see ForgeHealth.rateLimitGraphQL/rateLimitREST
        for which budget this is and when each is (or isn't) reported.
      properties:
        limit:
          type: integer
          minimum: 0
          description: Requests allowed per window.
        remaining:
          type: integer
          minimum: 0
          description: Requests left in the current window.
        resetsAt:
          type: string
          format: date-time
          description: When the window resets and remaining goes back to limit.
        cost:
          type: integer
          minimum: 0
          description: >-
            The point price the most recent call was actually charged —
            GraphQL-specific, since a REST request has no
            separate cost concept beyond the flat one-request-one-point
            REST's own budget already counts. Omitted for a REST-sourced
            RateLimit.

    PullRequest:
      type: object
      required:
        [
          forge,
          repo,
          number,
          title,
          url,
          author,
          authorAvatarUrl,
          authorUrl,
          draft,
          labels,
          createdAt,
          updatedAt,
          ci,
          checks,
          mergeStatus,
          behind,
          headSha,
          kind,
          baseBranch,
          headBranch,
          crossRepository,
          stack,
          stackedOn,
          stackChildren,
          requestedReviewerLogins,
          reviewComments,
          conversationComments,
          closesIssues,
          mentionsIssues,
          unresolvedThreads,
          awaitingWorkflowApproval,
          reviewRequestedFromMe,
          empty,
          allowedActions,
          status,
          readyToMerge,
          failingCi,
          needsReview,
          autoUpdate,
        ]
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        repo:
          type: string
          description: Owner-qualified repository name.
          examples: [alrayyes/hush-hush]
        number:
          type: integer
        title:
          type: string
        url:
          type: string
          format: uri
          description: The real pull request URL on its own forge.
        author:
          type: string
        authorAvatarUrl:
          type: string
          description: The forge's own avatar URL for the author, passed through unchanged and never proxied. Empty when the forge supplies none, such as a deleted account.
        authorUrl:
          type: string
          description: The author's profile page on the forge, built by the server from the forge's own web address, so a client needs no rule per forge. A GitHub bot links to its app page. Empty when there is nothing to link to, such as a deleted account.
        draft:
          type: boolean
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        ci:
          $ref: "#/components/schemas/CIStatus"
        checks:
          $ref: "#/components/schemas/CheckCounts"
        mergeStatus:
          $ref: "#/components/schemas/MergeStatus"
        behind:
          type: boolean
          description: |
            Whether this pull request's base branch has moved since its
            merge-base was computed. Deliberately its own field rather
            than a mergeStatus value: on Forgejo a pull request can be
            both mergeable and behind at once (its mergeable flag doesn't
            get recomputed just because the base moved), so folding this
            into mergeStatus would force picking one and losing the
            other.
        headSha:
          type: string
          description: |
            The commit the pull request's head branch points at. A bot's
            rebase moves it, which shows the bot acted even when the pull
            request is still reported behind, or wasn't behind to begin
            with. Empty when the forge didn't say. Always present.
        kind:
          type: string
          enum: [release, dependency, regular]
          description: |
            What sort of pull request this is, decided by the server so no
            client keeps its own copy of the rule. `release`: release-please's,
            by its `autorelease:` label (a person opens these, so the label is
            the main signal, and it wins over any bot author), or, when the
            label is missing because release-please failed before applying it,
            by its head branch: `release-please--branches--<base branch>`
            (with `--components--<name>` after it for a repo that releases
            several components) in the same repository and aimed at that base
            branch. A fork's pull request is never a release. `dependency`:
            opened by Dependabot or Renovate, in either spelling of the login
            (the bare slug GraphQL gives, or REST's `[bot]` form), on either
            forge. `regular`: everything else. Always present.
        baseBranch:
          type: string
          description: |
            The branch the pull request targets. Empty when the forge didn't
            say.
        headBranch:
          type: string
          description: |
            The branch the pull request comes from. Empty when the forge
            didn't say.
        crossRepository:
          type: boolean
          description: |
            True when the head branch lives in another repository (a fork).
            A fork pull request is never part of a stack.
        stack:
          description: |
            Where this pull request sits in a stack of pull requests, or
            null when it is in none. A stack is worked out on the server:
            pull request B is stacked on A when B's base branch is A's head
            branch, in the same repository on the same forge, and neither is
            a fork. A branch with several open pull requests takes the one
            with the lowest number as parent, and a loop of branches is
            treated as no stack. The snapshot holds open pull requests
            only, so a base branch that no open pull request owns (a parent
            that already merged and was not retargeted) is not flagged.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/StackPosition"
        stackedOn:
          description: |
            The open pull request this one is stacked on, or null when its
            base is not another open pull request's head.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/StackRef"
        stackChildren:
          type: array
          items:
            type: integer
          description: |
            The numbers of the open pull requests stacked directly on this
            one. Always a list, empty when none.
        botRequest:
          description: |
            A Dependabot or Renovate rebase asked for through this app and not
            settled yet, or null. The server keeps it, so a reload during the
            wait still shows it, and moves it along on every snapshot that
            came from a fetch started after the request. Held in memory per
            account: a server restart forgets it.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/BotRequest"
        updateRequest:
          description: |
            An Update branch the forge accepted and that no snapshot has shown
            landing yet, or null. The server keeps it, so a reload during the
            wait still shows it. It is dropped once a snapshot from a fetch
            started after the request shows the pull request no longer
            behind, or when the pull request is gone. Held in memory per
            account: a server restart forgets it.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/UpdateRequest"
        queued:
          description: |
            A safe action this user queued on this pull request that is still
            waiting for its forge's rate limit to reset, or null. The row can
            say "Update branch queued for 14:32" from `runAt` and offer
            Cancel with `id`. A final outcome is not here: it is in the
            dashboard's `queuedActions`.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/QueuedAction"
        requestedReviewerLogins:
          type: array
          items:
            type: string
          description: |
            The logins of the users asked to review this pull request, on
            both forges. A team request has no login and is left out.
            Always present, and empty when nobody was asked. Costs no
            extra request: GitHub returns it with the reviewRequests count
            already queried, Forgejo with the pull request itself.
        awaitingWorkflowApproval:
          type: boolean
          description: |
            True when GitHub is holding a workflow run on the head commit
            until someone approves it: its rollup counts a check run
            as ACTION_REQUIRED. Those runs also keep `ci` at failure when
            nothing else is running, so a client reads this to say "waiting
            for approval" rather than "check failed". It can be true while
            `ci` is pending (other runs are going) or failing for another
            reason too. Always present; false on Forgejo, which has no
            such state.
        reviewComments:
          type: integer
          minimum: 0
          description: |
            How many review comments the pull request has, the ones on a
            line of code. Ordinary conversation comments are counted apart,
            in `conversationComments`. Always present, and 0 when
            there are none or the forge can't say (a Forgejo draft or failed
            reviews call, GitHub's unauthenticated fallback). On GitHub it is read from
            the review threads in the pull request query, first 30 threads; on Forgejo it is the sum
            of each review's comment count, from the reviews call that already
            feeds `review`, so a draft (which makes no such call) reports 0.
        conversationComments:
          type: integer
          minimum: 0
          description: |
            How many ordinary comments the pull request's conversation has,
            apart from `reviewComments`. A review's own body is not a comment.
            Always present, and 0 when there are none. On GitHub it comes from
            the pull request query, on Forgejo from the pull request itself, so
            neither costs a request.
        closesIssues:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ClosingIssue"
          description: |
            The issues the pull request will close when it merges. Always
            present, and empty when there are none. On GitHub it is the
            forge's own list of closing references, read in the pull request
            query; GitHub's unauthenticated fallback (no token) has no such
            field, so it lists none. Forgejo has none either, so the server
            reads the closing keywords (close, closes, closed, fix, fixes,
            fixed, resolve, resolves, resolved) in the description the way
            Forgejo does: a keyword, an optional colon, one space, then `#NUMBER`
            or `owner/repo#NUMBER`, and each keyword covers the one reference
            right after it. Code, HTML comments and a number that runs into
            letters count for nothing. The `owner/repo#NUMBER` form follows
            Forgejo's source and has not been tried on a live instance. Only a
            pull request aimed at its repo's default branch closes anything,
            so one aimed elsewhere always lists none.
        mentionsIssues:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/MentionedIssue"
          description: |
            The issues and pull requests the title or description mentions
            without closing them, in order of first appearance and without
            repeats, at most 20. Always present, and empty when there are none.
            A mention is what GitHub and Forgejo both link: `#NUMBER`,
            `owner/repo#NUMBER`, or the address of an issue or pull request
            page on the forge, and on GitHub also `GH-NUMBER`. It has to stand
            alone: `abc#1`, `&#1` and `#1abc` are not mentions, while emphasis
            and table markup around it (`**#1**`, `_#1_`, `|#1|`) is fine. Code,
            HTML comments and the text of a link, Markdown or HTML anchor,
            count for nothing, and a link counts only by its target, when that
            is a page on the forge. Only the first 64 KiB of the description is
            read, cut at a space (a Unicode space too; with none, at the last
            comma or semicolon outside brackets; an anchor still open within 1 KiB of the cut
            loses the text after its tag), and the first 100 references in it. A reference
            in a quotation still counts, and the pull request's own number
            does not. What the pull request actually
            closes is left out, even when the text also mentions it, and the
            cap applies after that. Which references close depends on the
            branch the pull request aims at, so a closing keyword on a pull
            request that does not target the default branch is a mention. Only
            the description closes, so a keyword in the title is a mention.
            Comments, reviews and commit messages are not read. The server
            reads the text on both forges, with or without a GitHub token, so a
            client needs no rule of its own.
        unresolvedThreads:
          oneOf:
            - type: "null"
            - type: integer
              minimum: 0
          description: |
            How many review threads are still open, or null when the forge
            can't say. GitHub reports it from its review threads, except in the
            unauthenticated fallback, which has none. Forgejo reports no
            resolved state on a review without a call per review, so it is null
            there and a client shows the comment count without an open state.
        reviewRequestedFromMe:
          type: boolean
          description: |
            True when this open, non-draft pull request asks the signed-in
            user to review it, matched without regard to case against the
            username saved in Settings for its forge. False when no
            username is saved for that forge. Always present.
        empty:
          type: boolean
          description: |
            Whether merging this pull request would produce an empty
            commit — its content already landed on the base branch some
            other way. False whenever this service can't tell (the
            unauthenticated GitHub REST fallback, or a Forgejo instance
            old enough not to report additions/deletions/changed_files on
            its list endpoint), never a false positive: a pull request
            this never confirms empty just renders as it always has.
        autoMergeEnabled:
          type: boolean
          description: |
            Whether auto-merge is currently scheduled on this pull request.
            On Forgejo it is true when the signed-in user armed it in this
            app, which holds the intent itself, or when a merge is scheduled
            on Forgejo (read from the issue timeline's `pull_scheduled_merge`
            and `pull_cancel_scheduled_merge` events, for open non-draft pull
            requests, a bounded number per refresh). It is false once the
            timeline shows no schedule. Omitted when it hasn't been read yet
            or the read failed, since this service then doesn't know.
        autoMergeHeldBy:
          type: string
          x-extensible-enum: [dashboard, forge]
          description: |
            Who holds the auto-merge, so a client can word it right. Present
            only when `autoMergeEnabled` is true. `dashboard` means this app
            holds a stored intent and performs the merge itself (Forgejo).
            `forge` means the merge is scheduled on the forge: Forgejo's own
            scheduled merge, or GitHub's auto-merge. When both exist on
            Forgejo it is `dashboard`, since this app's loop merges and
            Cancel clears both. Omitted means unknown: a client must not
            guess it from other fields, and should treat a value it doesn't
            know like an omitted one.
        autoMergeAllowed:
          type: boolean
          description: |
            Whether GitHub will accept an "Enable auto-merge" request for
            this pull request from the signed-in viewer, read from the
            GraphQL `PullRequest.viewerCanEnableAutoMerge` field. GitHub
            decides this per viewer and per pull request: auto-merge needs
            something on the base branch to wait for (required checks or
            reviews from a branch protection rule or ruleset), so a stacked
            pull request on an unprotected base reports false even when the
            repository allows auto-merge. Omitted when unknown (the
            unauthenticated REST fallback, and Forgejo), never false in
            that case, so clients keep today's behaviour.
        review:
          $ref: "#/components/schemas/ReviewState"
        allowedActions:
          type: array
          items:
            $ref: "#/components/schemas/AllowedAction"
          description: |
            The actions this pull request offers, worked out on the server
            from its own fields, so a client needs no copy of the rules. An
            action that doesn't apply (Update branch on a pull request that
            isn't behind, a Dependabot command on a Renovate pull request)
            is absent, not listed as blocked. Always present; `close` is
            always in it. Live state is the client's: a rate-limited or
            unreachable forge, a missing token and an action already in
            flight can still stop an offered action.
        status:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/PullRequestStatus"
          description: |
            The one reason this pull request is waiting on something or can't
            be merged, for a fixed place on its row: a check still
            running, a conflict, a draft, a parent it is stacked on, or, for
            an empty pull request, that there is nothing to merge. `code`,
            `message` and `next` are the same as on `allowedActions[].blocked`,
            and for a pull request that waiting or fixing can unlock they
            repeat Merge's blocked reason. An empty pull request offers no
            `merge` (only `close`), so this is where its reason lives. Null
            when nothing holds the pull request back. Always present.
        autoMerge:
          $ref: "#/components/schemas/AutoMergeStatus"
        hidden:
          type: boolean
          description: |
            True on a pull request the user hid. Only present when the request
            set `includeHidden=true`: without it a hidden pull request isn't
            in the list at all.
        hiddenUntil:
          type: string
          format: date-time
          description: |
            When a hide for a number of days ends. Absent for a pull request
            hidden until it is restored, and for one that isn't hidden.

        readyToMerge:
          type: boolean
          description: |
            True when the pull request is mergeable, its CI is green and it
            isn't a draft: what the Ready quick filter lists. Always
            present. A pull request with no checks isn't ready.
        failingCi:
          type: boolean
          description: |
            True when CI is failing and not only because a workflow run is
            held for approval: what the Failing CI quick filter lists, and
            what the menu pill's Failed number counts. Always present.
        needsReview:
          type: boolean
          description: |
            True when a review is outstanding: the forge requires one, or a
            reviewer was asked and hasn't answered, and the pull request
            isn't a draft. Unreviewed with nobody asked, approved, changes
            requested and an unknown review state are all false. Always
            present.
        autoUpdate:
          $ref: "#/components/schemas/AutoUpdate"

    AutoUpdate:
      type: object
      required: [enabled, source, unavailable]
      description: |
        Whether the dashboard brings this pull request's branch up to date by
        itself: the pull request's own choice when it has one
        (`POST /api/pull-requests/auto-update`), else its repo's
        auto-update setting. Always present.
      properties:
        enabled:
          type: boolean
          description: |
            What the background pass does with this pull request. Always
            false when `unavailable` is set.
        source:
          type: string
          enum: [repo, pullRequest]
          description: |
            `repo` when the pull request follows its repo's setting,
            `pullRequest` when the user chose for this one.
        unavailable:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AutoUpdateUnavailable"
          description: |
            Set when the pass skips this pull request however it is switched,
            so a client shows the reason instead of a switch that does
            nothing. Null otherwise.

    AutoUpdateUnavailable:
      type: object
      required: [code, reason]
      properties:
        code:
          type: string
          enum: [draft, release_please]
        reason:
          type: string
          description: A sentence a client can show as it is.

    PullRequestAutoUpdateRequest:
      type: object
      required: [forge, fullName, number]
      description: |
        Which pull request, and whether the dashboard should update its
        branch automatically.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          maxLength: 255
          description: '"owner/repo", matching a Repo.fullName from GET /api/dashboard.'
        number:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Matching a PullRequest.number from GET /api/dashboard.
        enabled:
          type: [boolean, "null"]
          description: |
            `true` to update this pull request automatically, `false` to
            leave it alone, whatever its repo says. `null` or absent
            returns it to its repo's setting.

    QueuedActionRequest:
      type: object
      required: [action, forge, fullName, number]
      description: Which safe action to queue, on which pull request.
      properties:
        action:
          type: string
          enum: [update_branch, dependabot_rebase, renovate_rebase]
          maxLength: 32
          description: |
            The `AllowedAction.action` to run at the reset. Only these
            three are queueable; Merge, Close and the rest answer 400.
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          maxLength: 255
          description: '"owner/repo", matching a Repo.fullName from GET /api/dashboard.'
        number:
          type: integer
          maximum: 2147483647
          description: Matching a PullRequest.number from GET /api/dashboard.

    QueuedAction:
      type: object
      required: [id, action, forge, fullName, number, status, runAt, createdAt]
      description: |
        A safe action queued to run when a rate-limited forge resets. A
        client shows a `queued` one as "Update branch queued for 14:32"
        with Cancel, and a final one in its Activity list.
      properties:
        id:
          type: string
          description: Opaque. What DELETE /api/queued-actions/{id} takes.
        action:
          type: string
          enum: [update_branch, dependabot_rebase, renovate_rebase]
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          description: '"owner/repo".'
        number:
          type: integer
        status:
          type: string
          enum: [queued, done, skipped, failed]
          description: |
            `queued`: waiting for the reset. `done`: the action ran.
            `skipped`: the server re-read the pull request at the reset and
            it no longer needed the action, so nothing was done; `code` and
            `message` say why ("Already merged"). `failed`: the action ran
            and the forge refused, with the structured `code` and `message`
            an immediate action would have answered.
        runAt:
          type: string
          format: date-time
          description: |
            When the forge's budget comes back, which is when the server
            looks again. If the budget is spent again by then, it moves to
            the new reset instead of failing.
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          description: Only on a final status.
        code:
          type: string
          description: |
            Only on `skipped` and `failed`. A value of ActionError.code,
            for example `already_merged`, `already_closed`, `not_open`,
            `already_up_to_date`, `conflict`, `already_requested`,
            `permission`.
        message:
          type: string
          description: Only on `skipped` and `failed`. Plain words safe to show a person.

    BotRequest:
      type: object
      required: [bot, action, phase, requestedAt, expiresAt]
      properties:
        bot:
          type: string
          enum: [dependabot, renovate]
        action:
          type: string
          enum: [rebase, recreate]
          description: |
            `recreate` is Dependabot's only. Renovate's rebase label is
            reported as `rebase`.
        phase:
          type: string
          enum: [queued, rebasing, expired]
          description: |
            `queued`: asked, and nothing seen yet. `rebasing`: the bot
            pushed (the head changed, or the pull request was behind and
            isn't), and CI hasn't restarted yet. `expired`: the bot didn't
            act within 10 minutes. An expired request stays until the pull
            request is gone, a new request replaces it, or an hour passes.
            A request is dropped once CI shows pending after the push, 2
            minutes into `rebasing`, or when the pull request is gone.
        requestedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: |
            When the server stops waiting in the current phase: 10 minutes
            after the request while `queued` (10 minutes after
            `acknowledgedAt` once Dependabot has acknowledged), 2 minutes
            after the pickup while `rebasing`.
        acknowledgedAt:
          type: string
          format: date-time
          description: |
            When the server first saw Dependabot's thumbs-up on the
            `@dependabot rebase` comment, which is how Dependabot says it
            received the command. Absent until then, and always absent for
            Renovate and for `recreate`. A thumbs-up that arrives after the
            request expired moves it back to `queued`.
        commentUrl:
          type: string
          format: uri
          description: |
            The command comment on GitHub, once the server has found it.
            Absent before that, and for Renovate.

    UpdateRequest:
      type: object
      required: [phase, requestedAt, expiresAt]
      properties:
        phase:
          type: string
          enum: [queued, expired]
          description: |
            `queued`: accepted, and the pull request is still behind.
            `expired`: still behind after 5 minutes. An expired request stays
            until the pull request is gone, a new request replaces it, or an
            hour passes.
        requestedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: |
            When the server stops waiting in the current phase: 5 minutes
            after the request while `queued`.

    StackPosition:
      type: object
      required: [position, size]
      properties:
        position:
          type: integer
          minimum: 1
          description: |
            1 for the pull request at the bottom of the stack (the one
            targeting a branch no open pull request owns), 2 for one
            stacked directly on it, and so on.
        size:
          type: integer
          minimum: 2
          description: How many open pull requests the stack holds.

    StackRef:
      type: object
      required: [number, url]
      properties:
        number:
          type: integer
        url:
          type: string
          format: uri

    CancelRunRequest:
      type: object
      required: [forge, fullName, runId]
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          maxLength: 255
          description: The repository, as "owner/repo".
        runId:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: The workflow run to cancel, from a check's `runId`.

    AllowedAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          description: |
            One of the values below today, and the server may learn more.
            A client should treat a value it doesn't know as an action it
            can't offer, not as an error. Declared with `x-extensible-enum`
            so adding a value is a minor SDK release.
          x-extensible-enum:
            - merge
            - close
            - update_branch
            - auto_merge
            - cancel_auto_merge
            - dependabot_rebase
            - dependabot_recreate
            - renovate_rebase
            - cancel_renovate_rebase
            - rerun_checks
            - cancel_run
        primary:
          type: boolean
          description: |
            True on the one action a client draws as the pull request's main
            button, and absent on every other entry. At most one entry in the
            list has it, never a blocked one, and a pull request can have none.
            The server decides it, so a client renders it and holds no rule of
            its own; a client that doesn't know the field still gets the
            whole list. Which action it is:
            `close` for an empty pull request; `merge` when Merge is offered
            and not blocked, unless the CI is failing (Merge is then only open
            because the failing checks aren't required, and `status` explains
            it); `update_branch`, or `renovate_rebase` or `dependabot_rebase`
            for a bot pull request, when being behind the base branch is what
            holds Merge back. A bot pull request that is behind also has its
            rebase here whatever else holds Merge back (checks running or
            failing, auto-merge armed), unless it conflicts, is a draft, is
            stacked, or its workflow runs wait for approval. In that last
            case, for any author, whenever Merge is blocked or not yet known
            and the checks aren't running, Merge gives the approval as its
            reason. If the pull request is also behind (and not stacked, a
            draft or empty), `update_branch`, the bot rebases and
            `dependabot_recreate` are listed blocked with the same code and
            message and a `next` of their own, so none is primary and a client
            draws each locked with the reason. Every other state has
            none: checks running or failing on a pull request that is not a
            behind bot one, a conflict, a draft, a stack parent, or the
            forge's own block. `status` gives the reason there.
        blocked:
          type: object
          required: [code, message]
          description: |
            Present when the action is offered but can't be taken yet. Merge
            is blocked rather than hidden while waiting or fixing something can
            unlock it. An empty pull request, which nothing can unlock, has no
            `merge` entry at all: see `status`.
            A request that is already waiting is never listed blocked. While
            Renovate's rebase checkbox in the pull request description is
            ticked, whether from this app or on the forge, `renovate_rebase`
            is absent and `cancel_renovate_rebase` is listed instead. A
            Renovate rebase asked for through this app with no checkbox
            behind it, and a Dependabot rebase or recreate that is pending,
            list neither request nor cancel: Dependabot has no command to
            withdraw one. The request is offered again once the bot has
            acted or the request has expired.
          properties:
            code:
              type: string
              description: |
                The same codes as `ActionError.code`. The server may learn
                more, so a client should show `message` for a code it doesn't
                know. Declared with `x-extensible-enum`.
              x-extensible-enum:
                - already_up_to_date
                - conflict
                - not_mergeable
                - checks_pending
                - checks_failing
                - behind
                - blocked_by_protection
                - stacked
                - already_requested
            message:
              type: string
              description: Plain words, safe to show a person.
            next:
              type: string
              description: What unlocks it, when something does.

    PullRequestStatus:
      type: object
      required: [code, message]
      description: |
        Why a pull request is waiting on something or can't be merged, in one
        place for a client to show. Same fields as
        `AllowedAction.blocked`, plus `action`.
      properties:
        code:
          type: string
          description: |
            The same codes as `AllowedAction.blocked.code`. The server may
            learn more, so a client should show `message` for a code it
            doesn't know. Declared with `x-extensible-enum`.
          x-extensible-enum:
            - already_up_to_date
            - conflict
            - not_mergeable
            - checks_pending
            - checks_failing
            - behind
            - blocked_by_protection
            - stacked
            - already_requested
        message:
          type: string
          description: Plain words, safe to show a person.
        next:
          type: string
          description: What unlocks it or what to do about it, when there is something.
        action:
          type: string
          description: |
            The `allowedActions[].action` that clears this status, set only
            when `code` is `behind`: `update_branch`, or the bot's own rebase
            on a Dependabot or Renovate pull request. A client draws that
            action's button inside the status line and nowhere else on the
            row. Absent when no action clears it (a conflict, a check still
            running, a draft) and when the rebase is already requested, so
            it is not offered. When set it is the entry marked
            `primary`. The reverse doesn't hold: a behind bot pull request
            that waits on checks has a primary rebase and no `action` here.

    ReviewState:
      type: object
      required: [decision, approvals, requestedReviewers]
      description: |
        Where a pull request stands on code review. The whole object is
        omitted when the owning forge couldn't report it (a Forgejo
        reviews call that failed, a draft Forgejo pull request this
        service doesn't spend a call on), so a missing "review" means
        "unknown" and never "nobody reviewed it."

        GitHub: read from fields on the existing GraphQL query
        (reviewDecision, reviewRequests, latestReviews), so it adds no
        per-pull-request requests. Forgejo: requestedReviewers comes free
        on the pull request list, but approvals and the decision need one
        reviews call per open, non-draft pull request, cached until that
        pull request's updatedAt changes.
      properties:
        decision:
          type: string
          enum: [approved, changes_requested, review_required, none]
          description: |
            "approved" and "changes_requested" mean what they say.
            "review_required" means a review is still outstanding: GitHub
            says so itself when branch protection requires one, and on
            Forgejo it means reviewers are requested and nobody has
            approved. "none" means no review activity and nothing
            required or requested.
        approvals:
          type: integer
          minimum: 0
          description: |
            Reviewers whose latest review is an approval. GitHub counts
            at most the 10 most recent reviewers.
        requestedReviewers:
          type: integer
          minimum: 0
          description: Users and teams still asked to review.

    Issue:
      type: object
      required:
        [
          forge,
          repo,
          number,
          title,
          url,
          author,
          authorAvatarUrl,
          authorUrl,
          labels,
          housekeeping,
          linkedPullRequests,
          mentionedByPullRequests,
          createdAt,
          updatedAt,
        ]
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        repo:
          type: string
          examples: [alrayyes/hush-hush]
        number:
          type: integer
        title:
          type: string
        url:
          type: string
          format: uri
          description: The real issue URL on its own forge.
        linkedPullRequests:
          type: array
          items:
            $ref: "#/components/schemas/LinkedPullRequest"
          description: |
            The open pull requests that will close the issue when they merge,
            the other side of a pull request's `closesIssues`, ordered by
            repository and number. Always present, and empty when there are
            none. The server joins the pull requests it already holds, so it
            costs the forge no request. It counts every open pull request the
            user could see, including a draft and one they hid, but not one in
            a repository whose pull requests they ignore. A pull request that
            merged or closed is gone from the list on the next refresh.
        mentionedByPullRequests:
          type: array
          items:
            $ref: "#/components/schemas/LinkedPullRequest"
          description: |
            The open pull requests that mention the issue without closing it,
            the other side of a pull request's `mentionsIssues`, ordered by
            repository and number and with the same entry as
            `linkedPullRequests`. A pull request that closes the issue is only
            in `linkedPullRequests`. Always present, and empty when there are
            none. The pull requests counted are the same as in `linkedPullRequests`.
        housekeeping:
          type: boolean
          description: |
            True for an issue a bot keeps open and rewrites, Renovate's
            "Dependency Dashboard", which is not work for a person. The
            server decides, so every client lists and counts the same
            issues. It stays in `issues`, and `openIssueCount` leaves it out,
            unless the user's `hideDependencyDashboard` setting is on: then
            the server leaves it out of `issues` as well.
        author:
          type: string
        authorAvatarUrl:
          type: string
          description: The forge's own avatar URL for whoever filed the issue, passed through unchanged and never proxied. Empty when the forge supplies none, such as a deleted account.
        authorUrl:
          type: string
          description: The author's profile page on the forge, built by the server from the forge's own web address. Empty when there is nothing to link to, such as a deleted account.
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    NavPullRequestCount:
      type: object
      required: [total, running, failed, passed]
      description: |
        A pull request page's numbers. `running`, `failed` and
        `passed` count the pull requests whose CI is pending, failing and
        succeeded. A pull request with no checks counts in `total` only, so
        the four numbers need not add up. All four are always present.
      properties:
        total:
          type: integer
          minimum: 0
          description: How many pull requests the page lists.
        running:
          type: integer
          minimum: 0
          description: How many of them have CI that is still pending.
        failed:
          type: integer
          minimum: 0
          description: |
            How many of them have failing CI. A pull request whose only
            failure is workflow runs held until someone approves them
            (`awaitingWorkflowApproval`) is counted in `total` and not here,
            as nothing failed; one with a job that really failed beside a
            held run still counts.
        passed:
          type: integer
          minimum: 0
          description: How many of them have CI that succeeded.

    NavIssueCount:
      type: object
      required: [total]
      properties:
        total:
          type: integer
          minimum: 0
          description: |
            How many open issues are real work, the same number as
            `openIssueCount`. Issues have no failing state, so there is no
            `failed`.

    NavCounts:
      type: object
      description: |
        The numbers behind the navigation badges, counted from what the
        board shows by default, so they match each page when it opens. Pull
        requests leave out ignored repos, draft pull requests and hidden pull
        requests whatever `includeDrafts` and `includeHidden` ask for, so the
        badge doesn't jump when a toggle flips. Pull requests are
        split by `kind`
        (release pull requests under `releases`, Dependabot and Renovate
        under `bots`, the rest under `pullRequests`). Always present, with
        zeros when there is nothing. A client hides a page's whole nav item at
        zero total, and a state's number at zero. Every page except Issues also
        carries `running` and `passed`. The Branches badge isn't here: a
        client counts the rows of `mainBranchPage`.
      required: [pullRequests, issues, releases, bots]
      properties:
        pullRequests:
          $ref: "#/components/schemas/NavPullRequestCount"
        issues:
          $ref: "#/components/schemas/NavIssueCount"
        releases:
          $ref: "#/components/schemas/NavPullRequestCount"
        bots:
          $ref: "#/components/schemas/NavPullRequestCount"

    Dashboard:
      type: object
      required:
        [
          generatedAt,
          forges,
          pullRequests,
          issues,
          openIssueCount,
          firstRefreshDone,
          navCounts,
          mainBranchPage,
          repos,
          hiddenDrafts,
          autoMerged,
          queuedActions,
          readIntervalSeconds,
        ]
      properties:
        queuedActions:
          type: array
          items:
            $ref: "#/components/schemas/QueuedAction"
          description: |
            The signed-in user's queued actions, waiting and finished in the
            last 24 hours (GET /api/queued-actions), so a client lists them in
            its Activity panel and learns an outcome from the stream it
            already reads. Always present, empty when there are none.
        autoMerged:
          type: array
          items:
            $ref: "#/components/schemas/AutoMergedPullRequest"
          description: |
            Pull requests this app auto-merged in the last ten minutes, newest
            first. They have already left `pullRequests`, so this is how a
            client shows "Auto-merged owner/repo#N after checks passed". Always
            present, empty when there are none. A client shows each one once,
            matched on `forge`, `fullName`, `number` and `mergedAt`.
        openIssueCount:
          type: integer
          description: |
            How many of `issues` are real work: all of them except the
            `housekeeping` ones. What the Issues badge shows.
        settingsHiddenIssueCount:
          type: integer
          minimum: 0
          description: |
            How many open issues the user's own settings (`hideDependencyDashboard`
            and `ignoredTitles`) left out of `issues`, so a client can say
            "N hidden by your settings" and link to Settings; it cannot work
            that out, the issues are not sent. Always present once the
            server applies the settings; 0 when none are hidden.
        firstRefreshDone:
          type: boolean
          description: |
            False from process start until this viewer's first refresh has
            finished, whether it succeeded or failed; true from then on,
            including after later refreshes. Per viewer: another user's
            refresh does not flip it. A client shows a loading state instead
            of empty lists while it is false; a failed first refresh is
            reported through forge health, not by keeping this false. It is
            also true when the server started from the snapshot saved by its
            last run: those rows are on the page, and their forge reports
            `reachable: false` with `staleSince` until the first refresh
            succeeds. The same
            on `GET /api/dashboard`, the stream and the MCP `get_dashboard`
            output. Always present. A client of an older server that
            lacks it should treat a missing flag as true (loaded).
        navCounts:
          $ref: "#/components/schemas/NavCounts"
        mainBranchPage:
          $ref: "#/components/schemas/MainBranches"
          description: |
            What `GET /api/main-branches` answers, from the same snapshot and
            with the same ignore list, so the Main branches page redraws from
            the message every other page reads. It reads the endpoint itself only
            while the stream is down or just back.
            Always present.
        generatedAt:
          type: string
          format: date-time
          description: When this snapshot was refreshed, not when it was requested.
        readIntervalSeconds:
          type: integer
          minimum: 1
          description: |
            How often, in seconds, a client should re-read GET
            /api/dashboard. The server's advice, so a client needs no
            interval of its own. The read is cheap and never calls a
            forge; this is not the backend's refresh schedule. It is
            shorter (2) until the viewer's first refresh has finished, so a
            page that is still loading picks the data up soon after it is
            ready, and the normal 30 from then on.
        hiddenDrafts:
          type: integer
          minimum: 0
          description: |
            How many draft pull requests `pullRequests` leaves out. Always
            present, and `0` when the request set `includeDrafts=true`, so
            a client can render "N hidden" without a special case. Drafts
            in a repo the account ignores aren't counted, since none of
            that repo's pull requests show.
        hiddenPullRequests:
          type: integer
          minimum: 0
          description: |
            How many pull requests the user hid that are still open and not
            expired. Always present, so a client can render "Hidden (N)"
            without a special case. With `includeHidden=true` they are in
            `pullRequests`, marked `hidden`, and this still counts them.
        forges:
          type: array
          items:
            $ref: "#/components/schemas/ForgeHealth"
        pullRequests:
          type: array
          items:
            $ref: "#/components/schemas/PullRequest"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        repos:
          type: array
          items:
            $ref: "#/components/schemas/RepoStatus"

    MainBranchStatus:
      type: string
      enum: [failed, passed, running, cancelled, awaiting_approval, none]
      description: |
        The result of the latest pipeline on a default branch's newest
        commit, across all its workflows. "failed" when any job failed,
        "running" when none failed and some are still queued or running,
        "cancelled" when nothing failed and nothing is running but some run
        was cancelled (a newer push or a person stopped it, so nothing broke),
        "awaiting_approval" when GitHub holds the commit's workflow runs until
        a maintainer approves them (they create no check runs, so nothing
        runs), "passed" when all finished green, "none" when the commit has
        no pipeline at all (or the repository has no commit yet).

    MainBranchCommit:
      type: object
      required: [sha, subject, author, committedAt]
      description: The newest commit on the default branch.
      properties:
        sha:
          type: string
          description: The commit id, shortened to seven characters.
        subject:
          type: string
          description: The first line of the commit message.
        author:
          type: string
          description: |
            The commit author's login where the forge knows it, else the name
            on the commit. Empty when the forge didn't say.
        committedAt:
          type: [string, "null"]
          format: date-time
          description: When the commit was made, or null when the forge didn't say.

    MainBranch:
      type: object
      required:
        [
          forge,
          fullName,
          url,
          branch,
          status,
          commit,
          failingJobs,
          finishedAt,
          durationSeconds,
          runUrl,
          checks,
          latestRelease,
          staleSince,
        ]
      description: One tracked repository and the CI status of its default branch.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          description: '"owner/repo", matching a Repo.fullName from GET /api/dashboard.'
        url:
          type: string
          description: The repository's own page on its forge.
        branch:
          type: string
          description: The repository's default branch. Empty for a repository the forge reports no default branch for.
        status:
          $ref: "#/components/schemas/MainBranchStatus"
        commit:
          description: The newest commit, or null when the forge reported none (an empty repository, or no run on Forgejo to name one from).
          oneOf:
            - $ref: "#/components/schemas/MainBranchCommit"
            - type: "null"
        failingJobs:
          type: array
          items:
            type: string
          description: |
            The names of the failed jobs (GitHub checks, Forgejo Actions
            jobs), or of the failed workflow when its jobs couldn't be read.
            Always present and empty unless `status` is "failed".
        finishedAt:
          type: [string, "null"]
          format: date-time
          description: When the pipeline's last job finished. Null while it runs, or when the forge didn't say.
        durationSeconds:
          type: [integer, "null"]
          minimum: 0
          description: |
            How long the pipeline ran, from its first job starting to its last
            finishing. Null while it runs, or when the forge didn't say.
        runUrl:
          type: string
          description: |
            Where to see the run on the forge: the failed job's page for a
            failed pipeline, else the run's, else the commit's. Falls back to
            the repository's `url`.
        checks:
          $ref: "#/components/schemas/CheckCounts"
        latestRelease:
          description: |
            The repository's latest published release, for a link to its
            notes. Null when the repository has none, when its only releases
            are drafts or pre-releases, and for every Forgejo repository,
            whose latest release is a separate read per repository that the
            refresh does not make.
          oneOf:
            - $ref: "#/components/schemas/MainBranchRelease"
            - type: "null"
        staleSince:
          type: [string, "null"]
          format: date-time
          description: |
            Set when this row is the last known one because its forge couldn't
            be read or its rate limit is spent: the time it was last fetched.
            Null otherwise. A client offers no write on a stale row.
        advisories:
          $ref: "#/components/schemas/Advisories"

    Advisories:
      type: object
      required: [state, count]
      description: |
        The open dependency advisories on a repository's default branch, read
        from GitHub's Dependabot alerts, or for a Forgejo repository from the
        packages in its lockfiles matched against OSV, when the operator has
        switched that on. Absent from the row when no source reads them for its
        forge. A source that can't
        answer, such as alerts switched off or a token without the
        `security_events` scope, gives `state` "unknown", never a count of
        zero.
      properties:
        state:
          $ref: "#/components/schemas/AdvisoryState"
        count:
          type: integer
          minimum: 0
          description: How many advisories are open. Only meaningful when `state` is "known".
        highest:
          $ref: "#/components/schemas/AdvisorySeverity"
        url:
          type: string
          description: Where to see the advisories on the forge. Absent when there are none or the state is unknown, and for Forgejo, which has no page for them.
        reason:
          $ref: "#/components/schemas/AdvisoryReason"
        partial:
          type: boolean
          description: |
            Only on a Forgejo repository whose `state` is "known": its lock
            files list packages the dashboard leaves out because they are not
            public (a private registry, a git or path source, a module on the
            forge's own host), so `count` covers only the rest. Read it as
            "at least this many", and a count of zero as "none found among
            what was checked", not "none". Absent when the answer covers every
            package the lock files list.

    AdvisoryState:
      type: string
      enum: [known, unknown]
      description: |
        "known" is an answer the forge gave. "unknown" is no answer, and must
        never be shown as zero.

    AdvisoryReason:
      type: string
      enum: [refused, switched_off, throttled, failed, too_many, not_enabled]
      description: |
        Why `state` is "unknown", when the dashboard can tell. Absent when
        the state is "known". "refused" is a 403: the credential lacks the
        Dependabot alerts permission. "switched_off" is a 404: alerts are off
        for the repository. "throttled" is a rate limit, which clears by
        itself. "failed" is any other error reading the alerts. "too_many" is
        a repository with more open alerts than one read pages through. On a
        Forgejo repository, "not_enabled" is the operator not having switched
        on lockfile checking (it is off by default, since it sends package
        names to a third party), absent when it has no lockfile the dashboard
        reads, and "failed" when one is too big or doesn't parse. A Forgejo
        repository whose advisories have not been read yet, because its first
        read is still running in the background, is "unknown" with no reason.

    AdvisorySeverity:
      type: string
      enum: [low, medium, high, critical]
      description: The worst severity among the open advisories. Absent when there are none.

    AdvisoryList:
      type: object
      required: [state, advisories]
      description: A repository's open dependency advisories in full.
      properties:
        state:
          $ref: "#/components/schemas/AdvisoryState"
        reason:
          $ref: "#/components/schemas/AdvisoryReason"
        partial:
          type: boolean
          description: Set on a known Forgejo list that leaves out packages the dashboard may not send to OSV, because they may be private. Absent otherwise.
        url:
          type: string
          description: The repository's advisories page on the forge. Absent when none are open or the state is unknown, and for Forgejo, which has no page for a whole repository.
        advisories:
          type: array
          items:
            $ref: "#/components/schemas/AdvisoryItem"
          description: Empty when none are open and whenever `state` is "unknown". Highest severity first, then newest first.

    AdvisoryItem:
      type: object
      required: [number, state, summary]
      description: One open Dependabot alert with the fields GitHub's alert page shows.
      properties:
        number:
          type: integer
          description: The alert's number on the forge. For Forgejo, the advisory's place in the list.
        state:
          type: string
          description: The alert's state on the forge. Always "open" here.
        severity:
          $ref: "#/components/schemas/AdvisorySeverity"
        summary:
          type: string
          description: The advisory's one-line title.
        id:
          type: string
          description: The advisory's own id in the database that states it. Set for Forgejo.
        ghsaId:
          type: string
        cveId:
          type: string
        package:
          type: string
          description: The vulnerable dependency's name.
        ecosystem:
          type: string
          description: The package ecosystem, such as "npm" or "pip".
        scope:
          type: string
          description: Whether the dependency is needed at runtime or only in development.
        relationship:
          type: string
          description: Whether the dependency is direct or transitive. Absent when GitHub didn't say.
        manifestPath:
          type: string
          description: The file the dependency was detected in.
        openedAt:
          type: string
          format: date-time
        vulnerableVersions:
          type: string
          description: The affected version range, as GitHub writes it.
        patchedVersion:
          type: string
          description: The first version with the fix. Absent when there is none yet.
        cvss:
          $ref: "#/components/schemas/AdvisoryCVSS"
        weaknesses:
          type: array
          items:
            $ref: "#/components/schemas/AdvisoryWeakness"
        description:
          type: string
          description: The advisory's text, Markdown exactly as GitHub stores it. Render it with raw HTML disabled.
        references:
          type: array
          items:
            type: string
          description: Links the advisory cites. A client shows only http(s) ones.
        epss:
          $ref: "#/components/schemas/AdvisoryEPSS"
        url:
          type: string
          description: The alert's own page on the forge.

    AdvisoryCVSS:
      type: object
      required: [score]
      properties:
        score:
          type: number
          description: The CVSS base score, 0 to 10.
        vector:
          type: string
          description: The CVSS vector string.

    AdvisoryWeakness:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: The CWE id, such as "CWE-295".
        name:
          type: string

    AdvisoryEPSS:
      type: object
      required: [percentage, percentile]
      description: The Exploit Prediction Scoring System's reading, as GitHub sends it. Absent when GitHub sent none.
      properties:
        percentage:
          type: number
          description: The probability of exploitation in the next 30 days, as a fraction from 0 to 1.
        percentile:
          type: number
          description: How the score ranks among all scored flaws, as a fraction from 0 to 1.

    MainBranchRelease:
      type: object
      required: [tag, url]
      description: A repository's latest published release.
      properties:
        tag:
          type: string
          description: The release's tag, such as "v1.2.3".
        url:
          type: string
          description: The release's own page on its forge.

    MainBranches:
      type: object
      description: |
        Every default branch the page lists, in no particular order. There is
        no tally: a client counts the rows it holds, so the filter pills and
        the navigation badge always agree with the list.
      required: [generatedAt, forges, branches]
      properties:
        generatedAt:
          type: string
          format: date-time
          description: When the snapshot was refreshed, not when it was requested.
        forges:
          type: array
          description: >-
            Each forge's health as of the last refresh, the same as the
            dashboard's. A client uses it to hold back an action that a forge
            which can't be reached, or whose rate limit is spent, would
            probably refuse. The budget can run out between refreshes, so the
            forge still has the final say.
          items:
            $ref: "#/components/schemas/ForgeHealth"
        branches:
          type: array
          items:
            $ref: "#/components/schemas/MainBranch"

    RepoStatus:
      type: object
      required:
        [
          forge,
          fullName,
          url,
          hasWebhook,
          canManageWebhooks,
          ignored,
          ignoredPRs,
          ignoredIssues,
          autoUpdateBranch,
          rebaseBots,
        ]
      description: |
        One tracked repository, whether or not it currently has anything
        open — repoCount alone can't name it, and it wouldn't otherwise
        appear anywhere pullRequests/issues don't already mention it.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          examples: [alrayyes/forge-dashboard]
        url:
          type: string
          format: uri
          description: The repo's own page on its forge, for linking out.
          examples: ["https://github.com/alrayyes/forge-dashboard"]
        logoUrl:
          type: string
          format: uri
          description: |
            The repository's own logo, only when it has one: a GitHub
            repository's custom social preview image, or a Forgejo
            repository's own avatar. Absent otherwise, and never the
            generated social card GitHub shows for a repository with none,
            nor the owner's avatar. Always an https URL, passed through
            unchanged and never proxied: on GitHub exactly
            repository-images.githubusercontent.com, on Forgejo the
            instance's own host. A GitHub custom image is a wide banner,
            not a square logo.
            Absent for a repository reached through an unauthenticated,
            username-only listing, since that listing carries no image.
          examples: ["https://repository-images.githubusercontent.com/123/abc"]
        ignored:
          type: boolean
          description: |
            Whether the signed-in user has ignored this repo in either
            scope below — true whenever ignoredPRs or
            ignoredIssues is true. The repo itself still appears here
            with accurate hasWebhook/canManageWebhooks regardless.
        ignoredPRs:
          type: boolean
          description: |
            Whether the signed-in user has ignored this repo's pull
            requests specifically — its pullRequests entries are
            excluded from this same response and from Insights.
        ignoredIssues:
          type: boolean
          description: |
            Whether the signed-in user has ignored this repo's issues
            specifically — its issues entries are excluded from
            this same response and from Insights.
        hasWebhook:
          type: boolean
          description: |
            Whether this app has ever recorded a signature-verified
            webhook delivery for this repo. Passive: it reflects a real
            delivery having arrived, not whether a webhook object exists
            on the forge — a correctly configured webhook that just
            hasn't fired yet still reads false here, the same as a
            misconfigured one would.
        canManageWebhooks:
          type: boolean
          description: |
            Whether the signed-in user's own permission on this repo is
            enough to list/create its webhooks — GitHub requires admin
            specifically (write/maintain can push but still 404 on the
            hooks endpoint, by GitHub's own design); Forgejo's equivalent
            is its own admin permission flag. Always false for a repo
            reached through an unauthenticated, username-only listing.
            A point-in-time snapshot: a permission change since the last
            refresh can still make a following ensure-webhook call fail
            despite this having said true. For a GitHub App connection
            there is no user role to read, so this is true when listing
            the repo's webhooks worked on the last refresh.
        webhookLockedByConnection:
          type: boolean
          description: |
            Present and true when canManageWebhooks is false because the
            connection itself can't manage webhooks on this repo (GitHub
            refused the hooks listing: a GitHub App without the Webhooks
            permission, or a repo outside its installation; Forgejo sent no
            permissions object for the repo), rather than the signed-in
            user's role. A failed or rate-limited listing doesn't
            set it. Absent otherwise.
        webhookNeedsToken:
          type: boolean
          description: |
            Present and true when canManageWebhooks is false because no
            token is saved for the forge. The repos then came from a
            username-only listing, which the forge answers as an anonymous
            caller, so the permissions it reports say nothing about the
            signed-in user's role. Saving a token with the webhook scope in
            Settings is the fix. Absent when a token is saved, whatever
            role it holds. Set today for Forgejo only.
        failingSince:
          type: string
          format: date-time
          description: |
            Present when the last fetch of this repository failed, and the
            time of the first failure in the run it is still part of. Its
            pull requests and issues are then the last good ones. Absent
            when the repository is fetching fine. It is not saved, so it
            restarts from the first failure after a restart.
        failingForGood:
          type: boolean
          description: |
            Present and true when failingSince is older than the cutoff the
            refresh schedule uses for a repository that keeps failing, a
            fixed multiple of the refresh interval. Retrying has not helped
            by then. The server works this out when it builds the response,
            so a client shows it without doing the arithmetic, and a
            repository crosses the cutoff in what the client sees at the
            next refresh. Absent otherwise.
        rebaseBots:
          type: boolean
          description: |
            Whether the signed-in user has turned on rebasing bot pull
            requests for this repo. A behind Dependabot or Renovate pull
            request gets the bot's own rebase, whatever the repo's
            automatic branch update setting says. Human, draft and
            release-please pull requests are not covered.
        autoUpdateBranch:
          type: boolean
          description: |
            Whether the signed-in user has turned on automatic branch
            updates for this repo — any of its pull requests the
            background refresh finds behind its base branch gets updated
            the same way a manual "Update branch" click would. A
            Dependabot pull request gets its own rebase comment instead,
            and a Renovate one its own rebase label, mirroring their
            manual action buttons. A release-please pull request is
            always skipped by this background pass, so no unattended write
            lands on a release branch. The dashboard's manual "Update
            branch" button is still offered on it, since release-please
            has no rebase action of its own.

# The contract, and the only machine-readable description of it. Hand-written
# and committed rather than generated from handler annotations — the spec is
# reviewed as the design, and internal/api is written against it, not the
# other way round.
openapi: 3.1.0

info:
  title: forge-dashboard
  summary: A single-page view of open PRs, issues and CI status across GitHub and Forgejo.
  description: |
    Aggregates every repository the configured GitHub and Forgejo accounts
    have write access to into one read-only view: open pull requests (with
    CI status), open issues, and per-forge reachability. The backend holds
    both forges' credentials; the frontend only ever calls the endpoints
    below.
  version: 1.0.0
  contact:
    name: forge-dashboard
    url: https://github.com/alrayyes/forge-dashboard
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only

servers:
  - url: "{scheme}://{host}"
    description: |
      No canonical host — this runs on a homelab reachable only over
      Tailscale, so the variables below are the shape of the answer rather
      than the answer.
    variables:
      scheme:
        default: https
        enum: [https, http]
      host:
        default: localhost:8080
        description: The default listen address. Set ADDR to change it.

security: []

tags:
  - name: health
    description: Liveness, for whatever supervises the process.
  - name: dashboard
    description: The aggregated view across both forges.
  - name: auth
    description: |
      Passkey (WebAuthn) registration, login and session management.

      Every endpoint elsewhere in this API described as requiring "a
      valid session" accepts either of two credentials, checked in that
      order: the session cookie a passkey login sets, or an
      `Authorization: Bearer <token>` header carrying a personal API
      token from this tag's own token endpoints (see `bearerAuth` in
      `components.securitySchemes`) — a script can use the same API a
      signed-in browser does, with no WebAuthn ceremony of its own to
      perform. Their 401 response is identical either way: "no valid
      session cookie was presented" in an individual endpoint's own
      description below means neither credential was.
  - name: settings
    description: The signed-in user's own GitHub/Forgejo credentials.
  - name: admin
    description: Managing the user base itself. Every endpoint here requires the signed-in user to be the designated admin.
  - name: sharing
    description: Granting other registered users read-only access to the signed-in user's own dashboard.
  - name: webhooks
    description: |
      Where GitHub/Forgejo push repository events, for an immediate refresh
      instead of waiting on the next poll, and the one endpoint that
      creates or updates a webhook on the user's behalf. The two delivery
      endpoints aren't session-authenticated like everything else here —
      the path's token identifies the user, and the request's HMAC
      signature (computed with that user's webhook secret) is what proves
      it actually came from their forge; `POST /api/webhooks/ensure` is a
      normal session-authenticated endpoint like the rest of this API.
  - name: pull-requests
    description: |
      Actions against a pull request already listed on the dashboard,
      taken on the signed-in user's own behalf.
  - name: tokens
    description: |
      Personal API tokens — a Bearer credential a script can use instead
      of a browser's passkey session cookie. See the `auth` tag's own
      description for how a token authenticates once generated here.

paths:
  /api/auth/registration-status:
    get:
      operationId: getRegistrationStatus
      summary: Whether self-registration is open
      description: |
        Unauthenticated — a visitor deciding whether to show the login
        page's own "Register a new passkey instead" button has no session
        yet by definition. `open` is true only on a fresh instance with
        zero registered users; once any account exists, self-registration
        is closed and every registration after that requires a valid
        `inviteToken` (see POST /api/auth/register/begin).
      tags: [auth]
      responses:
        "200":
          description: The current registration status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStatus"

  /api/auth/register/begin:
    post:
      operationId: beginRegistration
      summary: Start a passkey registration ceremony
      description: |
        The very first registration on a fresh instance (zero registered
        users — see GET /api/auth/registration-status) needs no
        `inviteToken` and bootstraps that account as admin. Every
        registration after that requires a valid, unexpired, unconsumed
        `inviteToken` issued by an admin (POST /api/admin/invites) for
        exactly this `username` — the invite's own `displayName` is what's
        actually used, not this request's.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBeginRequest"
      responses:
        "200":
          description: |
            WebAuthn credential creation options, passed straight to the
            browser's `navigator.credentials.create()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCeremonyOptions"
        "403":
          description: |
            Self-registration is closed (an account already exists) and
            no valid, unexpired, unconsumed invite for this username was
            presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: That username is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/register/finish:
    post:
      operationId: finishRegistration
      summary: Complete a passkey registration ceremony
      tags: [auth]
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: |
          The raw response from `navigator.credentials.create()`, exactly as
          the browser produced it — forwarded to the server untouched.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCeremonyOptions"
      responses:
        "200":
          description: Registration succeeded; a session cookie is now set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          description: The ceremony failed verification, or had already expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login/begin:
    post:
      operationId: beginLogin
      summary: Start a passkey login ceremony
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBeginRequest"
      responses:
        "200":
          description: |
            WebAuthn credential request options, passed straight to the
            browser's `navigator.credentials.get()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCeremonyOptions"
        "404":
          description: No account is registered under that username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login/finish:
    post:
      operationId: finishLogin
      summary: Complete a passkey login ceremony
      tags: [auth]
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: |
          The raw response from `navigator.credentials.get()`, exactly as
          the browser produced it — forwarded to the server untouched.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCeremonyOptions"
      responses:
        "200":
          description: Login succeeded; a session cookie is now set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          description: The ceremony failed verification, or had already expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      responses:
        "204":
          description: Logged out; the session cookie is now cleared.

  /api/auth/session:
    get:
      operationId: getSession
      summary: Who, if anyone, the current session cookie belongs to
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The current session's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/credentials:
    get:
      operationId: listCredentials
      summary: List the signed-in user's own passkeys
      description: |
        Every passkey on the account, oldest first — not just the
        one used to establish the current session.
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Every registered passkey.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credential"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/credentials/begin:
    post:
      operationId: beginAddCredential
      summary: Start a ceremony to add another passkey to the signed-in account
      description: |
        The authenticated counterpart to POST /api/auth/register/begin —
        that one only ever works for a brand-new, credential-less
        account; this is how an already-registered user adds a second
        (or third...) passkey, e.g. a laptop and a security key.
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: |
            WebAuthn credential creation options, passed straight to the
            browser's `navigator.credentials.create()`. `excludeCredentials`
            already lists every passkey the account has, so re-registering
            the same authenticator is refused by the browser itself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCeremonyOptions"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/credentials/finish:
    post:
      operationId: finishAddCredential
      summary: Complete an add-credential ceremony
      tags: [auth]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: label
          in: query
          required: true
          description: |
            A name the user recognizes, e.g. "MacBook" or "YubiKey",
            prompted for at registration time, never derived
            from the authenticator itself.
          schema:
            type: string
      requestBody:
        required: true
        description: |
          The raw response from `navigator.credentials.create()`, exactly as
          the browser produced it — forwarded to the server untouched.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCeremonyOptions"
      responses:
        "201":
          description: The new passkey is now registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          description: label was blank, or the ceremony failed verification, or had already expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/credentials/{id}:
    delete:
      operationId: deleteCredential
      summary: Remove one of the signed-in user's own passkeys
      description: |
        Refused on the account's last remaining passkey — this
        app is WebAuthn-only with no password fallback, so deleting it
        would lock the account out entirely.
      tags: [auth]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed.
        "400":
          description: This is the account's last remaining passkey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/settings:
    get:
      operationId: getSettings
      summary: The signed-in user's own forge configuration
      description: |
        Tokens are never returned, before or after being saved — only
        whether one is currently on file. There is no way to read a saved
        token back out through this API.
      tags: [settings]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: putSettings
      summary: Save the signed-in user's forge configuration
      description: |
        Replaces every field except a blank token, which means "keep
        whatever's already saved" rather than "clear it" — the only
        sensible behavior for a field the browser is never shown the
        current value of. Saving triggers that user's dashboard to start
        refreshing from the new configuration.
      tags: [settings]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "400":
          description: |
            The request body wasn't valid JSON, or a Forgejo token/username
            was set with no Forgejo URL — a combination the dashboard can't
            use, since the URL is what a token or username connects to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/settings/theme:
    get:
      operationId: getTheme
      summary: The signed-in user's own saved theme preference
      description: |
        A lightweight, side-effect-free read of one field — theme — for
        every page to check on load. Deliberately not
        GET /api/settings itself: that handler also provisions webhook
        credentials on first call (EnsureWebhookCredentials), which
        every page loading shouldn't trigger for a user who's never
        opened Settings at all.
      tags: [settings]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The current value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeResponse"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: setTheme
      summary: Save the signed-in user's own theme preference
      description: |
        A dedicated, instant save — deliberately not routed
        through the main PUT /api/settings, whose every other field is
        a plain replace rather than a per-field merge: a request
        carrying only theme through that handler would blank every
        other saved setting. Picking a theme applies immediately, the
        same "set once and forget" convention the ticket's own research
        cites, rather than waiting on the rest of the settings form's
        own Save button.
      tags: [settings]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeRequest"
      responses:
        "200":
          description: The saved value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeResponse"
        "400":
          description: theme wasn't "", "light", or "dark".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/settings/filter-state:
    get:
      operationId: getFilterState
      summary: The signed-in user's own saved dashboard/Insights filter state
      description: |
        A lightweight read of one opaque blob, deliberately not
        GET /api/settings itself for the same reason GET /api/settings/theme
        isn't either: this loads on every dashboard/Insights visit and
        shouldn't provision webhook credentials as a side effect.
        `{}` for a user who's never saved any filters yet, not a 404.
      tags: [settings]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The saved state, or `{}` if none has ever been saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterState"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: setFilterState
      summary: Save the signed-in user's own dashboard/Insights filter state
      description: |
        A dedicated, lightweight save separate from the main
        PUT /api/settings — filters change on nearly every click, a
        mismatch for that endpoint's "always a full form submit"
        convention. The body replaces the saved state entirely,
        the same "always a full submit, just of a much smaller and
        much more frequent thing" shape as the main settings PUT, not a
        partial patch. Filters.js's own client-side code decides when
        to call this: immediately for a discrete control, debounced
        while the user is still typing in the free-text Title filter.
      tags: [settings]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilterState"
      responses:
        "204":
          description: Saved.
        "400":
          description: The request body wasn't valid JSON, or exceeded the size this endpoint accepts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tokens:
    get:
      operationId: listAPITokens
      summary: List the signed-in user's own personal API tokens
      description: Metadata only, per APIToken's own description — a raw value never reappears once created.
      tags: [tokens]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Every live token, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIToken"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createAPIToken
      summary: Generate a new personal API token
      tags: [tokens]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APITokenCreateRequest"
      responses:
        "201":
          description: Created — the only response that ever carries the raw token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenCreateResponse"
        "400":
          description: |
            The request body wasn't valid JSON, label was blank, or
            expiresAt wasn't in the future or was more than 366 days out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tokens/{id}:
    delete:
      operationId: deleteAPIToken
      summary: Revoke a personal API token
      description: |
        Stops the token authenticating immediately. Idempotent — deleting
        an id that's already gone (or never belonged to the signed-in
        user) still answers 204, the same as any other delete-by-id
        endpoint here (compare DELETE /api/sharing/{username}), so a
        double-click or a retried request isn't an error.
      tags: [tokens]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathTokenID"
      responses:
        "204":
          description: Revoked (or already gone).
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/webhooks/ensure:
    post:
      operationId: ensureWebhook
      summary: Create or fix up a webhook on one tracked repo, on the signed-in user's behalf
      description: |
        Creates a webhook on the named repo, pointed at the signed-in
        user's own webhook URL and secret, subscribed to the events
        docs/webhooks.md's manual steps recommend. If one already exists
        there (found the same way GET /api/dashboard's own `hasWebhook`
        does — matching by URL path, not object identity) it's brought
        back to active with the right events instead of creating a
        duplicate.

        One of a small number of endpoints in this API that write to a
        forge rather than just reading from it — see also the
        pull-requests tag.

        A refusal from the forge (403, 404, 429 and 502) answers with the
        same `ActionError` a refused pull request action does, so a client
        reads one shape: `code` is `permission` or `rate_limited` where
        the forge said so (with `resetsAt` for a rate limit), and
        `unknown` otherwise, with a plain `message` either way. No new
        code is needed: a repo the forge can't find is `unknown` with its
        own message. 400 and 401 stay a plain `Error`, since they are
        about the request, not a refusal by the forge.
      tags: [webhooks]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEnsureRequest"
      responses:
        "204":
          description: The webhook now exists and is correctly configured.
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", no credentials are saved for that forge, or
            that forge's client doesn't support managing webhooks at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover managing webhooks, or it isn't an admin on that repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "404":
          description: The forge reported the repo itself doesn't exist (or isn't visible to this token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "429":
          description: The forge rate-limited the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"

  /api/repos/ignore:
    post:
      operationId: ignoreRepo
      summary: Hide one tracked repo's pull requests, issues, or both from the dashboard and Insights
      description: |
        Reversible, not destructive: the repo itself keeps
        appearing in GET /api/dashboard's `repos` array with accurate
        webhook-coverage status, and keeps being fetched and counted —
        only the pullRequests and/or issues entries the request scopes
        stop appearing there and on Insights. A repeat call
        replaces the previously saved scope rather than merging with it
        (ignoring PRs only, then issues only, ends with only issues
        ignored) — idempotent for an identical repeat, not additive
        across different scopes.
      tags: [dashboard]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoIgnoreRequest"
      responses:
        "204":
          description: The repo is now ignored in the requested scope (or already was).
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", or both `prs` and `issues` were false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/repos/unignore:
    post:
      operationId: unignoreRepo
      summary: Stop ignoring one tracked repo
      description: |
        The reverse of POST /api/repos/ignore. Idempotent: un-ignoring a
        repo that was never ignored is a no-op, not an error.
      tags: [dashboard]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEnsureRequest"
      responses:
        "204":
          description: The repo is no longer ignored (or never was).
        "400":
          description: The request body wasn't valid JSON, or `fullName` wasn't "owner/repo".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/repos/auto-update-branch/enable:
    post:
      operationId: enableAutoUpdateBranch
      summary: Turn on automatic branch updates for one tracked repo
      description: |
        Any of this repo's pull requests the background refresh finds
        behind its base branch gets updated automatically from then on, the same as clicking
        "Update branch" would, except that a Dependabot pull request gets
        its rebase comment and a Renovate one its rebase label instead, and
        a release-please pull request is skipped. Idempotent: enabling an already-enabled repo
        is a no-op, not an error.
      tags: [dashboard]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEnsureRequest"
      responses:
        "204":
          description: Auto-update-branch is now on for this repo (or already was).
        "400":
          description: The request body wasn't valid JSON, or `fullName` wasn't "owner/repo".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/repos/auto-update-branch/disable:
    post:
      operationId: disableAutoUpdateBranch
      summary: Turn off automatic branch updates for one tracked repo
      description: |
        The reverse of POST /api/repos/auto-update-branch/enable.
        Idempotent: disabling a repo that was never enabled is a no-op,
        not an error.
      tags: [dashboard]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEnsureRequest"
      responses:
        "204":
          description: Auto-update-branch is now off for this repo (or never was on).
        "400":
          description: The request body wasn't valid JSON, or `fullName` wasn't "owner/repo".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/pull-requests/merge:
    post:
      operationId: mergePullRequest
      summary: Merge one pull request, on the signed-in user's behalf
      description: |
        Merges the named pull request using its repo's own configured
        default merge method — GitHub is asked to pick its own repo
        default; Forgejo's API has no such default built in, so this
        looks up the repo's configured default merge style first and
        passes that explicitly. Neither takes a method override here;
        picking one is out of scope for this endpoint.

        When the forge refuses the merge, the server re-reads the pull
        request's real current state and answers an `ActionError`: a `code`
        from a fixed set plus a short `message` safe to show a person, so
        every client gets the same reason without parsing forge text. A
        pull request that is already merged or closed answers
        `already_merged` / `already_closed`. If the re-read itself fails,
        the original forge error is returned with `code: unknown`.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestActionRequest"
      responses:
        "204":
          description: Merged.
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", no credentials are saved for that forge, or
            that forge's client doesn't support merging pull requests at
            all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover merging, or it isn't allowed to merge on that repo. `code` is `permission`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "404":
          description: The forge reported the repo or pull request doesn't exist (or isn't visible to this token). `code` is `unknown`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "409":
          description: |
            The forge refused the merge and the pull request's current
            state says why. `code` is one of `already_merged`,
            `already_closed`, `not_mergeable`, `conflict`, `behind`,
            `checks_pending`, `checks_failing` or `blocked_by_protection`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "429":
          description: The forge rate-limited the request. `code` is `rate_limited`; `resetsAt` carries when the budget comes back, when the forge said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify, or the follow-up re-read failed. `code` is `unknown`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"

  /api/pull-requests/auto-merge:
    post:
      operationId: enablePullRequestAutoMerge
      summary: Arm a pull request's own native auto-merge, on the signed-in user's behalf
      description: |
        GitHub only, today. Enables the named pull request's own
        auto-merge via GitHub's `enablePullRequestAutoMerge` GraphQL
        mutation — REST has no equivalent endpoint. Unlike Merge, that
        mutation asks for an explicit merge method rather than picking
        the repo's own default itself, so this looks the repo's allowed
        methods up first and picks one with the same merge > squash >
        rebase precedence Merge already uses; no override is exposed
        here either. The pull request stays open and unmerged until the
        forge's own required checks pass on their own.

        When the forge refuses, the server re-reads the pull request and
        answers an `ActionError` (see Merge): `already_merged` or
        `already_closed` when the row was stale, otherwise a `code` and a
        plain-words `message` safe to show a person.
        `auto_merge_not_allowed` means the repo doesn't allow auto-merge
        (or not for this pull request); `ready_to_merge` means it is
        already clean, so there is nothing to wait for and Merge is the
        action; `checks_pending` means a non-required check is still
        running, so trying again later can work.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestActionRequest"
      responses:
        "204":
          description: Auto-merge armed.
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", no credentials are saved for that forge, or
            that forge's client doesn't support enabling auto-merge on
            pull requests at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover this, or the repo doesn't allow auto-merge to be armed at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "404":
          description: The forge reported the repo or pull request doesn't exist (or isn't visible to this token). `code` is `unknown`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "429":
          description: The forge rate-limited the request. `code` is `rate_limited`; `resetsAt` carries when the budget comes back, when the forge said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically — including the repo rejecting auto-merge for a reason this app has no more specific status for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"

  /api/pull-requests/close:
    post:
      operationId: closePullRequest
      summary: Close one pull request without merging it, on the signed-in user's behalf
      description: |
        Closes the named pull request — for one that turns out not to
        need merging at all (a duplicate, or one whose content already
        landed another way), not a substitute for Merge.

        When the forge refuses, the server re-reads the pull request and
        answers an `ActionError` (see Merge): `already_merged` or
        `already_closed` when the row was stale, otherwise a `code` and a
        plain-words `message` safe to show a person.
        Closing a merged pull request is `already_merged`.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestActionRequest"
      responses:
        "204":
          description: Closed.
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", no credentials are saved for that forge, or
            that forge's client doesn't support closing pull requests at
            all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover closing, or it isn't allowed to close on that repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "404":
          description: The forge reported the repo or pull request doesn't exist (or isn't visible to this token). `code` is `unknown`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "429":
          description: The forge rate-limited the request. `code` is `rate_limited`; `resetsAt` carries when the budget comes back, when the forge said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"

  /api/pull-requests/update-branch:
    post:
      operationId: updatePullRequestBranch
      summary: Bring one pull request's branch up to date with its base, on the signed-in user's behalf
      description: |
        Merges the named pull request's base branch into its own head
        branch. GitHub can schedule this as a background job rather than
        finishing it inline — a 202 here means exactly that, not a
        failure; a follow-up refresh a moment later reflects the result.
        Forgejo's equivalent is always synchronous, so it only ever
        answers 204.

        When the forge refuses, the server re-reads the pull request and
        answers an `ActionError` (see Merge): `already_merged` or
        `already_closed` when the row was stale, otherwise a `code` and a
        plain-words `message` safe to show a person.
        `conflict` means the branches can't be merged cleanly;
        `already_up_to_date` means there was nothing to bring in.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestActionRequest"
      responses:
        "204":
          description: Updated.
        "202":
          description: The forge scheduled the update as a background job rather than finishing it inline. Not a failure — a follow-up refresh reflects the result once it lands.
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", no credentials are saved for that forge, or
            that forge's client doesn't support updating pull request
            branches at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover updating the branch, or it isn't allowed to push on that repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "404":
          description: The forge reported the repo or pull request doesn't exist (or isn't visible to this token). `code` is `unknown`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "409":
          description: The forge rejected the update because the branches can't be merged cleanly — a real conflict updating would need to resolve by hand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "429":
          description: The forge rate-limited the request. `code` is `rate_limited`; `resetsAt` carries when the budget comes back, when the forge said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"

  /api/pull-requests/dependabot-action:
    post:
      operationId: postPullRequestDependabotAction
      summary: Post one of Dependabot's own documented PR-comment commands on a pull request, on the signed-in user's behalf
      description: |
        Posts exactly `@dependabot rebase` or `@dependabot recreate` as a
        comment on the named pull request — Dependabot's own documented
        comment-command interface, not a generic "post any comment"
        endpoint; `action` is validated server-side to one of the two
        values below and nothing else is ever sent. GitHub only —
        Dependabot doesn't run on Forgejo.

        When the forge refuses, the server re-reads the pull request and
        answers an `ActionError` (see Merge): `already_merged` or
        `already_closed` when the row was stale, otherwise a `code` and a
        plain-words `message` safe to show a person.
        A connected App with no personal token saved is `permission`, with
        the reason in `message`; nothing is posted.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestDependabotActionRequest"
      responses:
        "204":
          description: Comment posted.
        "400":
          description: |
            The request body wasn't valid JSON, `action` wasn't "rebase"
            or "recreate", `fullName` wasn't "owner/repo", no credentials
            are saved for that forge, or that forge's client doesn't
            support commenting on pull requests at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover commenting, or it isn't allowed to comment on that repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "404":
          description: The forge reported the repo or pull request doesn't exist (or isn't visible to this token). `code` is `unknown`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "409":
          description: |
            Either the forge rejected the comment because of the pull
            request's current state, or Dependabot would refuse it:
            the connected GitHub credential is an App with no personal
            access token saved, and Dependabot ignores App accounts. The
            error text is ForgeHealth.dependabotCommandsBlocked in the
            second case. Nothing was posted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "429":
          description: The forge rate-limited the request. `code` is `rate_limited`; `resetsAt` carries when the budget comes back, when the forge said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"

  /api/pull-requests/renovate-rebase:
    post:
      operationId: postPullRequestRenovateRebase
      summary: Trigger Renovate's own rebase/retry on a pull request, on the signed-in user's behalf
      description: |
        Adds the signed-in user's own configured Renovate rebase label
        (Settings' "Renovate rebase label" field, defaulting to
        Renovate's own `rebase` if left blank) to the named pull
        request — Renovate's own documented rebase/retry trigger, which
        is a label rather than a comment command. Works on both GitHub
        and Forgejo, unlike the Dependabot actions, since Renovate runs
        on both.

        When the forge refuses, the server re-reads the pull request and
        answers an `ActionError` (see Merge): `already_merged` or
        `already_closed` when the row was stale, otherwise a `code` and a
        plain-words `message` safe to show a person.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestActionRequest"
      responses:
        "204":
          description: Label added.
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", no credentials are saved for that forge, or
            that forge's client doesn't support labeling pull requests
            at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover labeling, or it isn't allowed to label on that repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "404":
          description: The forge reported the repo or pull request doesn't exist, or (Forgejo only) the configured label doesn't exist on that repo — Forgejo's labels API takes an existing label's ID, not an arbitrary name, so it has to already be there.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "429":
          description: The forge rate-limited the request. `code` is `rate_limited`; `resetsAt` carries when the budget comes back, when the forge said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"

  /api/pull-requests/checks:
    get:
      operationId: getPullRequestChecks
      summary: List every job/check run against a pull request's head commit, on demand
      description: |
        Fetched live on every call, never as part of GET /api/dashboard's
        own snapshot — this is detail a pull request's row doesn't show
        until a caller actually asks for it, and adding it to the eager
        refresh loop would multiply that refresh's cost by every open
        pull request for data most of them are never opened for.

        Falls back to the legacy combined commit-status API's own
        per-check entries when the forge reports no Actions runs at all
        for that commit (Actions disabled, or an instance too old to
        expose them) — never an error for that case specifically, since
        it's a normal, expected shape for an older or CI-less repo.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: forge
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Forge"
        - name: fullName
          in: query
          required: true
          schema:
            type: string
          description: '"owner/repo", matching a Repo.fullName from GET /api/dashboard.'
        - name: number
          in: query
          required: true
          schema:
            type: integer
          description: Matching a PullRequest.number from GET /api/dashboard.
      responses:
        "200":
          description: Every check/job found for that commit — empty when none were.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequestChecksResponse"
        "400":
          description: '`number` wasn''t an integer, `fullName` wasn''t "owner/repo", no credentials are saved for that forge, or that forge''s client doesn''t support listing pull request checks at all.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover reading checks, or it isn't allowed to see that repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The forge reported the repo or pull request doesn't exist (or isn't visible to this token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The forge rate-limited the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/users:
    get:
      operationId: listUsers
      summary: List every registered user
      description: |
        Never includes a passkey or a forge credential — a username,
        display name, admin flag and registration timestamp per user.
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Every registered user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The signed-in user isn't the designated admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/users/{username}/revoke:
    post:
      operationId: revokeUser
      summary: Revoke a user's passkeys and sessions
      description: |
        Deletes every session and every registered passkey for this user —
        they're signed out everywhere immediately, and have to register a
        new passkey from scratch to get back in. Their saved forge
        credentials are untouched; use the delete endpoint to remove the
        account itself.
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathUsername"
      responses:
        "204":
          description: Revoked.
        "400":
          description: An admin can't revoke their own account through this endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The signed-in user isn't the designated admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user is registered under that username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/users/{username}:
    delete:
      operationId: deleteUser
      summary: Remove a user outright
      description: |
        Deletes the account, every session, every registered passkey, and
        every saved forge credential — irreversible. Their username
        becomes available for a fresh registration.
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathUsername"
      responses:
        "204":
          description: Removed.
        "400":
          description: An admin can't remove their own account through this endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The signed-in user isn't the designated admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user is registered under that username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/invites:
    post:
      operationId: createInvite
      summary: Generate a new single-use registration invite
      description: |
        The admin picks the username and display name up front — the
        invitee only completes the WebAuthn ceremony at the link this
        returns (`/login?invite=<token>`, built client-side). Valid for
        one hour, fixed.
      tags: [admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminInviteCreateRequest"
      responses:
        "201":
          description: Created — the only response that ever carries the raw token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInviteCreateResponse"
        "400":
          description: username or displayName was blank.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The signed-in user isn't the designated admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: That username is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listInvites
      summary: List outstanding registration invites
      description: |
        Every invite that's neither consumed nor expired — never the raw
        token, only its own stable id (see AdminInvite).
      tags: [admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Every outstanding invite.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminInvite"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The signed-in user isn't the designated admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/invites/{token}/revoke:
    post:
      operationId: revokeInvite
      summary: Revoke an outstanding invite
      description: |
        Stops the invite's token from ever completing a registration.
        `token` here is an invite's own `id` (from AdminInvite's own
        listing), never the raw secret an invitee would use to register —
        that's AdminInviteCreateResponse's own `token` field, and it's
        never listed again after creation.
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked.
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The signed-in user isn't the designated admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No outstanding invite with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/requests:
    get:
      operationId: listRequests
      summary: List every outbound GitHub/Forgejo request this instance has made
      description: |
        Every outbound request `internal/github` or `internal/forgejo` has
        made, newest first, across every account — an admin's own
        credential included, since correlating a shared-credential
        problem (like the rate-limit incident that motivated this
        endpoint) needs a cross-account view no single account's own
        session could give.
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/QueryRequestLogForge"
        - $ref: "#/components/parameters/QueryRequestLogAccount"
      responses:
        "200":
          description: Every request-log entry matching the filter, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequestLogEntry"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The signed-in user isn't the designated admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/requests/export:
    get:
      operationId: exportRequests
      summary: Export the (filtered) outbound-request log as CSV
      description: |
        The same rows GET /api/admin/requests would return for the same
        filter, as a downloadable CSV file with one header row.
      tags: [admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/QueryRequestLogForge"
        - $ref: "#/components/parameters/QueryRequestLogAccount"
      responses:
        "200":
          description: A CSV file, one row per matching entry plus a header row.
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The signed-in user isn't the designated admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /readyz:
    get:
      operationId: ready
      summary: Readiness
      description: |
        Answers 200 once the server can actually serve: the database answers
        a ping with its schema in place, and the first dashboard refresh has
        completed, or 30 seconds have passed since it started. The wait is
        bounded because how fast a forge answers is how fresh the data is,
        not whether the server can serve: a slow or unreachable forge must not
        keep the container unready. A refresh that finished with a forge
        unreachable counts, and a forge going unreachable afterwards never
        turns this into a 503. See forges[].reachable on the dashboard
        response for that. Before any account has signed in there is no
        refresh to wait for, so only the database is checked.

        The database ping gets 2 seconds, less than the HEALTHCHECK's own 5,
        so a database that doesn't answer turns into a 503 instead of a hung
        probe. The ping's result, pass or fail, is reused for about 3
        seconds, so probes arriving every second don't each reach the
        database. On SIGTERM this answers 503 ("shutting down") at once, and
        the server waits a drain period (`SHUTDOWN_DRAIN`, default 5 seconds)
        before it stops accepting connections, so a router that polls this
        path stops sending traffic first.

        The container's HEALTHCHECK probes this path (`/healthz` stays the
        cheap liveness answer), so Docker's single health state and Compose's
        `depends_on: condition: service_healthy` mean "ready", not just
        "started".
      tags: [health]
      responses:
        "200":
          description: The server can serve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "503":
          description: |
            Not ready yet, the database is failing or slow, or the server is
            shutting down. The body carries a short reason only: no paths, no
            driver errors, no secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: database unavailable

  /healthz:
    get:
      operationId: health
      summary: Liveness
      description: |
        Answers 200 once the server has started. Doesn't reflect whether
        either forge is reachable — see forges[].reachable on the dashboard
        response for that.
      tags: [health]
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok

  /api/version:
    get:
      operationId: getVersion
      summary: The running server's own version
      description: |
        The tag goreleaser stamped the running binary with ("dev" for a
        build outside the release pipeline). Public and unauthenticated —
        every page, including the pre-login screen, links to the matching
        GitHub release from its footer so a person can tell what's
        actually deployed without shelling into the box.
      tags: [health]
      responses:
        "200":
          description: The running version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
              example:
                version: 0.12.1

  /api/dashboard:
    get:
      operationId: getDashboard
      summary: The aggregated view
      description: |
        Returns the most recently fetched snapshot. The backend refreshes
        this on its own schedule in the background; this endpoint never
        blocks on a live call to either forge, so it answers instantly even
        when a forge is slow or unreachable.

        Omitting `owner` returns the signed-in user's own dashboard. Passing
        it returns that user's dashboard instead — allowed only when they've
        shared it with the caller (or the caller is viewing their own
        username), and refused with a 403 otherwise.

        Draft pull requests are left out unless `includeDrafts=true`. With
        `owner`, the same rule applies to that user's dashboard, and
        `hiddenDrafts` counts only the drafts in repos that user hasn't
        ignored, the same repos whose other pull requests show.
      tags: [dashboard]
      parameters:
        - name: owner
          in: query
          required: false
          schema:
            type: string
          description: A username that has shared their dashboard with the caller. Defaults to the caller's own.
        - $ref: "#/components/parameters/QueryIncludeDrafts"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The current snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: owner hasn't shared their dashboard with the signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user is registered under owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/dashboard/stream:
    get:
      operationId: streamDashboard
      summary: Server-Sent Events stream of the signed-in user's own dashboard
      description: |
        Pushes a fresh snapshot every time this user's background
        refresh produces one — most notably right after a verified
        webhook delivery (see the webhooks tag) triggers an immediate
        one, which is what turns that into a live update instead of
        something only the next scheduled refresh picks up.

        Doesn't support `owner` the way GET /api/dashboard does — only
        ever the signed-in user's own dashboard, never a shared one.
        The frontend's own 30-second poll against GET /api/dashboard
        keeps running unconditionally, connected or not — a browser or
        proxy that can't hold an SSE connection open just never
        benefits from this, rather than the dashboard going stale
        silently.

        `includeDrafts` is read once, when the connection opens, and
        applies to every event on it. A client that changes its mind
        reconnects with the new value.
      tags: [dashboard]
      parameters:
        - $ref: "#/components/parameters/QueryIncludeDrafts"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: |
            An SSE stream. Each event's `data` field is a JSON-encoded
            snapshot, identical in shape to GET /api/dashboard's
            response body.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No background refresh is running yet for this user — Settings has never been saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/dashboard/refresh:
    post:
      operationId: refreshDashboard
      summary: Trigger an immediate refresh of the signed-in user's own dashboard
      description: |
        Blocks until an immediate, out-of-band refresh of the signed-in
        user's own dashboard completes, then returns the resulting
        snapshot — for retrying right away after a forge was only
        briefly unreachable, instead of waiting for the next scheduled
        background refresh.

        Doesn't support `owner` the way GET /api/dashboard does — only
        ever the signed-in user's own dashboard, never a shared one, so
        a user with shared access to someone else's dashboard can never
        spend that owner's own forge rate-limit budget on their own
        schedule.
      tags: [dashboard]
      parameters:
        - $ref: "#/components/parameters/QueryIncludeDrafts"
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The freshly refreshed snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No background refresh is running yet for this user — Settings has never been saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/sharing:
    get:
      operationId: getSharing
      summary: The signed-in user's sharing relationships
      description: |
        Both directions at once: who the signed-in user has shared their
        own dashboard with, and whose dashboards have been shared with
        them.
      tags: [sharing]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The current sharing relationships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharingResponse"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/sharing/{username}:
    put:
      operationId: shareWith
      summary: Share the signed-in user's dashboard with username
      description: |
        Idempotent — sharing with a username already on the list changes
        nothing. username needs no tokens of their own configured to view
        the shared dashboard; they see the owner's aggregated data exactly
        as the owner sees it.
      tags: [sharing]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathUsername"
      responses:
        "204":
          description: Shared.
        "400":
          description: Can't share your own dashboard with yourself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user is registered under that username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: unshareWith
      summary: Stop sharing the signed-in user's dashboard with username
      description: Idempotent — removing a username that was never shared with changes nothing.
      tags: [sharing]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathUsername"
      responses:
        "204":
          description: No longer shared.
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/webhooks/github/{webhookToken}:
    post:
      operationId: receiveGitHubWebhook
      summary: Receive a GitHub repository webhook delivery
      description: |
        Triggers an immediate refresh for the user webhookToken identifies,
        once the request's `X-Hub-Signature-256` header is verified against
        that user's webhook secret. Every delivery GitHub can send for a
        repository webhook (a new pull request, a closed issue, a status or
        check-run update, even the `ping` event GitHub sends when the
        webhook is first created) means the same thing here — something
        changed, refresh — so nothing about the payload itself is parsed.
      tags: [webhooks]
      # Not session-or-bearer authenticated like everything else in this
      # spec — the path's token identifies the user, and the request's
      # own HMAC signature is what proves it actually came from their
      # forge. Explicit rather than left to the top-level default so
      # this reads as a deliberate exception, not an oversight.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathWebhookToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GitHub's own event payload — its shape isn't ours to describe, and nothing here reads it.
      responses:
        "204":
          description: Signature verified; a refresh was triggered.
        "401":
          description: The X-Hub-Signature-256 header was missing or didn't verify against this user's webhook secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user's webhook token matches webhookToken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/webhooks/forgejo/{webhookToken}:
    post:
      operationId: receiveForgejoWebhook
      summary: Receive a Forgejo repository webhook delivery
      description: |
        Triggers an immediate refresh for the user webhookToken identifies,
        once the request's signature header is verified against that
        user's webhook secret — `X-Forgejo-Signature` on a webhook set up
        with the "Forgejo" type, `X-Gitea-Signature` on one set up with the
        legacy "Gitea" type; both carry the same raw hex HMAC-SHA256. Every
        delivery means the same thing here — something changed, refresh —
        so nothing about the payload itself is parsed.
      tags: [webhooks]
      # See receiveGitHubWebhook's own comment on this same field.
      security: []
      parameters:
        - $ref: "#/components/parameters/PathWebhookToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Forgejo's own event payload — its shape isn't ours to describe, and nothing here reads it.
      responses:
        "204":
          description: Signature verified; a refresh was triggered.
        "401":
          description: Both signature headers were missing, or neither verified against this user's webhook secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user's webhook token matches webhookToken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    # Applied via a `security:` block on every operation that accepts it
    # server-side (internal/api/server.go's auth.RequireAuth wiring) — see
    # the auth tag's own description for why an endpoint's 401 description
    # says "no valid session cookie" without separately calling out this
    # header: both credentials produce the same 401. The two webhook
    # delivery endpoints are the deliberate exception; see their own
    # `security: []` comments.
    bearerAuth:
      type: http
      scheme: bearer
      description: A personal API token from POST /api/tokens, as an alternative to the session cookie.

  parameters:
    PathUsername:
      name: username
      in: path
      required: true
      schema:
        type: string

    PathWebhookToken:
      name: webhookToken
      in: path
      required: true
      schema:
        type: string

    PathTokenID:
      name: id
      in: path
      required: true
      schema:
        type: string

    QueryIncludeDrafts:
      name: includeDrafts
      in: query
      required: false
      description: |
        Whether draft pull requests are in `pullRequests`. Defaults to
        `false`: nothing can be merged, auto-merged or updated on a draft,
        so a draft is left out and counted in the response's `hiddenDrafts`
        instead. The stream and the refresh endpoint take the same
        parameter, so every snapshot a client receives follows one rule.
      schema:
        type: boolean
        default: false

    QueryRequestLogForge:
      name: forge
      in: query
      required: false
      description: Narrow to entries against this forge only. Omitted matches every forge.
      schema:
        $ref: "#/components/schemas/Forge"

    QueryRequestLogAccount:
      name: account
      in: query
      required: false
      description: |
        Narrow to entries made under this account's own credential only —
        the account's `username` (matching RequestLogEntry.account), not
        its internal id. An unrecognized username matches nothing rather
        than erroring, the same as any other filter with no matches.
        Omitted matches every account.
      schema:
        type: string

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: |
            The release tag this binary was built from, with no leading
            "v" — or "dev" for a build outside the release pipeline.
          examples: ["0.12.1", dev]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        field:
          type: string
          description: |
            Present when the rejection is about one field of the request
            body (a settings save, for instance), named as it appears there,
            so a client can mark that input without parsing `error`.

    ActionError:
      type: object
      required: [error, code, message]
      description: >-
        The structured result of a refused pull request action (Merge,
        Close, Update branch, Enable auto-merge, Dependabot and Renovate
        rebase). `code` and `message` are what a client should act on
        and show.
      properties:
        error:
          type: string
          description: |
            The same string every Error carries. With `code: unknown` it
            is the same plain words as `message`, since the raw text
            (internal prefixes, API paths, URLs) goes to the server log.
            With any other code it is the forge's own text, for logs.
        code:
          type: string
          enum:
            - already_merged
            - already_closed
            - not_mergeable
            - conflict
            - behind
            - checks_pending
            - checks_failing
            - blocked_by_protection
            - already_up_to_date
            - auto_merge_not_allowed
            - ready_to_merge
            - permission
            - rate_limited
            - unknown
          description: |
            Why the action was refused, from a re-read of the pull
            request's real state. `already_merged` and `already_closed`
            mean the dashboard's row was stale: the pull request has
            nothing left to merge.

            Three codes belong to one action each: `already_up_to_date`
            (Update branch: nothing to bring in), `auto_merge_not_allowed`
            (Enable auto-merge: the repo or pull request doesn't allow it)
            and `ready_to_merge` (Enable auto-merge: already clean, use
            Merge).
        message:
          type: string
          description: |
            A short reason in plain words, safe to show a person, always.
            With `code: unknown` it is the forge's own sentence when that
            reads as one, "The forge didn't answer. Try again in a moment."
            when the forge was unreachable (including a 502, 503 or 504),
            and "The forge refused this action and gave no reason."
            otherwise. It never holds an internal prefix, an API path, a
            URL or JSON.
        resetsAt:
          type: string
          format: date-time
          description: Only with `rate_limited`, when the forge said so. When the budget comes back.

    RegisterBeginRequest:
      type: object
      required: [username, displayName]
      properties:
        username:
          type: string
          examples: [ryan]
        displayName:
          type: string
          description: |
            Ignored once an invite is required (any account already
            exists) — the invite's own displayName (set by the admin who
            issued it) is what's actually used. Only the very first,
            bootstrap registration on a fresh instance takes this value.
          examples: [Ryan]
        inviteToken:
          type: string
          description: |
            Required once any account already exists (see GET
            /api/auth/registration-status) — a single-use token from POST
            /api/admin/invites, issued for exactly this username. Omitted
            or ignored for the very first, bootstrap registration.

    RegistrationStatus:
      type: object
      required: [open]
      properties:
        open:
          type: boolean
          description: True only when the instance has zero registered users.

    LoginBeginRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          examples: [ryan]

    WebAuthnCeremonyOptions:
      type: object
      description: |
        The WebAuthn specification's own JSON shape for
        `PublicKeyCredentialCreationOptions`/`PublicKeyCredentialRequestOptions`
        (the begin responses) and `PublicKeyCredential`
        (the finish request bodies) — passed through to and from the
        browser's own `navigator.credentials` API untouched, so this
        contract intentionally doesn't re-model WebAuthn's own schema.
      additionalProperties: true

    FilterState:
      type: object
      description: |
        The dashboard/Insights filter bar's own saved shape —
        whatever the frontend's `$lib/filters` `loadState`/`saveState` already produce
        client-side (shared forge/repo/label/author/title/created/
        updated/groupBy, plus the two board-owned extras with no
        equivalent on the other entity type). This server stores and
        returns it verbatim, byte for byte, and never parses or
        validates its shape — the same "opaque blob, not this layer's
        concern" treatment WebAuthnCeremonyOptions above gets, so a
        client-side shape change here never needs a matching spec change.
      additionalProperties: true

    SessionUser:
      type: object
      required: [username, displayName, isAdmin]
      properties:
        username:
          type: string
        displayName:
          type: string
        isAdmin:
          type: boolean

    AdminUser:
      type: object
      required: [username, displayName, isAdmin, createdAt]
      properties:
        username:
          type: string
        displayName:
          type: string
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AdminInvite:
      type: object
      description: |
        An outstanding (unconsumed, unexpired) invite's own metadata —
        never the raw token, which only AdminInviteCreateResponse ever
        carries, once, at creation time.
      required: [id, username, displayName, expiresAt]
      properties:
        id:
          type: string
          description: |
            The invite's own stable identifier — pass this back to POST
            /api/admin/invites/{token}/revoke, not the raw token an
            invitee registers with.
        username:
          type: string
        displayName:
          type: string
        expiresAt:
          type: string
          format: date-time

    AdminInviteCreateRequest:
      type: object
      required: [username, displayName]
      properties:
        username:
          type: string
          examples: [alex]
        displayName:
          type: string
          examples: [Alex]

    AdminInviteCreateResponse:
      type: object
      description: |
        The one and only response that ever carries the raw invite token
        — shown to the admin once, at creation time, for them to copy
        into a `/login?invite=<token>` link and hand to the invitee out
        of band. Only its hash is stored, so it can't be recovered from
        here again.
      required: [token, username, displayName, expiresAt]
      properties:
        token:
          type: string
        username:
          type: string
        displayName:
          type: string
        expiresAt:
          type: string
          format: date-time

    RequestLogEntry:
      type: object
      description: |
        One outbound request `internal/github` or `internal/forgejo`
        made, as persisted by the request_log table.
      required: [loggedAt, forge, method, endpoint, outcome]
      properties:
        loggedAt:
          type: string
          format: date-time
        forge:
          $ref: "#/components/schemas/Forge"
        account:
          type: string
          description: |
            The display username of the account whose credential made
            this request, or omitted when the request was made with no
            per-account credential, or when that account has since been
            deleted.
        method:
          type: string
          examples: [GET, POST]
        endpoint:
          type: string
          description: The request's own path — GraphQL requests all report "/graphql".
          examples: ["/repos/alrayyes/forge-dashboard/pulls", /graphql]
        statusCode:
          type: integer
          description: Omitted when the request never got a response at all.
        outcome:
          type: string
          description: '"success", or the `ForgeErrorKind` the failure was classified as.'
          examples: [success, rate_limited]
        rateLimit:
          description: Omitted when the response carried no rate-limit fields.
          allOf:
            - $ref: "#/components/schemas/RateLimit"

    SharedUser:
      type: object
      required: [username, displayName]
      properties:
        username:
          type: string
        displayName:
          type: string

    SharingResponse:
      type: object
      required: [sharedWith, sharedWithMe]
      properties:
        sharedWith:
          type: array
          description: Users the signed-in user has shared their own dashboard with.
          items:
            $ref: "#/components/schemas/SharedUser"
        sharedWithMe:
          type: array
          description: Users who have shared their dashboard with the signed-in user.
          items:
            $ref: "#/components/schemas/SharedUser"

    SettingsResponse:
      type: object
      description: |
        The signed-in user's own GitHub/Forgejo configuration. Never
        includes a forge token's value — only whether one is currently
        saved, so the UI can show a "Configured" badge without the secret
        ever reaching the browser. webhookToken/webhookSecret are the
        exception: they're ours to hand back in the clear, since the user
        has to paste them into the forge's own webhook setup.
      required:
        [
          githubUsername,
          githubTokenSet,
          githubAppInstallationId,
          githubAppConfigured,
          forgejoUrl,
          forgejoUsername,
          forgejoTokenSet,
          webhookToken,
          webhookSecret,
          renovateRebaseLabel,
          theme,
        ]
      properties:
        githubUsername:
          type: string
          description: Used as a token-free public-repos fallback when no GitHub token is set.
        githubTokenSet:
          type: boolean
          description: Whether a GitHub token is currently saved.
        githubAppInstallationId:
          type: integer
          format: int64
          description: |
            The installation ID of the alrayyes-automation GitHub App
            this user has connected, or 0 if none. Not a
            secret — it's an opaque integer GitHub already shows the
            user on its own installation settings page — so, unlike
            githubTokenSet, this round-trips as a plain value. Takes
            precedence over a saved githubToken whenever both are set
            and the server has an App configured (see
            githubAppConfigured).
        githubAppConfigured:
          type: boolean
          description: |
            Whether this server has a GitHub App configured at all
            (server-wide GITHUB_APP_ID/GITHUB_APP_PRIVATE_KEY_BASE64 —
            not a per-user setting). The Settings page uses this to
            explain why githubAppInstallationId can't be saved when
            it's false.
        forgejoUrl:
          type: string
        forgejoUsername:
          type: string
          description: Used as a token-free public-repos fallback when no Forgejo token is set.
        forgejoTokenSet:
          type: boolean
          description: Whether a Forgejo token is currently saved.
        webhookToken:
          type: string
          description: |
            Identifies this user in a webhook URL
            (`/api/webhooks/{provider}/{webhookToken}`). Generated on
            first visit to Settings and stable after that.
        webhookSecret:
          type: string
          description: |
            Pasted into the forge's own webhook "Secret" field, used to
            verify the signature header on incoming webhook deliveries
            (`X-Hub-Signature-256` on GitHub, `X-Forgejo-Signature` on
            Forgejo). Never appears in the webhook URL itself.
        renovateRebaseLabel:
          type: string
          description: |
            The label Renovate's own rebase/retry trigger listens for on
            a repo (Renovate's own `rebaseLabel` config option — genuinely
            per-repo configurable, so this is a user-set override rather
            than a hardcoded constant). Empty means Renovate's own
            documented default, `rebase`.
        theme:
          type: string
          enum: ["", light, dark]
          description: |
            The signed-in user's own theme preference. Empty
            means "system" — follow the browser's prefers-color-scheme
            rather than a saved choice. Set only from Settings; every
            other page reads it via the lightweight
            GET /api/settings/theme instead of this endpoint.

    SettingsRequest:
      type: object
      description: |
        Replaces the signed-in user's saved GitHub/Forgejo configuration.
        A blank `githubToken` or `forgejoToken` keeps whatever token is
        already saved for that forge rather than clearing it — this is
        the only way to update the username fields without having to
        resubmit a token you don't want to re-paste. githubAppInstallationId
        is different: a plain replace like githubUsername, not coalesced —
        0 or omitted really does disconnect the App. Rejected (400) if
        the server has no GitHub App configured (see
        SettingsResponse.githubAppConfigured). Theme isn't settable
        here at all — see PUT /api/settings/theme.
      properties:
        githubToken:
          type: string
        githubUsername:
          type: string
        githubAppInstallationId:
          type: integer
          format: int64
          minimum: 0
          description: |
            0 means none. A negative or non-integer value is a 400 naming
            this field, as is any value on a server with no GitHub App
            configured.
        forgejoUrl:
          type: string
          description: |
            Required, once the save is merged with what is already stored,
            whenever a Forgejo token or username is set. That depends on
            stored state, so a schema alone can't express it: a save that
            breaks it is a 400 naming `forgejoUrl`.
        forgejoToken:
          type: string
        forgejoUsername:
          type: string
        renovateRebaseLabel:
          type: string

    ThemeResponse:
      type: object
      description: See GET /api/settings/theme's own description.
      required: [theme]
      properties:
        theme:
          type: string
          enum: ["", light, dark]

    ThemeRequest:
      type: object
      description: See PUT /api/settings/theme's own description.
      required: [theme]
      properties:
        theme:
          type: string
          enum: ["", light, dark]

    Credential:
      type: object
      description: |
        A registered passkey's own metadata — never the
        credential itself, which never leaves the authenticator that
        created it; WebAuthn's whole design is that the server only ever
        sees a public key and signed assertions, not a secret to lose.
      required: [id, label, createdAt]
      properties:
        id:
          type: string
          description: This passkey's own credential ID (base64url), distinct from the account's user ID.
        label:
          type: string
          description: The name given at registration time, so a list of several is tellable apart.
        createdAt:
          type: string
          format: date-time

    APIToken:
      type: object
      description: |
        A personal API token's own metadata — never the token value
        itself, which only ever appears once, in
        APITokenCreateResponse's own response body at creation time.
      required: [id, label, createdAt, expiresAt]
      properties:
        id:
          type: string
        label:
          type: string
          description: The name given at creation time, so a list of several is tellable apart.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: |
            When this token stops authenticating requests —
            always set, mandatory at creation, no "never expires"
            option. A token whose expiration has passed is rejected the
            same way an invalid one is.
        lastUsedAt:
          type: string
          format: date-time
          description: Omitted if this token has never authenticated a request yet.

    APITokenCreateRequest:
      type: object
      required: [label, expiresAt]
      properties:
        label:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: |
            Must be in the future and no more than 366 days out (matching
            GitHub's own fine-grained-token maximum) — the
            Settings UI offers 7/30/60/90-day presets (30 pre-selected)
            or a custom date within that same cap, never an option for
            no expiration at all.

    APITokenCreateResponse:
      type: object
      description: |
        The one and only response that ever carries the raw token value
        — shown to the user once, at creation time; only its hash is
        stored, so it can't be recovered from here again. Losing it
        means generating a new one.
      required: [id, label, createdAt, expiresAt, token]
      properties:
        id:
          type: string
        label:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        token:
          type: string
          description: "The raw Bearer credential: `Authorization: Bearer <token>`."

    WebhookEnsureRequest:
      type: object
      required: [forge, fullName]
      description: Which repo to create or fix up a webhook on.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          description: '"owner/repo", matching a Repo.fullName from GET /api/dashboard.'

    RepoIgnoreRequest:
      type: object
      required: [forge, fullName, prs, issues]
      description: |
        Which repo to ignore, and in which scope(s). At least one
        of prs/issues must be true — a request with both false is
        rejected with 400 rather than silently doing nothing; use POST
        /api/repos/unignore to clear both at once instead.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          description: '"owner/repo", matching a Repo.fullName from GET /api/dashboard.'
        prs:
          type: boolean
          description: Whether to ignore this repo's pull requests.
        issues:
          type: boolean
          description: Whether to ignore this repo's issues.

    PullRequestActionRequest:
      type: object
      required: [forge, fullName, number]
      description: Which pull request to act on.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          description: '"owner/repo", matching a Repo.fullName from GET /api/dashboard.'
        number:
          type: integer
          description: Matching a PullRequest.number from GET /api/dashboard.

    PullRequestDependabotActionRequest:
      type: object
      required: [forge, fullName, number, action]
      description: Which pull request to act on, and which of Dependabot's own comment commands to send.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          description: '"owner/repo", matching a Repo.fullName from GET /api/dashboard.'
        number:
          type: integer
          description: Matching a PullRequest.number from GET /api/dashboard.
        action:
          type: string
          enum: [rebase, recreate]
          description: Which Dependabot comment command to post — "@dependabot rebase" or "@dependabot recreate".

    Forge:
      type: string
      enum: [github, forgejo]

    CIStatus:
      type: string
      enum: [success, failure, pending, none]
      description: |
        The combined result across every check reported against the pull
        request's head commit. "none" means neither forge reported any
        check at all, not that one failed.

    CheckState:
      type: string
      enum: [queued, running, success, failure, cancelled, skipped, timed_out]
      description: |
        One job/check's own status — the per-job detail CIStatus
        deliberately doesn't carry, since CIStatus is the combined result
        across every one of them.

    Check:
      type: object
      required: [name, state, url]
      description: One job/check run against a pull request's head commit.
      properties:
        name:
          type: string
        state:
          $ref: "#/components/schemas/CheckState"
        url:
          type: string
          description: That job's own page on the forge that ran it — never the pull request's own page.
        required:
          type: boolean
          description: |
            Whether the base branch's protection makes this check block the
            merge (GitHub required status checks and rulesets, Forgejo
            `status_check_contexts`). Absent when the forge can't tell — a
            token that can't read protection, or a check that can't be
            mapped to a protection entry. Absent is not the same as false.
        durationSeconds:
          type: integer
          minimum: 0
          description: |
            How long a completed check ran. Absent while it runs, or when
            the forge doesn't say. GitHub only: Forgejo's API doesn't give
            a job's timing.
        failedStep:
          type: string
          description: |
            The name of the step of a failed job that broke. Absent when
            the check isn't a job the token can read (a third-party check,
            a forge with no step data, a token without access).
        excerpt:
          type: string
          description: |
            The tail of the failed job's log as plain text: the last lines,
            with per-line timestamps and colour codes removed, at most 2,000
            characters. Never markup, and a client must render it as text.
            Whatever the forge already masks stays masked. Absent when the
            log can't be read or has expired. GitHub only: Forgejo's API
            doesn't serve job logs, so there the link to the run is all a
            failed check offers.

    PullRequestChecksResponse:
      type: object
      required: [checks]
      properties:
        checks:
          type: array
          items:
            $ref: "#/components/schemas/Check"

    MergeStatus:
      type: string
      enum: [mergeable, conflicting, blocked, unknown]
      description: |
        A pull request's mergeable/blocked state, as coarse as every forge
        this service talks to can agree on. "blocked" covers anything
        stopping a merge that isn't confirmed to be a real conflict —
        including Forgejo's own mergeable flag reporting false, since its
        server computes that asynchronously and can report it stale.
        "unknown" covers both a forge that hasn't determined this yet and
        this service being unable to determine it.

    Label:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          examples: [kind/bug]
        color:
          type: string
          description: |
            The label's colour as a hex string with no leading "#",
            exactly as the forge reports it.
          pattern: "^[0-9a-fA-F]{6}$"
          examples: [d73a4a]

    ForgeErrorKind:
      type: string
      enum:
        [unreachable, unauthorized, not_found, rate_limited, conflict, unknown]
      description: |
        Why a forge is unreachable, or why a write to it was rejected, as
        coarse as every forge this service talks to can agree on.
        "unauthorized" covers both a bad token and a forbidden request;
        "not_found" usually means a wrong instance URL. "conflict" is only
        ever returned from a pull-request write — the forge reports the PR
        itself isn't currently mergeable. "unknown" covers a signal this
        service doesn't recognize, rather than a guessed-at specific cause.

    ForgeHealth:
      type: object
      required: [forge, reachable, repoCount]
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        reachable:
          type: boolean
          description: Whether the last refresh attempt against this forge succeeded.
        staleSince:
          type: string
          format: date-time
          description: |
            Present when the last refresh against this forge failed and the
            pull requests, issues and repos in the response are the last good
            ones, fetched at this time, instead of none. Absent when the data
            is current, and for a forge that has never fetched successfully,
            which has nothing to show. A client can say "unreachable, showing
            data from 3 minutes ago".
        error:
          type: string
          description: >-
            A human-readable explanation of the last failure, if reachable is
            false. Mapped from errorKind, not the raw underlying error text.
            Omitted when reachable.
        errorKind:
          $ref: "#/components/schemas/ForgeErrorKind"
        repoCount:
          type: integer
          minimum: 0
          description: Repositories with write access this forge reported.
        rateLimitGraphQL:
          allOf:
            - $ref: "#/components/schemas/RateLimit"
          description: >-
            GitHub's GraphQL budget — a completely separate
            5000/hour allowance from rateLimitREST, populated from the
            rateLimit block GitHub embeds in every GraphQL response.
            Never set for a forge with no GraphQL API (Forgejo).
        rateLimitREST:
          allOf:
            - $ref: "#/components/schemas/RateLimit"
          description: >-
            The forge's REST budget, from real X-RateLimit-* response
            headers. For GitHub, this is checkWebhooks and every write
            action (merge, update branch, comment, label) — a different
            5000/hour allowance from rateLimitGraphQL, not a duplicate of
            it. Omitted on a poll that made no REST call at all (no
            webhook path configured). For Forgejo, or any forge reached
            through GenericSource, this is the only budget there is to
            report — GenericSource makes exclusively REST-style calls.
        dependabotCommandsBlocked:
          type: string
          description: >-
            Why a "@dependabot" comment sent through this forge's credential
            would be refused. Dependabot only honours commands from a
            user with push access and ignores GitHub App accounts whatever
            permissions the App holds. Set only for GitHub when the
            connected credential is an App with no personal access token
            saved to send commands as. The Dependabot buttons lock with this
            text, auto-update-branch skips Dependabot pull requests, and the
            dependabot-action endpoint answers 409 with it. Omitted when
            commands work.

    RateLimit:
      type: object
      required: [limit, remaining, resetsAt, severity]
      description: >-
        One of a forge API's own request budgets for the credential the
        last refresh used — see ForgeHealth.rateLimitGraphQL/rateLimitREST
        for which budget this is and when each is (or isn't) reported.
      properties:
        limit:
          type: integer
          minimum: 0
          description: Requests allowed per window.
        remaining:
          type: integer
          minimum: 0
          description: Requests left in the current window.
        resetsAt:
          type: string
          format: date-time
          description: When the window resets and remaining goes back to limit.
        cost:
          type: integer
          minimum: 0
          description: >-
            The point price the most recent call was actually charged —
            GraphQL-specific, since a REST request has no
            separate cost concept beyond the flat one-request-one-point
            REST's own budget already counts. Omitted for a REST-sourced
            RateLimit.
        severity:
          type: string
          enum: [ok, low, exceeded]
          description: |
            How worried a client should be about this budget, graded by
            the server as of the response, so no client needs its own
            threshold or clock check. `exceeded`: nothing left and the
            reset hasn't been seen to pass. `low`: under 5% left (also a
            spent budget whose reset time has passed, until the next
            snapshot says otherwise). `ok`: everything else.

    PullRequest:
      type: object
      required:
        [
          forge,
          repo,
          number,
          title,
          url,
          author,
          draft,
          labels,
          createdAt,
          updatedAt,
          ci,
          mergeStatus,
          behind,
          headSha,
          baseBranch,
          headBranch,
          crossRepository,
          stack,
          stackedOn,
          stackChildren,
          requestedReviewerLogins,
          reviewRequestedFromMe,
          empty,
          allowedActions,
          readyToMerge,
          needsReview,
        ]
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        repo:
          type: string
          description: Owner-qualified repository name.
          examples: [alrayyes/hush-hush]
        number:
          type: integer
        title:
          type: string
        url:
          type: string
          format: uri
          description: The real pull request URL on its own forge.
        author:
          type: string
        draft:
          type: boolean
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        ci:
          $ref: "#/components/schemas/CIStatus"
        mergeStatus:
          $ref: "#/components/schemas/MergeStatus"
        behind:
          type: boolean
          description: |
            Whether this pull request's base branch has moved since its
            merge-base was computed. Deliberately its own field rather
            than a mergeStatus value: on Forgejo a pull request can be
            both mergeable and behind at once (its mergeable flag doesn't
            get recomputed just because the base moved), so folding this
            into mergeStatus would force picking one and losing the
            other.
        headSha:
          type: string
          description: |
            The commit the pull request's head branch points at. A bot's
            rebase moves it, which shows the bot acted even when the pull
            request is still reported behind, or wasn't behind to begin
            with. Empty when the forge didn't say. Always present.
        baseBranch:
          type: string
          description: |
            The branch the pull request targets. Empty when the forge didn't
            say.
        headBranch:
          type: string
          description: |
            The branch the pull request comes from. Empty when the forge
            didn't say.
        crossRepository:
          type: boolean
          description: |
            True when the head branch lives in another repository (a fork).
            A fork pull request is never part of a stack.
        stack:
          description: |
            Where this pull request sits in a stack of pull requests, or
            null when it is in none. A stack is worked out on the server:
            pull request B is stacked on A when B's base branch is A's head
            branch, in the same repository on the same forge, and neither is
            a fork. A branch with several open pull requests takes the one
            with the lowest number as parent, and a loop of branches is
            treated as no stack. The snapshot holds open pull requests
            only, so a base branch that no open pull request owns (a parent
            that already merged and was not retargeted) is not flagged.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/StackPosition"
        stackedOn:
          description: |
            The open pull request this one is stacked on, or null when its
            base is not another open pull request's head.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/StackRef"
        stackChildren:
          type: array
          items:
            type: integer
          description: |
            The numbers of the open pull requests stacked directly on this
            one. Always a list, empty when none.
        requestedReviewerLogins:
          type: array
          items:
            type: string
          description: |
            The logins of the users asked to review this pull request, on
            both forges. A team request has no login and is left out.
            Always present, and empty when nobody was asked. Costs no
            extra request: GitHub returns it with the reviewRequests count
            already queried, Forgejo with the pull request itself.
        reviewRequestedFromMe:
          type: boolean
          description: |
            True when this open, non-draft pull request asks the signed-in
            user to review it, matched without regard to case against the
            username saved in Settings for its forge. False when no
            username is saved for that forge. Always present.
        empty:
          type: boolean
          description: |
            Whether merging this pull request would produce an empty
            commit — its content already landed on the base branch some
            other way. False whenever this service can't tell (the
            unauthenticated GitHub REST fallback, or a Forgejo instance
            old enough not to report additions/deletions/changed_files on
            its list endpoint), never a false positive: a pull request
            this never confirms empty just renders as it always has.
        autoMergeEnabled:
          type: boolean
          description: |
            Whether auto-merge is currently scheduled on this pull request.
            Omitted when the owning forge has no way to report this at all
            (Forgejo, today) — never false in that case, since this service
            genuinely doesn't know.
        autoMergeAllowed:
          type: boolean
          description: |
            Whether GitHub will accept an "Enable auto-merge" request for
            this pull request from the signed-in viewer, read from the
            GraphQL `PullRequest.viewerCanEnableAutoMerge` field. GitHub
            decides this per viewer and per pull request: auto-merge needs
            something on the base branch to wait for (required checks or
            reviews from a branch protection rule or ruleset), so a stacked
            pull request on an unprotected base reports false even when the
            repository allows auto-merge. Omitted when unknown (the
            unauthenticated REST fallback, and Forgejo), never false in
            that case, so clients keep today's behaviour.
        review:
          $ref: "#/components/schemas/ReviewState"
        allowedActions:
          type: array
          items:
            $ref: "#/components/schemas/AllowedAction"
          description: |
            The actions this pull request offers, worked out on the server
            from its own fields, so a client needs no copy of the rules. An
            action that doesn't apply (Update branch on a pull request that
            isn't behind, a Dependabot command on a Renovate pull request)
            is absent, not listed as blocked. Always present; `close` is
            always in it. Live state is the client's: a rate-limited or
            unreachable forge, a missing token and an action already in
            flight can still stop an offered action.

        readyToMerge:
          type: boolean
          description: |
            True when the pull request is mergeable, its CI is green and it
            isn't a draft: what the Ready quick filter lists. Always
            present. A pull request with no checks isn't ready.
        needsReview:
          type: boolean
          description: |
            True when a review is outstanding: the forge requires one, or a
            reviewer was asked and hasn't answered, and the pull request
            isn't a draft. Unreviewed with nobody asked, approved, changes
            requested and an unknown review state are all false. Always
            present.

    StackPosition:
      type: object
      required: [position, size]
      properties:
        position:
          type: integer
          minimum: 1
          description: |
            1 for the pull request at the bottom of the stack (the one
            targeting a branch no open pull request owns), 2 for one
            stacked directly on it, and so on.
        size:
          type: integer
          minimum: 2
          description: How many open pull requests the stack holds.

    StackRef:
      type: object
      required: [number, url]
      properties:
        number:
          type: integer
        url:
          type: string
          format: uri

    AllowedAction:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum:
            - merge
            - close
            - update_branch
            - auto_merge
            - dependabot_rebase
            - dependabot_recreate
            - renovate_rebase
        blocked:
          type: object
          required: [code, message]
          description: |
            Present when the action is offered but can't be taken yet. Merge
            is never hidden for an open pull request, only blocked.
          properties:
            code:
              type: string
              description: The same codes as `ActionError.code`.
              enum:
                - already_up_to_date
                - conflict
                - not_mergeable
                - checks_pending
                - checks_failing
                - behind
                - blocked_by_protection
                - stacked
            message:
              type: string
              description: Plain words, safe to show a person.
            next:
              type: string
              description: What unlocks it, when something does.

    ReviewState:
      type: object
      required: [decision, approvals, requestedReviewers]
      description: |
        Where a pull request stands on code review. The whole object is
        omitted when the owning forge couldn't report it (a Forgejo
        reviews call that failed, a draft Forgejo pull request this
        service doesn't spend a call on), so a missing "review" means
        "unknown" and never "nobody reviewed it."

        GitHub: read from fields on the existing GraphQL query
        (reviewDecision, reviewRequests, latestReviews), so it adds no
        per-pull-request requests. Forgejo: requestedReviewers comes free
        on the pull request list, but approvals and the decision need one
        reviews call per open, non-draft pull request, cached until that
        pull request's updatedAt changes.
      properties:
        decision:
          type: string
          enum: [approved, changes_requested, review_required, none]
          description: |
            "approved" and "changes_requested" mean what they say.
            "review_required" means a review is still outstanding: GitHub
            says so itself when branch protection requires one, and on
            Forgejo it means reviewers are requested and nobody has
            approved. "none" means no review activity and nothing
            required or requested.
        approvals:
          type: integer
          minimum: 0
          description: |
            Reviewers whose latest review is an approval. GitHub counts
            at most the 10 most recent reviewers.
        requestedReviewers:
          type: integer
          minimum: 0
          description: Users and teams still asked to review.

    Issue:
      type: object
      required:
        [forge, repo, number, title, url, author, labels, createdAt, updatedAt]
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        repo:
          type: string
          examples: [alrayyes/hush-hush]
        number:
          type: integer
        title:
          type: string
        url:
          type: string
          format: uri
          description: The real issue URL on its own forge.
        author:
          type: string
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Dashboard:
      type: object
      required: [generatedAt, forges, pullRequests, issues, repos, hiddenDrafts]
      properties:
        generatedAt:
          type: string
          format: date-time
          description: When this snapshot was refreshed, not when it was requested.
        hiddenDrafts:
          type: integer
          minimum: 0
          description: |
            How many draft pull requests `pullRequests` leaves out. Always
            present, and `0` when the request set `includeDrafts=true`, so
            a client can render "N hidden" without a special case. Drafts
            in a repo the account ignores aren't counted, since none of
            that repo's pull requests show.
        forges:
          type: array
          items:
            $ref: "#/components/schemas/ForgeHealth"
        pullRequests:
          type: array
          items:
            $ref: "#/components/schemas/PullRequest"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        repos:
          type: array
          items:
            $ref: "#/components/schemas/RepoStatus"

    RepoStatus:
      type: object
      required:
        [
          forge,
          fullName,
          url,
          hasWebhook,
          canManageWebhooks,
          ignored,
          ignoredPRs,
          ignoredIssues,
          autoUpdateBranch,
        ]
      description: |
        One tracked repository, whether or not it currently has anything
        open — repoCount alone can't name it, and it wouldn't otherwise
        appear anywhere pullRequests/issues don't already mention it.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          examples: [alrayyes/forge-dashboard]
        url:
          type: string
          format: uri
          description: The repo's own page on its forge, for linking out.
          examples: ["https://github.com/alrayyes/forge-dashboard"]
        ignored:
          type: boolean
          description: |
            Whether the signed-in user has ignored this repo in either
            scope below — true whenever ignoredPRs or
            ignoredIssues is true. The repo itself still appears here
            with accurate hasWebhook/canManageWebhooks regardless.
        ignoredPRs:
          type: boolean
          description: |
            Whether the signed-in user has ignored this repo's pull
            requests specifically — its pullRequests entries are
            excluded from this same response and from Insights.
        ignoredIssues:
          type: boolean
          description: |
            Whether the signed-in user has ignored this repo's issues
            specifically — its issues entries are excluded from
            this same response and from Insights.
        hasWebhook:
          type: boolean
          description: |
            Whether this app has ever recorded a signature-verified
            webhook delivery for this repo. Passive: it reflects a real
            delivery having arrived, not whether a webhook object exists
            on the forge — a correctly configured webhook that just
            hasn't fired yet still reads false here, the same as a
            misconfigured one would.
        canManageWebhooks:
          type: boolean
          description: |
            Whether the signed-in user's own permission on this repo is
            enough to list/create its webhooks — GitHub requires admin
            specifically (write/maintain can push but still 404 on the
            hooks endpoint, by GitHub's own design); Forgejo's equivalent
            is its own admin permission flag. Always false for a repo
            reached through an unauthenticated, username-only listing.
            A point-in-time snapshot: a permission change since the last
            refresh can still make a following ensure-webhook call fail
            despite this having said true.
        autoUpdateBranch:
          type: boolean
          description: |
            Whether the signed-in user has turned on automatic branch
            updates for this repo — any of its pull requests the
            background refresh finds behind its base branch gets updated
            the same way a manual "Update branch" click would. A
            Dependabot pull request gets its own rebase comment instead,
            and a Renovate one its own rebase label, mirroring their
            manual action buttons. A release-please pull request is
            always skipped by this background pass, so no unattended write
            lands on a release branch. The dashboard's manual "Update
            branch" button is still offered on it, since release-please
            has no rebase action of its own.

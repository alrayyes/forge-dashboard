# The contract, and the only machine-readable description of it. Hand-written
# and committed rather than generated from handler annotations — the spec is
# reviewed as the design, and internal/api is written against it, not the
# other way round.
openapi: 3.1.0

info:
  title: forge-dashboard
  summary: A single-page view of open PRs, issues and CI status across GitHub and Forgejo.
  description: |
    Aggregates every repository the configured GitHub and Forgejo accounts
    have write access to into one read-only view: open pull requests (with
    CI status), open issues, and per-forge reachability. The backend holds
    both forges' credentials; the frontend only ever calls the endpoints
    below.
  version: 1.0.0
  contact:
    name: forge-dashboard
    url: https://github.com/alrayyes/forge-dashboard
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only

servers:
  - url: "{scheme}://{host}"
    description: |
      No canonical host — this runs on a homelab reachable only over
      Tailscale, so the variables below are the shape of the answer rather
      than the answer.
    variables:
      scheme:
        default: https
        enum: [https, http]
      host:
        default: localhost:8080
        description: The default listen address. Set ADDR to change it.

security: []

tags:
  - name: health
    description: Liveness, for whatever supervises the process.
  - name: dashboard
    description: The aggregated view across both forges.
  - name: auth
    description: Passkey (WebAuthn) registration, login and session management.
  - name: settings
    description: The signed-in user's own GitHub/Forgejo credentials.
  - name: admin
    description: Managing the user base itself. Every endpoint here requires the signed-in user to be the designated admin.
  - name: sharing
    description: Granting other registered users read-only access to the signed-in user's own dashboard.
  - name: webhooks
    description: |
      Where GitHub/Forgejo push repository events, for an immediate refresh
      instead of waiting on the next poll, and the one endpoint that
      creates or updates a webhook on the user's behalf. The two delivery
      endpoints aren't session-authenticated like everything else here —
      the path's token identifies the user, and the request's HMAC
      signature (computed with that user's webhook secret) is what proves
      it actually came from their forge; `POST /api/webhooks/ensure` is a
      normal session-authenticated endpoint like the rest of this API.
  - name: pull-requests
    description: |
      Actions against a pull request already listed on the dashboard,
      taken on the signed-in user's own behalf.

paths:
  /api/auth/register/begin:
    post:
      operationId: beginRegistration
      summary: Start a passkey registration ceremony
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBeginRequest"
      responses:
        "200":
          description: |
            WebAuthn credential creation options, passed straight to the
            browser's `navigator.credentials.create()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCeremonyOptions"
        "409":
          description: That username is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/register/finish:
    post:
      operationId: finishRegistration
      summary: Complete a passkey registration ceremony
      tags: [auth]
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: |
          The raw response from `navigator.credentials.create()`, exactly as
          the browser produced it — forwarded to the server untouched.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCeremonyOptions"
      responses:
        "200":
          description: Registration succeeded; a session cookie is now set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          description: The ceremony failed verification, or had already expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login/begin:
    post:
      operationId: beginLogin
      summary: Start a passkey login ceremony
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBeginRequest"
      responses:
        "200":
          description: |
            WebAuthn credential request options, passed straight to the
            browser's `navigator.credentials.get()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCeremonyOptions"
        "404":
          description: No account is registered under that username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login/finish:
    post:
      operationId: finishLogin
      summary: Complete a passkey login ceremony
      tags: [auth]
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: |
          The raw response from `navigator.credentials.get()`, exactly as
          the browser produced it — forwarded to the server untouched.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCeremonyOptions"
      responses:
        "200":
          description: Login succeeded; a session cookie is now set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          description: The ceremony failed verification, or had already expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      responses:
        "204":
          description: Logged out; the session cookie is now cleared.

  /api/auth/session:
    get:
      operationId: getSession
      summary: Who, if anyone, the current session cookie belongs to
      tags: [auth]
      responses:
        "200":
          description: The current session's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/settings:
    get:
      operationId: getSettings
      summary: The signed-in user's own forge configuration
      description: |
        Tokens are never returned, before or after being saved — only
        whether one is currently on file. There is no way to read a saved
        token back out through this API.
      tags: [settings]
      responses:
        "200":
          description: The current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: putSettings
      summary: Save the signed-in user's forge configuration
      description: |
        Replaces every field except a blank token, which means "keep
        whatever's already saved" rather than "clear it" — the only
        sensible behavior for a field the browser is never shown the
        current value of. Saving triggers that user's dashboard to start
        refreshing from the new configuration.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "400":
          description: |
            The request body wasn't valid JSON, or a Forgejo token/username
            was set with no Forgejo URL — a combination the dashboard can't
            use, since the URL is what a token or username connects to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/webhooks/ensure:
    post:
      operationId: ensureWebhook
      summary: Create or fix up a webhook on one tracked repo, on the signed-in user's behalf
      description: |
        Creates a webhook on the named repo, pointed at the signed-in
        user's own webhook URL and secret, subscribed to the events
        docs/webhooks.md's manual steps recommend. If one already exists
        there (found the same way GET /api/dashboard's own `hasWebhook`
        does — matching by URL path, not object identity) it's brought
        back to active with the right events instead of creating a
        duplicate.

        One of a small number of endpoints in this API that write to a
        forge rather than just reading from it — see also the
        pull-requests tag.
      tags: [webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEnsureRequest"
      responses:
        "204":
          description: The webhook now exists and is correctly configured.
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", no credentials are saved for that forge, or
            that forge's client doesn't support managing webhooks at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover managing webhooks, or it isn't an admin on that repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The forge reported the repo itself doesn't exist (or isn't visible to this token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The forge rate-limited the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/pull-requests/merge:
    post:
      operationId: mergePullRequest
      summary: Merge one pull request, on the signed-in user's behalf
      description: |
        Merges the named pull request using its repo's own configured
        default merge method — GitHub is asked to pick its own repo
        default; Forgejo's API has no such default built in, so this
        looks up the repo's configured default merge style first and
        passes that explicitly. Neither takes a method override here;
        picking one is out of scope for this endpoint.
      tags: [pull-requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestActionRequest"
      responses:
        "204":
          description: Merged.
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", no credentials are saved for that forge, or
            that forge's client doesn't support merging pull requests at
            all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover merging, or it isn't allowed to merge on that repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The forge reported the repo or pull request doesn't exist (or isn't visible to this token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The forge rejected the merge because the pull request isn't currently mergeable — a real conflict, or its state changed since the dashboard's last refresh.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The forge rate-limited the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/pull-requests/update-branch:
    post:
      operationId: updatePullRequestBranch
      summary: Bring one pull request's branch up to date with its base, on the signed-in user's behalf
      description: |
        Merges the named pull request's base branch into its own head
        branch. GitHub can schedule this as a background job rather than
        finishing it inline — a 202 here means exactly that, not a
        failure; a follow-up refresh a moment later reflects the result.
        Forgejo's equivalent is always synchronous, so it only ever
        answers 204.
      tags: [pull-requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestActionRequest"
      responses:
        "204":
          description: Updated.
        "202":
          description: The forge scheduled the update as a background job rather than finishing it inline. Not a failure — a follow-up refresh reflects the result once it lands.
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", no credentials are saved for that forge, or
            that forge's client doesn't support updating pull request
            branches at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover updating the branch, or it isn't allowed to push on that repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The forge reported the repo or pull request doesn't exist (or isn't visible to this token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The forge rejected the update because the branches can't be merged cleanly — a real conflict updating would need to resolve by hand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The forge rate-limited the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/users:
    get:
      operationId: listUsers
      summary: List every registered user
      description: |
        Never includes a passkey or a forge credential — a username,
        display name, admin flag and registration timestamp per user.
      tags: [admin]
      responses:
        "200":
          description: Every registered user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The signed-in user isn't the designated admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/users/{username}/revoke:
    post:
      operationId: revokeUser
      summary: Revoke a user's passkeys and sessions
      description: |
        Deletes every session and every registered passkey for this user —
        they're signed out everywhere immediately, and have to register a
        new passkey from scratch to get back in. Their saved forge
        credentials are untouched; use the delete endpoint to remove the
        account itself.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/PathUsername"
      responses:
        "204":
          description: Revoked.
        "400":
          description: An admin can't revoke their own account through this endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The signed-in user isn't the designated admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user is registered under that username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/admin/users/{username}:
    delete:
      operationId: deleteUser
      summary: Remove a user outright
      description: |
        Deletes the account, every session, every registered passkey, and
        every saved forge credential — irreversible. Their username
        becomes available for a fresh registration.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/PathUsername"
      responses:
        "204":
          description: Removed.
        "400":
          description: An admin can't remove their own account through this endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The signed-in user isn't the designated admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user is registered under that username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /healthz:
    get:
      operationId: health
      summary: Liveness
      description: |
        Answers 200 once the server has started. Doesn't reflect whether
        either forge is reachable — see forges[].reachable on the dashboard
        response for that.
      tags: [health]
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok

  /api/version:
    get:
      operationId: getVersion
      summary: The running server's own version
      description: |
        The tag goreleaser stamped the running binary with ("dev" for a
        build outside the release pipeline). Public and unauthenticated —
        every page, including the pre-login screen, links to the matching
        GitHub release from its footer so a person can tell what's
        actually deployed without shelling into the box.
      tags: [health]
      responses:
        "200":
          description: The running version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
              example:
                version: 0.12.1

  /api/dashboard:
    get:
      operationId: getDashboard
      summary: The aggregated view
      description: |
        Returns the most recently fetched snapshot. The backend refreshes
        this on its own schedule in the background; this endpoint never
        blocks on a live call to either forge, so it answers instantly even
        when a forge is slow or unreachable.

        Omitting `owner` returns the signed-in user's own dashboard. Passing
        it returns that user's dashboard instead — allowed only when they've
        shared it with the caller (or the caller is viewing their own
        username), and refused with a 403 otherwise.
      tags: [dashboard]
      parameters:
        - name: owner
          in: query
          required: false
          schema:
            type: string
          description: A username that has shared their dashboard with the caller. Defaults to the caller's own.
      responses:
        "200":
          description: The current snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: owner hasn't shared their dashboard with the signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user is registered under owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/dashboard/stream:
    get:
      operationId: streamDashboard
      summary: Server-Sent Events stream of the signed-in user's own dashboard
      description: |
        Pushes a fresh snapshot every time this user's background
        refresh produces one — most notably right after a verified
        webhook delivery (see the webhooks tag) triggers an immediate
        one, which is what turns that into a live update instead of
        something only the next scheduled refresh picks up.

        Doesn't support `owner` the way GET /api/dashboard does — only
        ever the signed-in user's own dashboard, never a shared one.
        The frontend's own 30-second poll against GET /api/dashboard
        keeps running unconditionally, connected or not — a browser or
        proxy that can't hold an SSE connection open just never
        benefits from this, rather than the dashboard going stale
        silently.
      tags: [dashboard]
      responses:
        "200":
          description: |
            An SSE stream. Each event's `data` field is a JSON-encoded
            snapshot, identical in shape to GET /api/dashboard's
            response body.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No background refresh is running yet for this user — Settings has never been saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/dashboard/refresh:
    post:
      operationId: refreshDashboard
      summary: Trigger an immediate refresh of the signed-in user's own dashboard
      description: |
        Blocks until an immediate, out-of-band refresh of the signed-in
        user's own dashboard completes, then returns the resulting
        snapshot — for retrying right away after a forge was only
        briefly unreachable, instead of waiting for the next scheduled
        background refresh.

        Doesn't support `owner` the way GET /api/dashboard does — only
        ever the signed-in user's own dashboard, never a shared one, so
        a user with shared access to someone else's dashboard can never
        spend that owner's own forge rate-limit budget on their own
        schedule.
      tags: [dashboard]
      responses:
        "200":
          description: The freshly refreshed snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No background refresh is running yet for this user — Settings has never been saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/sharing:
    get:
      operationId: getSharing
      summary: The signed-in user's sharing relationships
      description: |
        Both directions at once: who the signed-in user has shared their
        own dashboard with, and whose dashboards have been shared with
        them.
      tags: [sharing]
      responses:
        "200":
          description: The current sharing relationships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharingResponse"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/sharing/{username}:
    put:
      operationId: shareWith
      summary: Share the signed-in user's dashboard with username
      description: |
        Idempotent — sharing with a username already on the list changes
        nothing. username needs no tokens of their own configured to view
        the shared dashboard; they see the owner's aggregated data exactly
        as the owner sees it.
      tags: [sharing]
      parameters:
        - $ref: "#/components/parameters/PathUsername"
      responses:
        "204":
          description: Shared.
        "400":
          description: Can't share your own dashboard with yourself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user is registered under that username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: unshareWith
      summary: Stop sharing the signed-in user's dashboard with username
      description: Idempotent — removing a username that was never shared with changes nothing.
      tags: [sharing]
      parameters:
        - $ref: "#/components/parameters/PathUsername"
      responses:
        "204":
          description: No longer shared.
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/webhooks/github/{webhookToken}:
    post:
      operationId: receiveGitHubWebhook
      summary: Receive a GitHub repository webhook delivery
      description: |
        Triggers an immediate refresh for the user webhookToken identifies,
        once the request's `X-Hub-Signature-256` header is verified against
        that user's webhook secret. Every delivery GitHub can send for a
        repository webhook (a new pull request, a closed issue, a status or
        check-run update, even the `ping` event GitHub sends when the
        webhook is first created) means the same thing here — something
        changed, refresh — so nothing about the payload itself is parsed.
      tags: [webhooks]
      parameters:
        - $ref: "#/components/parameters/PathWebhookToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GitHub's own event payload — its shape isn't ours to describe, and nothing here reads it.
      responses:
        "204":
          description: Signature verified; a refresh was triggered.
        "401":
          description: The X-Hub-Signature-256 header was missing or didn't verify against this user's webhook secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user's webhook token matches webhookToken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/webhooks/forgejo/{webhookToken}:
    post:
      operationId: receiveForgejoWebhook
      summary: Receive a Forgejo repository webhook delivery
      description: |
        Triggers an immediate refresh for the user webhookToken identifies,
        once the request's signature header is verified against that
        user's webhook secret — `X-Forgejo-Signature` on a webhook set up
        with the "Forgejo" type, `X-Gitea-Signature` on one set up with the
        legacy "Gitea" type; both carry the same raw hex HMAC-SHA256. Every
        delivery means the same thing here — something changed, refresh —
        so nothing about the payload itself is parsed.
      tags: [webhooks]
      parameters:
        - $ref: "#/components/parameters/PathWebhookToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Forgejo's own event payload — its shape isn't ours to describe, and nothing here reads it.
      responses:
        "204":
          description: Signature verified; a refresh was triggered.
        "401":
          description: Both signature headers were missing, or neither verified against this user's webhook secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No user's webhook token matches webhookToken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    PathUsername:
      name: username
      in: path
      required: true
      schema:
        type: string

    PathWebhookToken:
      name: webhookToken
      in: path
      required: true
      schema:
        type: string

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: |
            The release tag this binary was built from, with no leading
            "v" — or "dev" for a build outside the release pipeline.
          examples: ["0.12.1", dev]

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    RegisterBeginRequest:
      type: object
      required: [username, displayName]
      properties:
        username:
          type: string
          examples: [ryan]
        displayName:
          type: string
          examples: [Ryan]

    LoginBeginRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          examples: [ryan]

    WebAuthnCeremonyOptions:
      type: object
      description: |
        The WebAuthn specification's own JSON shape for
        `PublicKeyCredentialCreationOptions`/`PublicKeyCredentialRequestOptions`
        (the begin responses) and `PublicKeyCredential`
        (the finish request bodies) — passed through to and from the
        browser's own `navigator.credentials` API untouched, so this
        contract intentionally doesn't re-model WebAuthn's own schema.
      additionalProperties: true

    SessionUser:
      type: object
      required: [username, displayName, isAdmin]
      properties:
        username:
          type: string
        displayName:
          type: string
        isAdmin:
          type: boolean

    AdminUser:
      type: object
      required: [username, displayName, isAdmin, createdAt]
      properties:
        username:
          type: string
        displayName:
          type: string
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time

    SharedUser:
      type: object
      required: [username, displayName]
      properties:
        username:
          type: string
        displayName:
          type: string

    SharingResponse:
      type: object
      required: [sharedWith, sharedWithMe]
      properties:
        sharedWith:
          type: array
          description: Users the signed-in user has shared their own dashboard with.
          items:
            $ref: "#/components/schemas/SharedUser"
        sharedWithMe:
          type: array
          description: Users who have shared their dashboard with the signed-in user.
          items:
            $ref: "#/components/schemas/SharedUser"

    SettingsResponse:
      type: object
      description: |
        The signed-in user's own GitHub/Forgejo configuration. Never
        includes a forge token's value — only whether one is currently
        saved, so the UI can show a "Configured" badge without the secret
        ever reaching the browser. webhookToken/webhookSecret are the
        exception: they're ours to hand back in the clear, since the user
        has to paste them into the forge's own webhook setup.
      required:
        [
          githubUsername,
          githubTokenSet,
          forgejoUrl,
          forgejoUsername,
          forgejoTokenSet,
          webhookToken,
          webhookSecret,
        ]
      properties:
        githubUsername:
          type: string
          description: Used as a token-free public-repos fallback when no GitHub token is set.
        githubTokenSet:
          type: boolean
          description: Whether a GitHub token is currently saved.
        forgejoUrl:
          type: string
        forgejoUsername:
          type: string
          description: Used as a token-free public-repos fallback when no Forgejo token is set.
        forgejoTokenSet:
          type: boolean
          description: Whether a Forgejo token is currently saved.
        webhookToken:
          type: string
          description: |
            Identifies this user in a webhook URL
            (`/api/webhooks/{provider}/{webhookToken}`). Generated on
            first visit to Settings and stable after that.
        webhookSecret:
          type: string
          description: |
            Pasted into the forge's own webhook "Secret" field, used to
            verify the signature header on incoming webhook deliveries
            (`X-Hub-Signature-256` on GitHub, `X-Forgejo-Signature` on
            Forgejo). Never appears in the webhook URL itself.

    SettingsRequest:
      type: object
      description: |
        Replaces the signed-in user's saved GitHub/Forgejo configuration.
        A blank `githubToken` or `forgejoToken` keeps whatever token is
        already saved for that forge rather than clearing it — this is
        the only way to update the username fields without having to
        resubmit a token you don't want to re-paste.
      properties:
        githubToken:
          type: string
        githubUsername:
          type: string
        forgejoUrl:
          type: string
        forgejoToken:
          type: string
        forgejoUsername:
          type: string

    WebhookEnsureRequest:
      type: object
      required: [forge, fullName]
      description: Which repo to create or fix up a webhook on.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          description: '"owner/repo", matching a Repo.fullName from GET /api/dashboard.'

    PullRequestActionRequest:
      type: object
      required: [forge, fullName, number]
      description: Which pull request to act on.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          description: '"owner/repo", matching a Repo.fullName from GET /api/dashboard.'
        number:
          type: integer
          description: Matching a PullRequest.number from GET /api/dashboard.

    Forge:
      type: string
      enum: [github, forgejo]

    CIStatus:
      type: string
      enum: [success, failure, pending, none]
      description: |
        The combined result across every check reported against the pull
        request's head commit. "none" means neither forge reported any
        check at all, not that one failed.

    MergeStatus:
      type: string
      enum: [mergeable, conflicting, blocked, unknown]
      description: |
        A pull request's mergeable/blocked state, as coarse as every forge
        this service talks to can agree on. "blocked" covers anything
        stopping a merge that isn't confirmed to be a real conflict —
        including Forgejo's own mergeable flag reporting false, since its
        server computes that asynchronously and can report it stale.
        "unknown" covers both a forge that hasn't determined this yet and
        this service being unable to determine it.

    Label:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          examples: [kind/bug]
        color:
          type: string
          description: |
            The label's colour as a hex string with no leading "#",
            exactly as the forge reports it.
          pattern: "^[0-9a-fA-F]{6}$"
          examples: [d73a4a]

    ForgeErrorKind:
      type: string
      enum:
        [unreachable, unauthorized, not_found, rate_limited, conflict, unknown]
      description: |
        Why a forge is unreachable, or why a write to it was rejected, as
        coarse as every forge this service talks to can agree on.
        "unauthorized" covers both a bad token and a forbidden request;
        "not_found" usually means a wrong instance URL. "conflict" is only
        ever returned from a pull-request write — the forge reports the PR
        itself isn't currently mergeable. "unknown" covers a signal this
        service doesn't recognize, rather than a guessed-at specific cause.

    ForgeHealth:
      type: object
      required: [forge, reachable, repoCount]
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        reachable:
          type: boolean
          description: Whether the last refresh attempt against this forge succeeded.
        error:
          type: string
          description: The last error, if reachable is false. Omitted when reachable.
        errorKind:
          $ref: "#/components/schemas/ForgeErrorKind"
        repoCount:
          type: integer
          minimum: 0
          description: Repositories with write access this forge reported.
        rateLimit:
          $ref: "#/components/schemas/RateLimit"

    RateLimit:
      type: object
      required: [limit, remaining, resetsAt]
      description: >-
        The forge API's own request budget for the credential the last
        refresh used. Only reported where the forge exposes one — GitHub
        does; Forgejo has no rate limiting of its own by default, so this
        is omitted there.
      properties:
        limit:
          type: integer
          minimum: 0
          description: Requests allowed per window.
        remaining:
          type: integer
          minimum: 0
          description: Requests left in the current window.
        resetsAt:
          type: string
          format: date-time
          description: When the window resets and remaining goes back to limit.

    PullRequest:
      type: object
      required:
        [
          forge,
          repo,
          number,
          title,
          url,
          author,
          draft,
          labels,
          createdAt,
          updatedAt,
          ci,
          mergeStatus,
          behind,
        ]
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        repo:
          type: string
          description: Owner-qualified repository name.
          examples: [alrayyes/hush-hush]
        number:
          type: integer
        title:
          type: string
        url:
          type: string
          format: uri
          description: The real pull request URL on its own forge.
        author:
          type: string
        draft:
          type: boolean
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        ci:
          $ref: "#/components/schemas/CIStatus"
        mergeStatus:
          $ref: "#/components/schemas/MergeStatus"
        behind:
          type: boolean
          description: |
            Whether this pull request's base branch has moved since its
            merge-base was computed. Deliberately its own field rather
            than a mergeStatus value: on Forgejo a pull request can be
            both mergeable and behind at once (its mergeable flag doesn't
            get recomputed just because the base moved), so folding this
            into mergeStatus would force picking one and losing the
            other.
        autoMergeEnabled:
          type: boolean
          description: |
            Whether auto-merge is currently scheduled on this pull request.
            Omitted when the owning forge has no way to report this at all
            (Forgejo, today) — never false in that case, since this service
            genuinely doesn't know.

    Issue:
      type: object
      required:
        [forge, repo, number, title, url, author, labels, createdAt, updatedAt]
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        repo:
          type: string
          examples: [alrayyes/hush-hush]
        number:
          type: integer
        title:
          type: string
        url:
          type: string
          format: uri
          description: The real issue URL on its own forge.
        author:
          type: string
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Label"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Dashboard:
      type: object
      required: [generatedAt, forges, pullRequests, issues, repos]
      properties:
        generatedAt:
          type: string
          format: date-time
          description: When this snapshot was refreshed, not when it was requested.
        forges:
          type: array
          items:
            $ref: "#/components/schemas/ForgeHealth"
        pullRequests:
          type: array
          items:
            $ref: "#/components/schemas/PullRequest"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        repos:
          type: array
          items:
            $ref: "#/components/schemas/RepoStatus"

    RepoStatus:
      type: object
      required: [forge, fullName, hasWebhook]
      description: |
        One tracked repository, whether or not it currently has anything
        open — repoCount alone can't name it, and it wouldn't otherwise
        appear anywhere pullRequests/issues don't already mention it.
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        fullName:
          type: string
          examples: [alrayyes/forge-dashboard]
        hasWebhook:
          type: boolean
          description: |
            Whether this app has ever recorded a signature-verified
            webhook delivery for this repo. Passive: it reflects a real
            delivery having arrived, not whether a webhook object exists
            on the forge — a correctly configured webhook that just
            hasn't fired yet still reads false here, the same as a
            misconfigured one would.

# The contract, and the only machine-readable description of it. Hand-written
# and committed rather than generated from handler annotations — the spec is
# reviewed as the design, and internal/api is written against it, not the
# other way round.
openapi: 3.1.0

info:
  title: forge-dashboard
  summary: A single-page view of open PRs, issues and CI status across GitHub and Forgejo.
  description: |
    Aggregates every repository the configured GitHub and Forgejo accounts
    have write access to into one read-only view: open pull requests (with
    CI status), open issues, and per-forge reachability. The backend holds
    both forges' credentials; the frontend only ever calls the endpoints
    below.
  version: 1.0.0
  contact:
    name: forge-dashboard
    url: https://github.com/alrayyes/forge-dashboard
  license:
    name: GPL-3.0
    identifier: GPL-3.0-only

servers:
  - url: "{scheme}://{host}"
    description: |
      No canonical host — this runs on a homelab reachable only over
      Tailscale, so the variables below are the shape of the answer rather
      than the answer.
    variables:
      scheme:
        default: https
        enum: [https, http]
      host:
        default: localhost:8080
        description: The default listen address. Set ADDR to change it.

security: []

tags:
  - name: health
    description: Liveness, for whatever supervises the process.
  - name: dashboard
    description: The aggregated view across both forges.
  - name: auth
    description: Passkey (WebAuthn) registration, login and session management.
  - name: settings
    description: The signed-in user's own GitHub/Forgejo credentials.

paths:
  /api/auth/register/begin:
    post:
      operationId: beginRegistration
      summary: Start a passkey registration ceremony
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBeginRequest"
      responses:
        "200":
          description: |
            WebAuthn credential creation options, passed straight to the
            browser's `navigator.credentials.create()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCeremonyOptions"
        "409":
          description: That username is already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/register/finish:
    post:
      operationId: finishRegistration
      summary: Complete a passkey registration ceremony
      tags: [auth]
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: |
          The raw response from `navigator.credentials.create()`, exactly as
          the browser produced it — forwarded to the server untouched.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCeremonyOptions"
      responses:
        "200":
          description: Registration succeeded; a session cookie is now set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          description: The ceremony failed verification, or had already expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login/begin:
    post:
      operationId: beginLogin
      summary: Start a passkey login ceremony
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBeginRequest"
      responses:
        "200":
          description: |
            WebAuthn credential request options, passed straight to the
            browser's `navigator.credentials.get()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCeremonyOptions"
        "404":
          description: No account is registered under that username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login/finish:
    post:
      operationId: finishLogin
      summary: Complete a passkey login ceremony
      tags: [auth]
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: |
          The raw response from `navigator.credentials.get()`, exactly as
          the browser produced it — forwarded to the server untouched.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCeremonyOptions"
      responses:
        "200":
          description: Login succeeded; a session cookie is now set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          description: The ceremony failed verification, or had already expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      responses:
        "204":
          description: Logged out; the session cookie is now cleared.

  /api/auth/session:
    get:
      operationId: getSession
      summary: Who, if anyone, the current session cookie belongs to
      tags: [auth]
      responses:
        "200":
          description: The current session's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/settings:
    get:
      operationId: getSettings
      summary: The signed-in user's own forge configuration
      description: |
        Tokens are never returned, before or after being saved — only
        whether one is currently on file. There is no way to read a saved
        token back out through this API.
      tags: [settings]
      responses:
        "200":
          description: The current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: putSettings
      summary: Save the signed-in user's forge configuration
      description: |
        Replaces every field except a blank token, which means "keep
        whatever's already saved" rather than "clear it" — the only
        sensible behavior for a field the browser is never shown the
        current value of. Saving triggers that user's dashboard to start
        refreshing from the new configuration.
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "400":
          description: The request body wasn't valid JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /healthz:
    get:
      operationId: health
      summary: Liveness
      description: |
        Answers 200 once the server has started. Doesn't reflect whether
        either forge is reachable — see forges[].reachable on the dashboard
        response for that.
      tags: [health]
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok

  /api/dashboard:
    get:
      operationId: getDashboard
      summary: The aggregated view
      description: |
        Returns the most recently fetched snapshot. The backend refreshes
        this on its own schedule in the background; this endpoint never
        blocks on a live call to either forge, so it answers instantly even
        when a forge is slow or unreachable.
      tags: [dashboard]
      responses:
        "200":
          description: The current snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    RegisterBeginRequest:
      type: object
      required: [username, displayName]
      properties:
        username:
          type: string
          examples: [ryan]
        displayName:
          type: string
          examples: [Ryan]

    LoginBeginRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          examples: [ryan]

    WebAuthnCeremonyOptions:
      type: object
      description: |
        The WebAuthn specification's own JSON shape for
        `PublicKeyCredentialCreationOptions`/`PublicKeyCredentialRequestOptions`
        (the begin responses) and `PublicKeyCredential`
        (the finish request bodies) — passed through to and from the
        browser's own `navigator.credentials` API untouched, so this
        contract intentionally doesn't re-model WebAuthn's own schema.
      additionalProperties: true

    SessionUser:
      type: object
      required: [username, displayName, isAdmin]
      properties:
        username:
          type: string
        displayName:
          type: string
        isAdmin:
          type: boolean

    SettingsResponse:
      type: object
      description: |
        The signed-in user's own GitHub/Forgejo configuration. Never
        includes a token's value — only whether one is currently saved,
        so the UI can show a "Configured" badge without the secret ever
        reaching the browser.
      required:
        [
          githubUsername,
          githubTokenSet,
          forgejoUrl,
          forgejoUsername,
          forgejoTokenSet,
        ]
      properties:
        githubUsername:
          type: string
          description: Used as a token-free public-repos fallback when no GitHub token is set.
        githubTokenSet:
          type: boolean
          description: Whether a GitHub token is currently saved.
        forgejoUrl:
          type: string
        forgejoUsername:
          type: string
          description: Used as a token-free public-repos fallback when no Forgejo token is set.
        forgejoTokenSet:
          type: boolean
          description: Whether a Forgejo token is currently saved.

    SettingsRequest:
      type: object
      description: |
        Replaces the signed-in user's saved GitHub/Forgejo configuration.
        A blank `githubToken` or `forgejoToken` keeps whatever token is
        already saved for that forge rather than clearing it — this is
        the only way to update the username fields without having to
        resubmit a token you don't want to re-paste.
      properties:
        githubToken:
          type: string
        githubUsername:
          type: string
        forgejoUrl:
          type: string
        forgejoToken:
          type: string
        forgejoUsername:
          type: string

    Forge:
      type: string
      enum: [github, forgejo]

    CIStatus:
      type: string
      enum: [success, failure, pending, none]
      description: |
        The combined result across every check reported against the pull
        request's head commit. "none" means neither forge reported any
        check at all, not that one failed.

    ForgeHealth:
      type: object
      required: [forge, reachable, repoCount]
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        reachable:
          type: boolean
          description: Whether the last refresh attempt against this forge succeeded.
        error:
          type: string
          description: The last error, if reachable is false. Omitted when reachable.
        repoCount:
          type: integer
          minimum: 0
          description: Repositories with write access this forge reported.

    PullRequest:
      type: object
      required:
        [
          forge,
          repo,
          number,
          title,
          url,
          author,
          draft,
          labels,
          createdAt,
          updatedAt,
          ci,
        ]
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        repo:
          type: string
          description: Owner-qualified repository name.
          examples: [alrayyes/hush-hush]
        number:
          type: integer
        title:
          type: string
        url:
          type: string
          format: uri
          description: The real pull request URL on its own forge.
        author:
          type: string
        draft:
          type: boolean
        labels:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        ci:
          $ref: "#/components/schemas/CIStatus"

    Issue:
      type: object
      required:
        [forge, repo, number, title, url, author, labels, createdAt, updatedAt]
      properties:
        forge:
          $ref: "#/components/schemas/Forge"
        repo:
          type: string
          examples: [alrayyes/hush-hush]
        number:
          type: integer
        title:
          type: string
        url:
          type: string
          format: uri
          description: The real issue URL on its own forge.
        author:
          type: string
        labels:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Dashboard:
      type: object
      required: [generatedAt, forges, pullRequests, issues]
      properties:
        generatedAt:
          type: string
          format: date-time
          description: When this snapshot was refreshed, not when it was requested.
        forges:
          type: array
          items:
            $ref: "#/components/schemas/ForgeHealth"
        pullRequests:
          type: array
          items:
            $ref: "#/components/schemas/PullRequest"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"

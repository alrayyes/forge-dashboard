# The contract, and the only machine-readable description of it. Hand-written
# and committed rather than generated from handler annotations — the spec is
# reviewed as the design, and internal/api is written against it, not the
# other way round.
openapi: 3.1.0

info:
  title: forge-dashboard
  summary: A single-page view of open PRs, issues and CI status across GitHub and Forgejo.
  description: |
    Aggregates every repository the configured GitHub and Forgejo accounts
    have write access to into one read-only view: open pull requests (with
    CI status), open issues, and per-forge reachability. The backend holds
    both forges' credentials; the frontend only ever calls the endpoints
    below.

    A request body is capped at 1 MiB, except the forges' own webhook
    deliveries (5 MiB). A body whose declared length is over the cap is
    answered `413` with an `Error` before it is read; one with no declared
    length is cut off at the cap and answered as an invalid body.
  version: 1.0.0
  contact:
    name: forge-dashboard
    url: https://github.com/alrayyes/forge-dashboard
  license:
    name: AGPL-3.0
    identifier: AGPL-3.0-only

servers:
  - url: "{scheme}://{host}"
    # For whoever runs their own copy: the audience is the API's consumers,
    # not this project's own staff.
    x-internal: false
    description: |
      No canonical host. The production instance runs on a homelab reachable
      only over Tailscale, so the variables below are the shape of the
      answer rather than the answer.
    variables:
      scheme:
        default: https
        enum: [https, http]
      host:
        default: localhost:8080
        description: The default listen address. Set ADDR to change it.

security: []

tags:
  - name: health
    description: Liveness, for whatever supervises the process.
  - name: dashboard
    description: The aggregated view across both forges.
  - name: auth
    description: |
      Passkey (WebAuthn) registration, login and session management.

      Every endpoint elsewhere in this API described as requiring "a
      valid session" accepts either of two credentials, checked in that
      order: the session cookie a passkey login sets, or an
      `Authorization: Bearer <token>` header carrying a personal API
      token from this tag's own token endpoints (see `bearerAuth` in
      `components.securitySchemes`) — a script can use the same API a
      signed-in browser does, with no WebAuthn ceremony of its own to
      perform. Their 401 response is identical either way: "no valid
      session cookie was presented" in an individual endpoint's own
      description below means neither credential was.
  - name: settings
    description: The signed-in user's own GitHub/Forgejo credentials.
  - name: webhooks
    description: |
      Where GitHub/Forgejo push repository events, for an immediate refresh
      instead of waiting on the next poll, and the one endpoint that
      creates or updates a webhook on the user's behalf. The two delivery
      endpoints aren't session-authenticated like everything else here —
      the path's token is the instance's webhook token, and the request's HMAC
      signature (computed with its webhook secret) is what proves
      it actually came from their forge; `POST /api/webhooks/ensure` is a
      normal session-authenticated endpoint like the rest of this API.
  - name: pull-requests
    description: |
      Actions against a pull request already listed on the dashboard,
      taken on the signed-in user's own behalf.
  - name: queued-actions
    description: |
      Safe actions (Update branch, Dependabot and Renovate rebase) queued to
      run when a rate-limited forge resets. Per user, stored on the
      server, so they survive a reload and a restart.
  - name: tokens
    description: |
      Personal API tokens — a Bearer credential a script can use instead
      of a browser's passkey session cookie. See the `auth` tag's own
      description for how a token authenticates once generated here.

paths:
  /api/auth/registration-status:
    get:
      operationId: getRegistrationStatus
      x-mcp-excluded: "Pre-login: reports whether self-registration is open. An MCP client already has a token."
      summary: Whether self-registration is open
      description: |
        Unauthenticated — a visitor deciding whether to show the login
        page's own "Register a new passkey instead" button has no session
        yet by definition. `open` is true only on a fresh instance with
        zero registered users; once any account holds a passkey,
        registration is closed for good. More passkeys for that account are
        added from Settings.
      tags: [auth]
      responses:
        "200":
          description: The current registration status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStatus"

  /api/auth/register/begin:
    post:
      operationId: beginRegistration
      x-mcp-excluded: "A WebAuthn ceremony that needs a browser authenticator; a token cannot take part."
      summary: Start a passkey registration ceremony
      description: |
        An instance has one user. The first registration on a fresh
        instance (see GET /api/auth/registration-status) creates that
        user. Once any account holds a passkey, this answers 403 whatever
        username it carries.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBeginRequest"
      responses:
        "200":
          description: |
            WebAuthn credential creation options, passed straight to the
            browser's `navigator.credentials.create()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCeremonyOptions"
        "403":
          description: |
            Registration is closed: an account already holds a passkey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/register/finish:
    post:
      operationId: finishRegistration
      x-mcp-excluded: "The second half of the WebAuthn registration ceremony."
      summary: Complete a passkey registration ceremony
      tags: [auth]
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: |
          The raw response from `navigator.credentials.create()`, exactly as
          the browser produced it — forwarded to the server untouched.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCeremonyOptions"
      responses:
        "200":
          description: Registration succeeded; a session cookie is now set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          description: The ceremony failed verification, or had already expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            Registration is closed: another registration on this empty
            instance finished first and holds the instance's only passkey.
            The pending account of this ceremony is removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login/begin:
    post:
      operationId: beginLogin
      x-mcp-excluded: "A WebAuthn ceremony that needs a browser authenticator."
      summary: Start a passkey login ceremony
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBeginRequest"
      responses:
        "200":
          description: |
            WebAuthn credential request options, passed straight to the
            browser's `navigator.credentials.get()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCeremonyOptions"
        "404":
          description: No account is registered under that username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login/finish:
    post:
      operationId: finishLogin
      x-mcp-excluded: "The second half of the WebAuthn login ceremony."
      summary: Complete a passkey login ceremony
      tags: [auth]
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: |
          The raw response from `navigator.credentials.get()`, exactly as
          the browser produced it — forwarded to the server untouched.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCeremonyOptions"
      responses:
        "200":
          description: Login succeeded; a session cookie is now set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          description: The ceremony failed verification, or had already expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/logout:
    post:
      operationId: logout
      x-mcp-excluded: "Ends a browser session; an MCP client's token is not that session."
      summary: End the current session
      tags: [auth]
      responses:
        "204":
          description: Logged out; the session cookie is now cleared.

  /api/auth/session:
    get:
      operationId: getSession
      summary: Who, if anyone, the current session cookie belongs to
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The current session's user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/credentials:
    get:
      operationId: listCredentials
      summary: List the signed-in user's own passkeys
      description: |
        Every passkey on the account, oldest first — not just the
        one used to establish the current session.
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Every registered passkey.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credential"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/credentials/begin:
    post:
      operationId: beginAddCredential
      x-mcp-excluded: "A WebAuthn ceremony that needs a browser authenticator."
      summary: Start a ceremony to add another passkey to the signed-in account
      description: |
        The authenticated counterpart to POST /api/auth/register/begin —
        that one only ever works for a brand-new, credential-less
        account; this is how an already-registered user adds a second
        (or third...) passkey, e.g. a laptop and a security key.
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: |
            WebAuthn credential creation options, passed straight to the
            browser's `navigator.credentials.create()`. `excludeCredentials`
            already lists every passkey the account has, so re-registering
            the same authenticator is refused by the browser itself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCeremonyOptions"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/credentials/finish:
    post:
      operationId: finishAddCredential
      x-mcp-excluded: "The second half of adding a passkey."
      summary: Complete an add-credential ceremony
      tags: [auth]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: label
          in: query
          required: true
          description: |
            A name the user recognizes, e.g. "MacBook" or "YubiKey",
            prompted for at registration time, never derived
            from the authenticator itself.
          schema:
            type: string
      requestBody:
        required: true
        description: |
          The raw response from `navigator.credentials.create()`, exactly as
          the browser produced it — forwarded to the server untouched.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCeremonyOptions"
      responses:
        "201":
          description: The new passkey is now registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          description: label was blank, or the ceremony failed verification, or had already expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/credentials/{id}:
    delete:
      operationId: deleteCredential
      summary: Remove one of the signed-in user's own passkeys
      description: |
        Refused on the account's last remaining passkey — this
        app is WebAuthn-only with no password fallback, so deleting it
        would lock the account out entirely.
      tags: [auth]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed.
        "400":
          description: This is the account's last remaining passkey.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/settings:
    get:
      operationId: getSettings
      x-mcp-excluded: "It provisions webhook credentials on first read and returns them. The get_settings tool returns GET /api/settings/summary instead."
      summary: The signed-in user's own forge configuration
      description: |
        Forge tokens are never returned, only whether one is set. The
        webhook token and secret are returned, since the user pastes them
        into the forge's webhook setup, and a first read creates them. For
        a read that creates nothing and omits both, see
        `GET /api/settings/summary`.
      tags: [settings]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: putSettings
      summary: Save the signed-in user's forge configuration
      description: |
        Replaces every field except a blank token, which means "keep
        whatever's already saved" rather than "clear it" — the only
        sensible behavior for a field the browser is never shown the
        current value of. Saving triggers that user's dashboard to start
        refreshing from the new configuration.
      tags: [settings]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "400":
          description: |
            The request body wasn't valid JSON, or a Forgejo token/username
            was set with no Forgejo URL — a combination the dashboard can't
            use, since the URL is what a token or username connects to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/settings/summary:
    get:
      operationId: getSettingsSummary
      summary: The signed-in user's settings, read without side effects
      description: |
        The same data as `GET /api/settings`, minus the webhook token and
        secret, plus `webhookConfigured`. It never provisions webhook
        credentials: for a user who has none yet it answers
        `webhookConfigured: false` and creates nothing. Forge tokens are
        never returned, only whether one is set. It returns exactly what
        the `get_settings` MCP tool returns.
      tags: [settings]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The current settings, without any secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsSummary"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/settings/theme:
    get:
      operationId: getTheme
      summary: The signed-in user's own saved theme preference
      description: |
        A lightweight, side-effect-free read of one field — theme — for
        every page to check on load. Deliberately not
        GET /api/settings itself: that handler also provisions webhook
        credentials on first call (EnsureWebhookCredentials), which
        every page loading shouldn't trigger for a user who's never
        opened Settings at all.
      tags: [settings]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The current value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeResponse"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: setTheme
      summary: Save the signed-in user's own theme preference
      description: |
        A dedicated, instant save — deliberately not routed
        through the main PUT /api/settings, whose every other field is
        a plain replace rather than a per-field merge: a request
        carrying only theme through that handler would blank every
        other saved setting. Picking a theme applies immediately, the
        same "set once and forget" convention the ticket's own research
        cites, rather than waiting on the rest of the settings form's
        own Save button.
      tags: [settings]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeRequest"
      responses:
        "200":
          description: The saved value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeResponse"
        "400":
          description: theme wasn't "", "light", or "dark".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/settings/timezone:
    get:
      operationId: getTimezone
      summary: The signed-in user's own saved time zone
      description: |
        A lightweight, side-effect-free read of one field, for every page to
        check on load so it can show times in the user's zone. Deliberately
        not GET /api/settings, for the reason GET /api/settings/theme isn't.
        Empty means "use the browser's own zone".
      tags: [settings]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The current value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimezoneResponse"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: setTimezone
      summary: Save the signed-in user's own time zone
      description: |
        A dedicated, instant save, not routed through PUT /api/settings,
        which replaces every other field. Exists for browsers that report
        UTC to every page, such as Firefox with fingerprint resistance.
      tags: [settings]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimezoneRequest"
      responses:
        "200":
          description: The saved value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimezoneResponse"
        "400":
          description: timezone wasn't empty or an IANA zone name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/settings/filter-state:
    get:
      operationId: getFilterState
      x-mcp-excluded: "Cookie-session only: the spec refuses a personal API token with 403, so an MCP client cannot call it."
      summary: The signed-in user's own saved dashboard/Insights filter state
      description: |
        A lightweight read of one opaque blob, deliberately not
        GET /api/settings itself for the same reason GET /api/settings/theme
        isn't either: this loads on every dashboard/Insights visit and
        shouldn't provision webhook credentials as a side effect.
        `{}` for a user who's never saved any filters yet, not a 404.
        These are the web UI's own state: a signed-in browser session only,
        and a personal API token is refused with 403.
      tags: [settings]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: The saved state, or `{}` if none has ever been saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterState"
        "403":
          description: A personal API token was presented. This endpoint is for a browser session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: setFilterState
      x-mcp-excluded: "Cookie-session only: the spec refuses a personal API token with 403, so an MCP client cannot call it."
      summary: Save the signed-in user's own dashboard/Insights filter state
      description: |
        A dedicated, lightweight save separate from the main
        PUT /api/settings — filters change on nearly every click, a
        mismatch for that endpoint's "always a full form submit"
        convention. The body replaces the saved state entirely,
        the same "always a full submit, just of a much smaller and
        much more frequent thing" shape as the main settings PUT, not a
        partial patch. Filters.js's own client-side code decides when
        to call this: immediately for a discrete control, debounced
        while the user is still typing in the free-text Title filter.
        A signed-in browser session only: a personal API token is refused
        with 403, so a script or agent can't change the filters the user
        sees. Each save is logged with the user agent.
      tags: [settings]
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilterState"
      responses:
        "204":
          description: Saved.
        "400":
          description: The request body wasn't valid JSON, exceeded the size this endpoint accepts, or its `shared.label` held more than 20 labels, more than 1000 characters, or a control character other than the newline between labels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: A personal API token was presented. This endpoint is for a browser session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tokens:
    get:
      operationId: listAPITokens
      x-mcp-excluded: "A token must not enumerate, mint or revoke tokens: one leaked token would otherwise keep itself alive by minting others."
      summary: List the signed-in user's own personal API tokens
      description: Metadata only, per APIToken's own description — a raw value never reappears once created.
      tags: [tokens]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Every live token, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIToken"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createAPIToken
      x-mcp-excluded: "A token must not mint tokens (see listAPITokens)."
      summary: Generate a new personal API token
      tags: [tokens]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APITokenCreateRequest"
      responses:
        "201":
          description: Created — the only response that ever carries the raw token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APITokenCreateResponse"
        "400":
          description: |
            The request body wasn't valid JSON, label was blank, or
            expiresAt wasn't in the future or was more than 366 days out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/tokens/{id}:
    delete:
      operationId: deleteAPIToken
      x-mcp-excluded: "A token must not revoke tokens (see listAPITokens)."
      summary: Revoke a personal API token
      description: |
        Stops the token authenticating immediately. Idempotent — deleting
        an id that's already gone (or never belonged to the signed-in
        user) still answers 204, the same as any other delete-by-id
        endpoint here, so a double-click or a retried request isn't an
        error.
      tags: [tokens]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathTokenID"
      responses:
        "204":
          description: Revoked (or already gone).
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/webhooks/ensure:
    post:
      operationId: ensureWebhook
      summary: Create or fix up a webhook on one tracked repo, on the signed-in user's behalf
      description: |
        Creates a webhook on the named repo, pointed at the signed-in
        user's own webhook URL and secret, subscribed to the events
        docs/webhooks.md's manual steps recommend. If one already exists
        there (found the same way GET /api/dashboard's own `hasWebhook`
        does — matching by URL path, not object identity) it's brought
        back to active with the right events instead of creating a
        duplicate.

        One of a small number of endpoints in this API that write to a
        forge rather than just reading from it — see also the
        pull-requests tag.

        A refusal from the forge (403, 404, 429 and 502) answers with the
        same `ActionError` a refused pull request action does, so a client
        reads one shape: `code` is `permission` or `rate_limited` where
        the forge said so (with `resetsAt` for a rate limit), and
        `unknown` otherwise, with a plain `message` either way. No new
        code is needed: a repo the forge can't find is `unknown` with its
        own message. 400 and 401 stay a plain `Error`, since they are
        about the request, not a refusal by the forge.
      tags: [webhooks]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEnsureRequest"
      responses:
        "204":
          description: The webhook now exists and is correctly configured.
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", no credentials are saved for that forge, or
            that forge's client doesn't support managing webhooks at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover managing webhooks, or it isn't an admin on that repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "404":
          description: The forge reported the repo itself doesn't exist (or isn't visible to this token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "429":
          description: The forge rate-limited the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"

  /api/repos/ignore:
    post:
      operationId: ignoreRepo
      summary: Hide one tracked repo's pull requests, issues, or both from the dashboard and Insights
      description: |
        Reversible, not destructive: the repo itself keeps
        appearing in GET /api/dashboard's `repos` array with accurate
        webhook-coverage status, and keeps being fetched and counted —
        only the pullRequests and/or issues entries the request scopes
        stop appearing there and on Insights. A repeat call
        replaces the previously saved scope rather than merging with it
        (ignoring PRs only, then issues only, ends with only issues
        ignored) — idempotent for an identical repeat, not additive
        across different scopes.
      tags: [dashboard]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoIgnoreRequest"
      responses:
        "204":
          description: The repo is now ignored in the requested scope (or already was).
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", or both `prs` and `issues` were false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/repos/unignore:
    post:
      operationId: unignoreRepo
      summary: Stop ignoring one tracked repo
      description: |
        The reverse of POST /api/repos/ignore. Idempotent: un-ignoring a
        repo that was never ignored is a no-op, not an error.
      tags: [dashboard]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEnsureRequest"
      responses:
        "204":
          description: The repo is no longer ignored (or never was).
        "400":
          description: The request body wasn't valid JSON, or `fullName` wasn't "owner/repo".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/repos/auto-update-branch/enable:
    post:
      operationId: enableAutoUpdateBranch
      summary: Turn on automatic branch updates for one tracked repo
      description: |
        Any of this repo's pull requests the background refresh finds
        behind its base branch gets updated automatically from then on, the same as clicking
        "Update branch" would, except that a Dependabot pull request gets
        its rebase comment and a Renovate one its rebase label instead, and
        a release-please pull request is skipped. Idempotent: enabling an already-enabled repo
        is a no-op, not an error.
      tags: [dashboard]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEnsureRequest"
      responses:
        "204":
          description: Auto-update-branch is now on for this repo (or already was).
        "400":
          description: The request body wasn't valid JSON, or `fullName` wasn't "owner/repo".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/repos/auto-update-branch/disable:
    post:
      operationId: disableAutoUpdateBranch
      summary: Turn off automatic branch updates for one tracked repo
      description: |
        The reverse of POST /api/repos/auto-update-branch/enable.
        Idempotent: disabling a repo that was never enabled is a no-op,
        not an error.
      tags: [dashboard]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEnsureRequest"
      responses:
        "204":
          description: Auto-update-branch is now off for this repo (or never was on).
        "400":
          description: The request body wasn't valid JSON, or `fullName` wasn't "owner/repo".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/pull-requests/merge:
    post:
      operationId: mergePullRequest
      summary: Merge one pull request, on the signed-in user's behalf
      description: |
        Merges the named pull request using its repo's own configured
        default merge method — GitHub is asked to pick its own repo
        default, except that a base branch requiring linear history gets
        squash or rebase, never a merge commit; Forgejo's API has no such default built in, so this
        looks up the repo's configured default merge style first and
        passes that explicitly. Neither takes a method override here;
        picking one is out of scope for this endpoint.

        When the forge refuses the merge, the server re-reads the pull
        request's real current state and answers an `ActionError`: a `code`
        from a fixed set plus a short `message` safe to show a person, so
        every client gets the same reason without parsing forge text. A
        pull request that is already merged or closed answers
        `already_merged` / `already_closed`. If the re-read itself fails,
        the original forge error is returned with `code: unknown`.

        An empty pull request, whose branch is already on the target, has no
        `merge` in `allowedActions`. A Merge posted for one anyway
        gets 409 `already_up_to_date` from this server, which never asks the
        forge.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestActionRequest"
      responses:
        "204":
          description: Merged.
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", no credentials are saved for that forge, or
            that forge's client doesn't support merging pull requests at
            all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover merging, or it isn't allowed to merge on that repo. `code` is `permission`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "404":
          description: The forge reported the repo or pull request doesn't exist (or isn't visible to this token). `code` is `unknown`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "409":
          description: |
            The merge was refused, by this server or by the forge, and the
            pull request's state says why. When the pull request is on the
            signed-in user's board and its `allowedActions` entry for
            `merge` is blocked, this server answers with that entry's `code`
            and `message` and never asks the forge. Otherwise the forge
            refused and the re-read says why. `code` is one of
            `already_merged`, `already_closed`, `not_mergeable`, `conflict`,
            `behind`, `checks_pending`, `checks_failing`,
            `blocked_by_protection` or `stacked`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "429":
          description: The forge rate-limited the request. `code` is `rate_limited`; `resetsAt` carries when the budget comes back, when the forge said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify, or the follow-up re-read failed. `code` is `unknown`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"

  /api/pull-requests/auto-merge:
    post:
      operationId: enablePullRequestAutoMerge
      summary: Arm auto-merge on a pull request, on the signed-in user's behalf
      description: |
        Forgejo: this app keeps the intent itself and merges the pull
        request from its background pass once its checks pass (Forgejo's
        own scheduled merge has no way to read its state back). Nothing is
        sent to the forge now. The intent is stored per signed-in user and
        pull request, and the pull request then reports
        `autoMergeEnabled: true` and offers `cancel_auto_merge`. A repeat
        call is a 204. Only a pull request the user armed here is ever
        merged this way.

        GitHub: enables the named pull request's own
        auto-merge via GitHub's `enablePullRequestAutoMerge` GraphQL
        mutation — REST has no equivalent endpoint. Unlike Merge, that
        mutation asks for an explicit merge method rather than picking
        the repo's own default itself, so this looks the repo's allowed
        methods up first and picks one with the same merge > squash >
        rebase precedence Merge already uses, skipping merge when the
        default branch requires linear history; no override is exposed
        here either. The pull request stays open and unmerged until the
        forge's own required checks pass on their own.

        When the forge refuses, the server re-reads the pull request and
        answers an `ActionError` (see Merge): `already_merged` or
        `already_closed` when the row was stale, otherwise a `code` and a
        plain-words `message` safe to show a person.

        When the pull request is on the signed-in user's board and its
        `allowedActions` has no `auto_merge` entry, this server answers 409
        itself and never asks the forge: `auto_merge_not_allowed`,
        `already_up_to_date`, `conflict`, `stacked` or `ready_to_merge` for
        the reasons the board already knows, and `not_mergeable` for
        auto-merge already on or a forge that has none.
        `auto_merge_not_allowed` means the repo doesn't allow auto-merge
        (or not for this pull request); `ready_to_merge` means it is
        already clean, so there is nothing to wait for and Merge is the
        action; `checks_pending` means a non-required check is still
        running, so trying again later can work.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestActionRequest"
      responses:
        "204":
          description: Auto-merge armed.
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", no credentials are saved for that forge, or
            that forge's client doesn't support enabling auto-merge on
            pull requests at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover this, or the repo doesn't allow auto-merge to be armed at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "404":
          description: The forge reported the repo or pull request doesn't exist (or isn't visible to this token). `code` is `unknown`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "429":
          description: The forge rate-limited the request. `code` is `rate_limited`; `resetsAt` carries when the budget comes back, when the forge said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically — including the repo rejecting auto-merge for a reason this app has no more specific status for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"

  /api/pull-requests/auto-merge/cancel:
    post:
      operationId: cancelPullRequestAutoMerge
      summary: Cancel auto-merge on a pull request, on the signed-in user's behalf
      description: |
        Forgejo: removes the intent stored by `POST /api/pull-requests/auto-merge`,
        so the background pass never merges the pull request. Nothing is sent
        to the forge. Idempotent: a pull request with no intent is a 204 too.

        GitHub: turns the pull request's own auto-merge off with GitHub's
        `disablePullRequestAutoMerge` GraphQL mutation. Only a pull request
        whose `allowedActions` has a `cancel_auto_merge` entry; otherwise this
        server answers 409 itself and never asks GitHub. A refusal from
        GitHub is an `ActionError`, as for arming.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestActionRequest"
      responses:
        "204":
          description: Auto-merge is off for this pull request.
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", the forge is unknown, no credentials are saved for
            it, or its client can't cancel auto-merge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: GitHub only. The pull request has no auto-merge armed, so there is nothing to cancel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "502":
          description: GitHub was unreachable or refused the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"

  /api/pull-requests/close:
    post:
      operationId: closePullRequest
      summary: Close one pull request without merging it, on the signed-in user's behalf
      description: |
        Closes the named pull request — for one that turns out not to
        need merging at all (a duplicate, or one whose content already
        landed another way), not a substitute for Merge.

        When the forge refuses, the server re-reads the pull request and
        answers an `ActionError` (see Merge): `already_merged` or
        `already_closed` when the row was stale, otherwise a `code` and a
        plain-words `message` safe to show a person.
        Closing a merged pull request is `already_merged`. Closing one
        that is already closed on Forgejo is not refused, because Forgejo
        treats it as done, so that call succeeds and there is no
        `already_closed` answer for it.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestActionRequest"
      responses:
        "204":
          description: Closed.
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", no credentials are saved for that forge, or
            that forge's client doesn't support closing pull requests at
            all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover closing, or it isn't allowed to close on that repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "404":
          description: The forge reported the repo or pull request doesn't exist (or isn't visible to this token). `code` is `unknown`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "429":
          description: The forge rate-limited the request. `code` is `rate_limited`; `resetsAt` carries when the budget comes back, when the forge said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"

  /api/pull-requests/reopen:
    post:
      operationId: reopenPullRequest
      summary: Reopen one pull request that was closed without merging, on the signed-in user's behalf
      description: |
        Reopens the named pull request: the undo for Close, offered in the
        pull request's dialog right after a close. It does not offer a
        reopen for a merged pull request, because the forge doesn't allow
        one.

        A closed pull request is not on the board, so no `allowedActions`
        entry says in advance whether the forge will accept this. The call
        is made and the forge decides. When it refuses, the server re-reads
        the pull request and answers an `ActionError` (see Merge):
        `already_merged` when it was merged in the meantime, and
        `not_reopenable` when it is still closed and the forge won't
        reopen it, usually because its branch was deleted or rewritten
        after the close. Both are a 409 with a plain-words `message` that
        says what to do next.

        On success the pull request is listed on the board again from the
        next refresh.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestActionRequest"
      responses:
        "204":
          description: Reopened.
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", no credentials are saved for that forge, or
            that forge's client doesn't support reopening pull requests at
            all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover reopening, or it isn't allowed to reopen on that repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "404":
          description: The forge reported the repo or pull request doesn't exist (or isn't visible to this token). `code` is `unknown`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "409":
          description: The forge won't reopen it. `code` is `already_merged` or `not_reopenable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "429":
          description: The forge rate-limited the request. `code` is `rate_limited`; `resetsAt` carries when the budget comes back, when the forge said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"

  /api/pull-requests/rerun-checks:
    post:
      operationId: rerunPullRequestChecks
      summary: Rerun only the failed jobs of one pull request's checks, on the signed-in user's behalf
      description: |
        Asks the forge to rerun the failed jobs of the Actions workflow
        runs on the pull request's head commit, and nothing that passed. It
        answers once the forge has queued them, not when they finish, so a
        client shows a queued state and lets the next refresh carry the
        result.

        A pull request offers it as a `rerun_checks` entry in
        `allowedActions`, on GitHub and Forgejo, when its CI is failing. A
        Forgejo commit status doesn't say which workflow run it came from, so
        Forgejo's runs are found by the head commit instead. A failed check
        that isn't an Actions job (a third-party check, a legacy status, an
        external CI) can't be rerun here and is skipped. A Forgejo instance
        too old to have the rerun route refuses with its own words.

        Refusals are an `ActionError` (see Merge). `not_mergeable` with a 409
        means the pull request has no failed check to rerun. Anything the
        forge refuses (the token may not write to Actions, the run is too
        old or already running) arrives with its own plain-words `message`.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestActionRequest"
      responses:
        "204":
          description: The failed jobs were queued to rerun.
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", no credentials are saved for that forge, or that
            forge's client doesn't support rerunning checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized. The saved token can't write to Actions on that repo. `code` is `permission`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "404":
          description: The forge reported the repo or pull request doesn't exist (or isn't visible to this token). `code` is `unknown`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "409":
          description: There is no failed Actions job to rerun ("no failed job to rerun"), or the pull request was already merged or closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "429":
          description: The forge rate-limited the request. `code` is `rate_limited`; `resetsAt` carries when the budget comes back, when the forge said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"

  /api/pull-requests/hide:
    post:
      operationId: hidePullRequest
      summary: Hide one pull request from the signed-in user's dashboard
      description: |
        Reversible, not destructive, like ignoring a repo: nothing is sent to
        the forge. A hidden pull request leaves `pullRequests` in
        GET /api/dashboard and everything counted from it, and is counted in
        `hiddenPullRequests` instead. It stays listed for
        `includeHidden=true`, marked `hidden`, so a client can offer a Restore.

        With `days`, the hide ends by itself that many days from now. Without
        it the pull request stays hidden until `POST /api/pull-requests/unhide`.
        A repeat call replaces the earlier choice (hide until restored, then
        hide for 7 days, ends with the 7 days). The server forgets the record
        once the pull request is no longer open, so the list never grows
        without end. The pull request need not be on the board yet: hiding
        one the user can't see is still a 204.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestHideRequest"
      responses:
        "204":
          description: The pull request is hidden (or already was).
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", `number` wasn't positive, or `days` was outside
            1 to 365.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/pull-requests/auto-update:
    post:
      operationId: setPullRequestAutoUpdate
      summary: Turn the automatic branch update on or off for one pull request
      description: |
        A pure local write: nothing is sent to the forge. The choice is kept
        only while it differs from the repo's auto-update setting
        (`/api/repos/auto-update-branch/enable`), so a choice that matches
        the repo is dropped and the pull request follows the repo again, and
        a later change to the repo's setting reaches it. With `enabled`
        `null` or absent the pull request goes back to its repo's setting.
        Idempotent. A draft and a release-please pull request are never
        updated automatically, whatever is chosen: `autoUpdate.unavailable`
        in GET /api/dashboard says so. The server forgets the choice once
        the pull request is no longer open, its repo is no longer tracked, or
        the repo's setting changes to match it. A pull request the dashboard
        doesn't hold is a 404.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestAutoUpdateRequest"
      responses:
        "204":
          description: The choice is saved (or dropped).
        "400":
          description: |
            The request body wasn't valid JSON, `forge` wasn't a known forge,
            `fullName` wasn't "owner/repo", or `number` wasn't positive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The dashboard doesn't hold that pull request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/pull-requests/unhide:
    post:
      operationId: unhidePullRequest
      summary: Bring a hidden pull request back onto the signed-in user's dashboard
      description: |
        The reverse of POST /api/pull-requests/hide. Idempotent: restoring a
        pull request that isn't hidden is a 204 too.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestActionRequest"
      responses:
        "204":
          description: The pull request is no longer hidden.
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", or `number` wasn't positive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/pull-requests/update-branch:
    post:
      operationId: updatePullRequestBranch
      summary: Bring one pull request's branch up to date with its base, on the signed-in user's behalf
      description: |
        Merges the named pull request's base branch into its own head
        branch. GitHub can schedule this as a background job rather than
        finishing it inline — a 202 here means exactly that, not a
        failure; a follow-up refresh a moment later reflects the result.
        Forgejo's equivalent is always synchronous, so it only ever
        answers 204.

        When the forge refuses, the server re-reads the pull request and
        answers an `ActionError` (see Merge): `already_merged` or
        `already_closed` when the row was stale, otherwise a `code` and a
        plain-words `message` safe to show a person.
        `conflict` means the branches can't be merged cleanly;
        `already_up_to_date` means there was nothing to bring in.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestActionRequest"
      responses:
        "204":
          description: Updated.
        "202":
          description: The forge scheduled the update as a background job rather than finishing it inline. Not a failure — a follow-up refresh reflects the result once it lands.
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", no credentials are saved for that forge, or
            that forge's client doesn't support updating pull request
            branches at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover updating the branch, or it isn't allowed to push on that repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "404":
          description: The forge reported the repo or pull request doesn't exist (or isn't visible to this token). `code` is `unknown`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "409":
          description: |
            The update was refused. When the pull request is on the
            signed-in user's board and its `allowedActions` has no
            `update_branch` entry, or a blocked one, this server answers
            without asking the forge: the blocked entry's `code` and
            `message`, or `already_up_to_date` for a pull request that is not
            behind, or `not_mergeable` for one that updates through its
            bot's own rebase. Otherwise the forge rejected the update
            because the branches can't be merged cleanly: a real conflict
            updating would need to resolve by hand.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "429":
          description: The forge rate-limited the request. `code` is `rate_limited`; `resetsAt` carries when the budget comes back, when the forge said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"

  /api/pull-requests/dependabot-action:
    post:
      operationId: postPullRequestDependabotAction
      summary: Post one of Dependabot's own documented PR-comment commands on a pull request, on the signed-in user's behalf
      description: |
        Posts exactly `@dependabot rebase` or `@dependabot recreate` as a
        comment on the named pull request — Dependabot's own documented
        comment-command interface, not a generic "post any comment"
        endpoint; `action` is validated server-side to one of the two
        values below and nothing else is ever sent. GitHub only —
        Dependabot doesn't run on Forgejo.

        When the forge refuses, the server re-reads the pull request and
        answers an `ActionError` (see Merge): `already_merged` or
        `already_closed` when the row was stale, otherwise a `code` and a
        plain-words `message` safe to show a person.
        A connected App with no personal token saved is `permission`, with
        the reason in `message`; nothing is posted.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestDependabotActionRequest"
      responses:
        "204":
          description: |
            Comment posted. The request is recorded as `botRequest` on the
            pull request in the next snapshot.
        "400":
          description: |
            The request body wasn't valid JSON, `action` wasn't "rebase"
            or "recreate", `fullName` wasn't "owner/repo", no credentials
            are saved for that forge, or that forge's client doesn't
            support commenting on pull requests at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover commenting, or it isn't allowed to comment on that repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "404":
          description: The forge reported the repo or pull request doesn't exist (or isn't visible to this token). `code` is `unknown`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "409":
          description: |
            Either the forge rejected the comment because of the pull
            request's current state, or Dependabot would refuse it:
            the connected GitHub credential is an App with no personal
            access token saved, and Dependabot ignores App accounts. The
            error text is ForgeHealth.dependabotCommandsBlocked in the
            second case. A third case: the pull request is on the
            signed-in user's board and its `allowedActions` has no
            `dependabot_rebase` or `dependabot_recreate` entry (it isn't a
            Dependabot pull request on GitHub), so this server refuses with
            `not_mergeable` and never asks the forge. Nothing was posted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "429":
          description: The forge rate-limited the request. `code` is `rate_limited`; `resetsAt` carries when the budget comes back, when the forge said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"

  /api/pull-requests/renovate-rebase:
    post:
      operationId: postPullRequestRenovateRebase
      summary: Trigger Renovate's own rebase/retry on a pull request, on the signed-in user's behalf
      description: |
        Ticks the `rebase-check` checkbox in the named pull request's
        body (`- [ ] <!-- rebase-check -->...` becomes `- [x] ...`, and
        nothing else in the body changes) — Renovate's own documented
        rebase/retry trigger, which every Renovate pull request carries
        and which needs no setup. Renovate doesn't read comments as
        commands. When the body has no such checkbox, falls back to
        adding the signed-in user's own configured Renovate rebase label
        (Settings' "Renovate rebase label" field, defaulting to
        Renovate's own `rebase` if left blank). Works on both GitHub
        and Forgejo, unlike the Dependabot actions, since Renovate runs
        on both.

        A checkbox that is already ticked is not edited again: the
        answer is a 409 `ActionError` with `code: already_requested`.

        When the forge refuses, the server re-reads the pull request and
        answers an `ActionError` (see Merge): `already_merged` or
        `already_closed` when the row was stale, otherwise a `code` and a
        plain-words `message` safe to show a person.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullRequestActionRequest"
      responses:
        "204":
          description: |
            Checkbox ticked, or label added when the body had no checkbox.
            The request is recorded as `botRequest` on the pull request in
            the next snapshot.
        "400":
          description: |
            The request body wasn't valid JSON, `fullName` wasn't
            "owner/repo", no credentials are saved for that forge, or
            that forge's client doesn't support labeling pull requests
            at all.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover labeling, or it isn't allowed to label on that repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "404":
          description: The forge reported the repo or pull request doesn't exist, or (Forgejo only) the configured label doesn't exist on that repo — Forgejo's labels API takes an existing label's ID, not an arbitrary name, so it has to already be there.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "409":
          description: |
            The pull request is on the signed-in user's board and its
            `allowedActions` has no `renovate_rebase` entry (it isn't a
            Renovate pull request), so this server refuses with
            `not_mergeable` and never asks the forge. Nothing was changed.
            Also `already_requested` when the body's rebase checkbox is
            already ticked: the rebase is queued, and nothing was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "429":
          description: The forge rate-limited the request. `code` is `rate_limited`; `resetsAt` carries when the budget comes back, when the forge said.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionError"

  /api/pull-requests/checks:
    get:
      operationId: getPullRequestChecks
      summary: List every job/check run against a pull request's head commit, on demand
      description: |
        Fetched live on every call, never as part of GET /api/dashboard's
        own snapshot — this is detail a pull request's row doesn't show
        until a caller actually asks for it, and adding it to the eager
        refresh loop would multiply that refresh's cost by every open
        pull request for data most of them are never opened for.

        Falls back to the legacy combined commit-status API's own
        per-check entries when the forge reports no Actions runs at all
        for that commit (Actions disabled, or an instance too old to
        expose them) — never an error for that case specifically, since
        it's a normal, expected shape for an older or CI-less repo.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: forge
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Forge"
        - name: fullName
          in: query
          required: true
          schema:
            type: string
          description: '"owner/repo", matching a Repo.fullName from GET /api/dashboard.'
        - name: number
          in: query
          required: true
          schema:
            type: integer
          description: Matching a PullRequest.number from GET /api/dashboard.
      responses:
        "200":
          description: Every check/job found for that commit — empty when none were.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequestChecksResponse"
        "400":
          description: '`number` wasn''t an integer, `fullName` wasn''t "owner/repo", no credentials are saved for that forge, or that forge''s client doesn''t support listing pull request checks at all.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The forge rejected the request as unauthorized — the saved token's scope doesn't cover reading checks, or it isn't allowed to see that repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The forge reported the repo or pull request doesn't exist (or isn't visible to this token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The forge rate-limited the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/pull-requests/details:
    get:
      operationId: getPullRequestDetails
      summary: Read a pull request's description, comments and reactions, on demand
      description: |
        What the pull request dialog shows: the description, the
        conversation in order, the thumbs up and thumbs down reactions on each
        with who gave them, and, for a release pull request, the release
        notes. Fetched live on every call, never as part of GET
        /api/dashboard's snapshot: comments and reactions for every row would
        spend the forge's budget on rows nobody opens.

        GitHub answers with one GraphQL query. Forgejo costs one call for the
        pull request, one for its comments, one for the description's
        reactions and one for each comment's reactions (up to 50), so the
        reaction calls run at most eight at a time and stop at the first rate
        limit.

        Every text is Markdown exactly as the forge stores it (`format` is
        always `markdown`). The server neither converts nor sanitises it, so
        a client must render it with raw HTML disabled. Each text is cut at
        20,000 characters (`truncated`), the conversation keeps its first 50
        comments (`commentsTruncated`, with the full `commentCount`), and a
        reaction names at most its first 10 people while `count` is the full
        number. An avatar is the forge's own URL, passed through unchanged
        and never proxied; this app sets no Content-Security-Policy today, so
        the browser loads it directly. A future policy's `img-src` has to
        allow avatars.githubusercontent.com, repository-images.githubusercontent.com
        (a GitHub repository's logo, see `logoUrl` on a repo in GET
        /api/dashboard) and the Forgejo host.

        The error answers are those of GET /api/pull-requests/checks, with
        the same codes. A forge that can't be read is an error, never an
        empty thread.
      tags: [pull-requests]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: forge
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Forge"
        - name: fullName
          in: query
          required: true
          schema:
            type: string
          description: '"owner/repo", matching a Repo.fullName from GET /api/dashboard.'
        - name: number
          in: query
          required: true
          schema:
            type: integer
          description: Matching a PullRequest.number from GET /api/dashboard.
      responses:
        "200":
          description: The pull request's description, conversation and, for a release pull request, release notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequestDetails"
        "400":
          description: '`number` wasn''t an integer, `fullName` wasn''t "owner/repo", no credentials are saved for that forge, or that forge''s client can''t read pull request details.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: No valid session cookie or token was presented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "The forge rejected the request as unauthorized: the saved token's scope doesn't cover reading this pull request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The forge reported the repo or pull request doesn't exist (or isn't visible to this token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The forge rate-limited the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The forge was unreachable, or answered with something this app couldn't classify more specifically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Synchronous, before first paint, so there's no flash of the
		     wrong theme — theme.js reads the cookie app.js's toggle writes
		     and applies it immediately. Same contract every vanilla page
		     still uses (see rules/architecture-docs.md-worthy note in
		     theme.js's own header comment). -->
		<script src="/theme.js"></script>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
		/>
		<link rel="stylesheet" href="/style.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Forge Board</title>
<script src="theme.js"></script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .auth-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
  }
  .auth-wrap footer { width: 100%; max-width: 360px; }
  .auth-card {
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 24px;
  }
  .auth-card .brand-mark { margin: 0 auto 16px; }
  .auth-card h1 { font-size: 18px; margin: 0 0 4px; text-align: center; }
  .auth-card p.sub { margin: 0 0 22px; text-align: center; font-size: 13px; color: var(--ink-3); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 5px; }
  .field input {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 9px 11px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface-sunken);
    color: var(--ink);
  }
  .field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .auth-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
  .btn {
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    text-align: center;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-secondary { background: var(--surface-sunken); color: var(--ink-2); border-color: var(--border-strong); }
  .btn-secondary:hover { color: var(--ink); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .status {
    margin-top: 14px;
    font-size: 12.5px;
    text-align: center;
    min-height: 1.4em;
  }
  .status.error { color: var(--critical); }
  .status.ok { color: var(--good); }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand-mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="6" cy="6" r="2.4" stroke="#eef1f6" stroke-width="1.6"/>
        <circle cx="6" cy="18" r="2.4" stroke="#eef1f6" stroke-width="1.6"/>
        <circle cx="18" cy="12" r="2.4" stroke="#eef1f6" stroke-width="1.6"/>
        <path d="M6 8.4V15.6" stroke="#eef1f6" stroke-width="1.6"/>
        <path d="M8.2 7.2 15.8 10.8" stroke="#eef1f6" stroke-width="1.6"/>
        <path d="M8.2 16.8 15.8 13.2" stroke="#eef1f6" stroke-width="1.6"/>
      </svg>
    </div>
    <h1>Forge Board</h1>
    <p class="sub">Sign in with a passkey — no password, ever.</p>

    <form id="login-form">
      <div class="field">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" autocomplete="username webauthn" required autofocus>
      </div>
      <div class="auth-actions">
        <button type="submit" class="btn btn-primary" id="login-submit">Sign in with a passkey</button>
        <button type="button" class="btn btn-secondary" id="show-register">Register a new passkey instead</button>
      </div>
    </form>

    <form id="register-form" hidden>
      <div class="field">
        <label for="register-username">Username</label>
        <input id="register-username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="register-display-name">Display name</label>
        <input id="register-display-name" name="displayName" autocomplete="name" required>
      </div>
      <div class="auth-actions">
        <button type="submit" class="btn btn-primary" id="register-submit">Create passkey</button>
        <button type="button" class="btn btn-secondary" id="show-login">Back to sign in</button>
      </div>
    </form>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <footer>
    Read-only mirror of both forges &middot; credentials never leave <span class="mono">forge-dashboard</span>'s backend
    <span id="footer-version"></span>
  </footer>
</div>

<script src="footer.js"></script>
<script src="login.js"></script>
</body>
</html>

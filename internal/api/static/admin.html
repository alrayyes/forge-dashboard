<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Forge Board</title>
<script src="theme.js"></script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .admin-wrap { max-width: 760px; margin: 0 auto; padding: 28px 0 64px; }
  .admin-header { margin-bottom: 22px; }
  .admin-header h1 { font-size: 19px; margin: 0; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px;
    margin-bottom: 18px;
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 10px 12px; white-space: nowrap; }
  th {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-2);
    border-bottom: 1px solid var(--border);
  }
  td { border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  .admin-badge {
    font-size: 11px;
    font-weight: 500;
    color: var(--accent-ink);
    background: var(--accent);
    border-radius: 999px;
    padding: 1px 8px;
  }
  .row-actions { display: flex; gap: 8px; }
  .btn {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-strong);
    background: var(--surface-sunken);
    color: var(--ink);
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  /* Neither --critical on --surface-sunken (4.29:1) nor on --critical-bg
     (3.94:1) clears the 4.5:1 WCAG AA text-contrast floor — axe-core
     caught both, live. Danger is a red border and bolder weight instead;
     the text itself stays --ink, the same color every other button's
     text already passes contrast with on this exact background. */
  .btn-danger { border-color: var(--critical); font-weight: 600; }
  .status { font-size: 12.5px; min-height: 1.4em; margin: 0 0 12px; }
  .status.error { color: var(--critical); }
  .status.ok { color: var(--good); }
  .empty-state { font-size: 13px; color: var(--ink-3); padding: 8px 0; }

  /* Below this width the table no longer fits without scrolling
     sideways, which real device testing found people don't discover on
     their own — a stacked card per user replaces it instead. The
     <thead>/<th> markup stays in the DOM (visually hidden, not
     display:none) so a screen reader still gets real table semantics;
     each <td> labels itself via data-label. */
  @media (max-width: 640px) {
    .card { overflow-x: visible; padding: 8px; }
    table, tbody, tr, td { display: block; }
    thead {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
      padding: 0;
      margin: -1px;
    }
    tbody tr {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 14px;
      margin-bottom: 10px;
    }
    tbody tr:last-child { margin-bottom: 0; }
    td {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      white-space: normal;
    }
    td:last-child { border-bottom: none; }
    td::before {
      content: attr(data-label);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-2);
      flex: none;
    }
    td.row-actions { justify-content: flex-end; }
    td.row-actions::before { content: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="/" aria-label="Forge Board home">
      <div class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="6" cy="6" r="2.4" stroke="#eef1f6" stroke-width="1.6"/>
          <circle cx="6" cy="18" r="2.4" stroke="#eef1f6" stroke-width="1.6"/>
          <circle cx="18" cy="12" r="2.4" stroke="#eef1f6" stroke-width="1.6"/>
          <path d="M6 8.4V15.6" stroke="#eef1f6" stroke-width="1.6"/>
          <path d="M8.2 7.2 15.8 10.8" stroke="#eef1f6" stroke-width="1.6"/>
          <path d="M8.2 16.8 15.8 13.2" stroke="#eef1f6" stroke-width="1.6"/>
        </svg>
      </div>
      <div>
        <h1>Forge Board</h1>
      </div>
    </a>
    <div class="header-status">
      <span class="mono" id="whoami" style="font-size:12px;color:var(--ink-3);"></span>
      <nav class="app-nav" aria-label="Main">
        <a class="theme-toggle" href="/" aria-label="Home" title="Home" style="text-decoration:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>
        </a>
        <a class="theme-toggle" href="/insights.html" aria-label="Insights" title="Insights" style="text-decoration:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18.7 8 13 13.7l-3-3L4 16.7"/></svg>
        </a>
        <a class="theme-toggle" href="/webhooks.html" aria-label="Webhooks" title="Webhooks" style="text-decoration:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </a>
        <a class="theme-toggle" href="/settings.html" aria-label="Settings" title="Settings" style="text-decoration:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
        <a class="theme-toggle" href="/admin.html" id="admin-link" aria-label="Admin" title="Admin" style="text-decoration:none;" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.2A8.5 8.5 0 1 1 9.8 4a6.7 6.7 0 0 0 10.2 10.2Z"/></svg>
      </button>
      <button class="theme-toggle" id="logout-button" type="button" aria-label="Sign out" title="Sign out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>
</div>
<div class="admin-wrap">
  <div class="admin-header">
    <h1>Admin</h1>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th scope="col">Username</th>
          <th scope="col">Display name</th>
          <th scope="col">Registered</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody id="user-rows"></tbody>
    </table>
    <p class="empty-state" id="empty-state" hidden>No other users are registered.</p>
  </div>

  <footer>
    Read-only mirror of both forges &middot; credentials never leave <span class="mono">forge-dashboard</span>'s backend
    &middot; <a href="https://github.com/alrayyes/forge-dashboard" target="_blank" rel="noopener noreferrer">Source</a>
    <span id="footer-version"></span>
  </footer>
</div>

<script src="footer.js"></script>
<script src="nav.js"></script>
<script src="theme-toggle.js"></script>
<script src="admin.js"></script>
</body>
</html>

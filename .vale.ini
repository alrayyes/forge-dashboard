StylesPath = styles
MinAlertLevel = warning

# Downloaded by `vale sync`, not committed. The style folders they land in are
# gitignored by name; styles/config/ is ours and is not.
#
# Pinned to exact releases. A bare name means "latest", and proselint v0.4.0
# (19 Nov 2026) turned CurlyQuotes on for straight quotes the pinned Vale
# (scripts/vale.sh) doesn't evaluate as intended. Bump these by hand, with the
# Vale pin, and run scripts/vale.sh over the repo first.
# scripts/test-vale-pin.sh fails on a bare name.
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.2/Google.zip, https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip

# Core options first — Vale refuses a Vocab set after a format section.
Vocab = House

[*.md]
BasedOnStyles = Vale, Google, proselint

# Holds the document to the spellings in the vocabulary — "Github", "NPM" and
# "javascript" get flagged where GitHub, npm and JavaScript are the accepted
# forms. Without it, accept.txt only silences the spell checker and any casing
# passes.
Vale.Terms = YES

# Off on purpose. Docs here are written to a person — "you" — not narrated as
# "we", and the point of that voice is the contractions it reads with.
Google.We = NO
Google.FirstPerson = NO
Google.Contractions = NO

# Every heading in this repository is a sentence, not a title, and the rule
# fires on product names in them rather than on the style.
Google.Headings = NO

# Spaced em dashes are deliberate house typography, not a mistake to flag
# thirty times until everyone stops reading the tier that found it.
Google.EmDash = NO

# British punctuation: commas and full stops go outside the quotation marks
# unless they belong to the quoted text. Google's guide is American and wants
# them inside — this repo is consistently British ("licence", "colour"), so
# the rule would be asking it to be half one thing and half the other.
Google.Quotes = NO

# Same story as Google.Quotes just above: this rule flags "colour",
# "labour", "centre" and the -ise/-ised/-ising family as needing American
# spelling, which is the opposite of this repo's own house style — and the
# opposite of what LTeX (.ltex.json's ltex.language: en-GB) actually
# enforces. Left on, the two tiers disagree on every British spelling in
# the repo, one demanding what the other rejects (caught live: this rule
# waving "colour" to "color" in docs/webhooks.md, which LTeX then flagged
# right back).
Google.Spelling = NO

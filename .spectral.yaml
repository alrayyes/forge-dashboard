# OWASP's API security rules (rules/api.md, "Spectral"). Errors fail the
# lint; warnings are printed and don't. Every rule turned off says why.
extends: ["@stoplight/spectral-owasp-ruleset"]

rules:
  # No general inbound rate limiting exists, so there are no RateLimit headers
  # to describe. The one throttle, the force-refresh cooldown, answers 200
  # with a Retry-After header (#809).
  owasp:api4:2023-rate-limit: off

  # The API is same-origin: the page and the API share a host and the server
  # sends no CORS headers. The rule fires on any documented response header,
  # so declaring Retry-After would otherwise demand one.
  owasp:api8:2023-define-cors-origin: off

  # The stock limit rules flag every string, integer and array in the spec,
  # response-only shapes included, where a bound protects nothing and the
  # server writes the value itself. They stay off, and the three
  # `request-*-limit` rules below hold request bodies to the same bar (#1008).
  owasp:api4:2023-string-limit: off
  owasp:api4:2023-string-restricted: off
  owasp:api4:2023-integer-limit: off
  owasp:api4:2023-integer-format: off
  owasp:api4:2023-array-limit: off

  # Every string, whole number and list a client can send is bounded. The
  # opaque shapes (WebAuthn, the filter state) declare no properties, so only
  # the body cap bounds them.
  request-string-limit:
    description: A string in a request body needs maxLength.
    severity: error
    given: "$.paths[*][*].requestBody.content[*].schema..properties[?(@.type == 'string' && @.format != 'date-time')]"
    then:
      field: maxLength
      function: truthy

  request-integer-limit:
    description: An integer in a request body needs maximum.
    severity: error
    given: "$.paths[*][*].requestBody.content[*].schema..properties[?(@.type == 'integer')]"
    then:
      field: maximum
      function: truthy

  request-array-limit:
    description: An array in a request body needs maxItems.
    severity: error
    given: "$.paths[*][*].requestBody.content[*].schema..properties[?(@.type == 'array')]"
    then:
      field: maxItems
      function: truthy

  # One bearer scheme for everyone, with the admin check on the server
  # (auth.RequireAdmin). A second scheme would add nothing the server doesn't
  # already enforce.
  owasp:api5:2023-admin-security-unique: off

  # Public on purpose: the passkey ceremony, logout, health and version, and
  # the webhooks. Those declare `security: []` and the rule still flags
  # them, so it can't be satisfied from the spec.
  owasp:api2:2023-read-restricted: off
  owasp:api2:2023-write-restricted: off

  # The webhook path token only says whose webhook it is. What proves the
  # request came from the forge is its HMAC signature, and the invite token in
  # the revoke path is an identifier, not the one an invitee registers with.
  owasp:api2:2023-no-credentials-in-url: off
